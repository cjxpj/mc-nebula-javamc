# 版本占位：具体补丁号待拍板（见 ../design/neoforge.md 第 9 节）。
# 构建插件默认 ModDevGradle 2.x；改 NeoGradle 7.x 时同步调整 build.gradle。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 目标 Minecraft / NeoForge（1.21.x ↔ NeoForge 21.x）
# 注意：NeoForge 没有发布 21.1.0，21.1 系列从 21.1.1 起；这里取 21.1 最新补丁。
minecraft_version=1.21.1
neo_version=21.1.265

# 构建插件
moddevgradle_version=2.0.0

# 模组元信息（与 neoforge.mods.toml 保持一致）
mod_id=nebula_bridge
mod_version=0.1.0
mod_group=nebula.neoforge
mod_name=Nebula Bridge
mod_license=All Rights Reserved

# Rust 桥接产物
bridge_crate=nebula-neoforge-jni
