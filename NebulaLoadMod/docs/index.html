const DOCS = {"guide": {"file": "plugin-guide.md", "title": "词库插件开发指南", "group": "快速开始", "text": "# 词库插件开发指南\n\n> 面向**要写 `.n` 插件的人**。本文不解释桥接层怎么实现，只讲「一个插件从建目录到能跑、能调试」需要知道什么。\n> 当前环境：Minecraft 1.21.11 / NeoForge 21.11.42 / Java 21。\n>\n> **查 API 去 [`apis/README.md`](apis/README.md)**：按 LLSE 体例组织的 128 条方法手册，按类别分篇，\n> 每条都有签名、参数类型、返回值与示例；事件清单在 [`apis/事件.md`](apis/事件.md)。\n> 想了解桥接实现、事件来源与构建方式看 [`neoforge.md`](neoforge.md)；JNI 契约与词库加载规则看\n> [`bridge/README.md`](../../bridge/README.md)。契约表 [`mc-api-map.md`](mc-api-map.md) 面向改桥接的人。\n\n## 0. 五分钟上手\n\n**插件就是一个文件夹**。在专用服的 `<gameDir>/nebula/` 下建一个目录，写两个文件：\n\n```text\n<gameDir>/nebula/我的插件/\n├── main.n\n└── nebula.ini\n```\n\n`main.n`：\n\n```text\n// 行首 // 是注释\n[f]初始化\n问候:§a你好，欢迎来到星云\n\n[f]加载\n我的插件已加载\n\n[事件]玩家聊天\n如果:%消息%==你好\n    $世界.提示 %玩家名% %问候%$\n如果尾\n```\n\n`nebula.ini`（元数据，桥接层**不读取**，只是留档）：\n\n```ini\n名称 = 我的插件\n作者 = me\n地址 =\n版本 = 1.0.0\n描述 = 第一个星云插件\n```\n\n然后进游戏或控制台：\n\n```text\n/nebula load 我的插件       ← 首次加载\n/nebula list                ← 确认已加载\n```\n\n在聊天里发「你好」，会收到私聊提示。改完词库用 `/nebula load 我的插件` 生效；开发时开\n`/nebula debug 我的插件`，之后**保存文件就会自动重编译**，不用反复敲命令。\n\n> `main.n` 优先作为入口；同目录顶层的其它 `.n` 会自动合并进同一个命名空间，所以大插件可以拆成\n> `界面.n` / `配置.n` / `商品.n`（参考泥土商店）。`_[开头]` 或 `.[开头]` 的目录会被禁用。\n\n## 1. 词条与语法速查\n\n词库是**布局敏感**的：一个词条 = 一行「头」+ 紧随其后的正文行，词条之间用**块外空行**分隔。\n正文行**顶格写**，缩进只用在 `如果` / `否则` / `遍历` / `点击:[函数]` 这些块的**内部**；\n块必须闭合（`如果尾` / `结束`），漏一个整个插件编译失败。\n\n| 写法 | 含义 |\n| --- | --- |\n| `名:值` | 变量赋值。值可以是文本、`%变量%`、`$调用$` 或 `[%a%+%b%]`；赋原样 JSON 用 `名::{...}`（见第 7 节） |\n| 裸文本行 | 输出一行（事件里的输出会被宿主广播 / 回给玩家） |\n| `%名%` | 取变量；`%对象.字段%` 取 JSON 字段，如 `%玩家.名称%`、`%配置.货币%` |\n| `$函数 参数…$` | 调用内置函数 / 自定义函数 / `世界` 方法，**结尾的 `$` 不能漏** |\n| `[%a%+%b%]` | 数值运算（也支持 `-` `*` `/`），如 `总额:[%单%*%量%]` |\n| `// 注释` | 行注释 |\n| `\"带空格的文本\"` | 用双引号包住含空格的实参，如 `\"§7余额：§a%余% 个泥土\"` |\n\n条件与循环（**必须闭合**，否则整个插件编译失败）：\n\n```text\n如果:%消息%==帮助\n    $世界.提示 %玩家名% 用法：/签到$\n否则如果:%消息%==余额\n    ...\n否则\n    ...\n如果尾\n\n遍历:i,件=%表%\n    $世界.界面物品 %面% %件.槽% %件.物品% 1$\n结束\n```\n\n比较符实测可用：`==`、`!=`、`>`、`<`。函数与返回：\n\n```text\n[函数]查余额 玩家 货币\n余:$世界.取物品数 %玩家% %货币%$\n返回 %余%\n\n[指令]商店\n余:$查余额 %玩家名% minecraft:dirt$\n```\n\n- `[函数]名 参数A 参数B` 定义函数，调用写 `$名 值A 值B$`，函数体内用 `%参数A%`。\n- `返回 内容` 产生返回值；裸 `返回` 直接结束且不输出。\n- `[G]名字` 是公开函数（只改可见性，**不是**全局变量），`[f]名字` 是私有 / 生命周期函数。\n- **一行只能写一个 `$调用$`**；赋值行里最多一个。需要串联就拆成多行用中间变量。\n- 常用的内置函数：`$读文件 路径$`、`$JSON判断 文本$`、`$JSON键读 文本 键$`、\n  `$JSON键存 文本 键 值$`、`$去除左右 文本$`、`$文本长度 文本$`、`$数字格式化 数 位数$`、\n  `$引用 函数名$`。\n- JSON 作为实参时**不要带空格**（`{\"货币\":\"minecraft:dirt\"}`），否则会被按空格切参数。\n\n## 2. 生命周期钩子（最容易写错的地方）\n\n| 钩子 | 什么时候跑 | 该放什么 |\n| --- | --- | --- |\n| `[f]初始化`（编译前另有 `@头部` 触发） | **每次编译**：load / loadAll / debug 自动重编译 | 配置默认值、读 JSON、状态初始化、`$世界.注册指令$` |\n| `[f]加载` | 仅 `/nebula load` 与开服 `loadAll`（插件首次插入） | 「插件已就绪」这类只提示一次的文案 |\n| `[f]自检` | 词库侧约定的词条（连锁砍树里有） | 打印插件状态；`/nebula` **没有**对应子命令 |\n\n三个高频误解：\n\n1. **「初始化只跑一次」是错的**。它每次编译都跑，所以注册指令必须幂等（宿主侧已做去重），\n   别在这里累加计数或写一次性副作用。\n2. **`[f]加载` 只在插件第一次插入时跑**，所以「已加载」提示放在这里是对的。\n   之后改词库只要再 `/nebula load <插件>`（重编译 + 跑 `[f]初始化`），没有单独的 reload 指令。\n3. **没有 `[f]卸载` 钩子了**。卸载由**加载器**按插件归属接管：指令、界面对象、生物对象、\n   事件订阅、资源包条目都会自动回收；`ServerStoppingEvent` 直接销毁引擎，也不需要保存状态。\n   要持久化就写文件。\n\n第四条，是 0.4.0 实测出来的坑：**`[f]初始化` 正文里 `变量:$调用$` 的赋值不落地。**\n\n```text\n[f]初始化\n剑:$世界.注册物品 nebula:star_sword$     ← 剑 取不到对象，下面这行等于空调用\n$剑.生效$\n```\n\n表现是「编译成功、零诊断、但东西没注册」。原因是初始化帧里这种赋值语句不生效，\n变量没有值，后续 `$剑.生效$` 自然调不到对象。\n\n**边界要说准**：\n\n- **不用接返回值**就不用函数 —— `$世界.注册物品 <配置.json>$`、`$世界.注册指令 …$`\n  这类只触发副作用的，直接写在初始化里完全正常。\n- **要用变量接住**（`剑:$世界.创建界面 …$` → `$剑.设 …$` → `$剑.生效$`）就必须放进 `[函数]`，由初始化调用。\n\n> 注意：Tab 页眉 / 侧边栏显示 / 世界里召唤过的实体是**玩家可见状态**，加载器不知道插件设过什么，\n> 卸载后会残留到下一次 `load` 或玩家重进服。需要立即复原就在 `[f]加载` 里重设一遍，别指望卸载钩子。\n\n调试自动重编译只跑 `初始化`，不会跑 `加载` / `重载` / `卸载`。\n\n## 3. 作用域：配置为什么总要传参\n\n这是写多文件插件时最常卡住的一点：\n\n- **事件帧**的父作用域是 `plugin.state`，能读到 `[f]初始化` 里赋的配置变量。\n- **`[函数]` 帧**的父作用域是词库 root，**不继承调用方作用域**——既读不到事件里的 `%玩家%`，\n  也读不到运行时配置。配置、玩家名、选中数据都要**显式传参**。\n\n```text\n[事件]方块破坏\n// 错：函数里读不到 %玩家% 和 %上限%\n结果:$砍伐 %方块%$\n\n// 对：把需要的东西都作为参数传进去\n结果:$砍伐 %方块% %玩家.名称% %上限%$\n```\n\n唯一例外是**闭包**：`点击:[函数] … 结束` 定义的函数值会按值捕获当时的局部变量，\n点击时这些变量还在（见第 7 节）。\n\n## 3.1 尾部参数可以省略\n\n`$世界.xxx …$` 是按位置传实参的。`world-specs.json` 里写了 `default` 的**尾部参数**可以不写，\n例如 `$世界.给予物品 Steve minecraft:diamond$` 等价于数量 1，\n`$世界.加效果 Steve minecraft:speed$` 等价于 30 秒 / 1 级。\n**不要省略中间参数**：`$世界.加效果 Steve minecraft:speed 1$` 里的 `1` 会被当成「秒」，\n而不是「等级」。完整清单与默认值见 [`mc-api-map.md`](mc-api-map.md) 第 0 节的\n「可选尾参」表。\n\n## 4. 事件与变量\n\n当前宿主**内置 6 个中文事件**（下表）；另有 **8 个中文别名词条**（7 个玩家交互 +\n玩家退出，见 4.1），不用写 Java 类名；其它事件走**通用事件桥**，用 Java 事件简名订阅\nNeoForge 总线上的 267 个事件，见 [`apis/事件.md`](apis/事件.md)。\n\n| 词条 | 触发 | 主要变量 | 可取消 |\n| --- | --- | --- | --- |\n| `[事件]玩家聊天` | 玩家发言 | `%玩家%`（JSON）/ `%玩家名%` / `%消息%` / `%管理员%` / `%潜行%` / `%维度%` / `%x%` `%y%` `%z%` | 是 |\n| `[事件]实体受伤` | 实体掉血后（任意来源） | `%攻击者%` / `%攻击者名%` / `%实体%` / `%实体名%` / `%伤害%` / `%剩余%` / `%最大血量%` / `%身高%` / `%暴击%` / `%原因%` / `%致死%` | 否（伤害已结算） |\n| `[事件]实体治疗` | 实体回血且未满血 | `%实体%` / `%实体名%` / `%数值%` / `%之前%` / `%剩余%` / `%最大血量%` / `%身高%` / `%原因%` / `%满血%` | 否（回血已发生） |\n| `[事件]方块破坏` | 玩家破坏方块 | `%玩家%`（含 `.手持物品.名称%`）/ `%玩家名%` / `%方块%`（`.名称%` / `.数据%` / `.维度%`）/ `%坐标%` / `%工具%` / `%模式%` / `%维度%` / `%x%` `%y%` `%z%` | 是 |\n| `[事件]玩家进入` | 每次连接成功（含重连） | `%玩家%`（JSON）/ `%玩家名%` / `%管理员%` / `%维度%` | 否 |\n| `[事件]每秒` | 每 20 tick（约 1 秒） | `%服务器tick%` / `%在线人数%` | 否 |\n\n- 玩家、实体、方块这类变量是 **JSON 对象**，用 `%玩家.名称%`、`%方块.名称%` 取字段。\n- 想取消事件：$世界.取消事件$（聊天 / 方块破坏有效）。\n- **事件里的裸文本行会被宿主广播 / 回给玩家**；只想让某个玩家看到，用 `$世界.提示 玩家 文本$`。\n- payload 只含基础类型与 JSON，拿不到 Java 对象；别试图跨线程持有任何东西。\n\n### 4.1 中文交互事件（推荐写法）\n\n玩家左右键交互不必写 Java 类名，直接用中文词条名，payload 也全是中文键：\n\n| 词条 | 对应事件 | 触发 |\n| --- | --- | --- |\n| `[事件]右键物品` | `PlayerInteractEvent.RightClickItem` | 使用物品（右键） |\n| `[事件]右键方块` | `PlayerInteractEvent.RightClickBlock` | 右键点方块 |\n| `[事件]右键空气` | `PlayerInteractEvent.RightClickEmpty` | 右键没命中 |\n| `[事件]左键方块` | `PlayerInteractEvent.LeftClickBlock` | 左键点方块 |\n| `[事件]左键空气` | `PlayerInteractEvent.LeftClickEmpty` | 左键没命中 |\n| `[事件]右键实体` | `PlayerInteractEvent.EntityInteract` | 右键点实体 |\n| `[事件]右键实体部位` | `PlayerInteractEvent.EntityInteractSpecific` | 右键点实体部位 |\n\n另外 `[事件]玩家退出` → `PlayerEvent.PlayerLoggedOutEvent` 也走同一张别名表\n（玩家离线时撤掉侧边栏数据），变量与其它玩家类事件一致。\n\n中文变量：`%玩家名%` / `%玩家%` / `%维度%` / `%x%` `%y%` `%z%` / `%物品%` / `%数量%` /\n`%手%`（主手、副手）/ `%主手%`（是、否）/ `%方块x%` `%方块y%` `%方块z%` / `%坐标%` /\n`%面%`（上 下 北 南 东 西）/ `%面英文%` / `%目标%` / `%目标名%` / `%事件名%`。\n英文键（`%entity.name%` 等）仍保留，但新插件建议全用中文。\n\n```text\n[事件]右键物品\n人:%玩家名%\n物:%物品%\n$世界.提示 %人% 你拿着 %物%$\n```\n\n中文名来自事件清单的 `cnNames`（**旧 jar 不认**，会静默不触发）；同一个事件别中英\n各写一个词条头，否则一次交互分发两遍。完整变量对照见\n[`apis/事件.md`](apis/事件.md) 的「中文交互事件」。\n\n**想接上表与交互事件之外的事件**，直接写 Java 类名，宿主按订阅动态注册监听器：\n\n```text\n[事件]EntityJoinLevelEvent\n$世界.提示 %entity.name% 欢迎$\n```\n\n字段名来自 Java getter（`getEntity()` → `%entity%`），内置事件仍用中文名。高频 tick 事件\n被节流到每秒一次，加载期事件收不到——规则与完整清单见\n[`apis/事件.md`](apis/事件.md) 的「通用事件桥」一节。改完词库 `/nebula load <插件>`\n就会刷新订阅表，不用重启服务端。\n\n## 5. 调用 `世界` 原语\n\n语法是 `$世界.方法 参数…$`。\n\n```text\n余:$世界.取物品数 %玩家名% minecraft:dirt$      ← 查询：立即返回结果，可以赋值\n$世界.给物品 %玩家名% minecraft:diamond 3$       ← 动作：排队，dispatch 返回后才落地\n$世界.提示 %玩家名% §a已发放$\n```\n\n**动作是延迟执行的**：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的还是旧值，\n要到下一次事件 / 重编译才生效。写成「先查 → 再改 → 立刻回读验证」会得到假失败，验证请换一次\n事件或用宿主的查询接口。\n\n常用方法速查（完整 128 个按类别分篇在 [`apis/`](apis/README.md)）：\n\n| 用途 | 方法 |\n| --- | --- |\n| 私聊 / 动作栏 / 标题 | `提示`、`动作栏`、`标题` |\n| 飘字（RPG 伤害数字 / 全息文字） | `悬浮字` |\n| 音效 / 粒子 | `音效`、`生成粒子` |\n| 物品 | `给物品`、`扣物品`、`取物品数`、`取背包物品`、`设背包物品` |\n| 玩家 | `取玩家状态`、`取玩家列表`、`传送玩家`、`设置模式`、`加效果`、`玩家加标签`、`设置Tab列表` |\n| 方块 | `取方块`、`设方块`、`设方块状态`、`填充区域`、`破坏方块`、`取相邻方块` |\n| 世界 | `取时间` / `设时间`、`设难度`、`设游戏规则`、`执行命令`、`广播` |\n| 指令 / 界面 | `注册指令`、`注销指令`、`创建界面`、`界面物品`、`打开界面`、`关闭界面` |\n\n几个真机踩过的坑：\n\n- **玩家目标用名字**：`give` / `experience` / `effect` 这类命令会拒绝 UUID 字面量，\n  统一用 `%玩家名%` 或 `%玩家.名称%`，别传 `%玩家.uuid%`。\n- **`$世界.执行命令 say …$` 有 256 字符上限**：`取实体列表` 这类长结果要么传 `上限`，要么分批。\n- **未加载区块的方块查询返回空**：先 `$世界.区块已加载$` 判断，或让管理员 `/forceload add`。\n- `%时间%` / `%版本%` 是引擎内置变量，词库里同名赋值会被遮蔽，变量名加前缀（如 `%SC时刻%`）。\n\n## 6. 插件指令\n\n指令由**词库自己注册**，不写进 `nebula.ini`：\n\n```text\n[f]初始化\n$世界.注册指令 签到 0 sign$\n\n[指令]签到|sign\n参:$去除左右 %参数%$\n如果:%参%==帮助\n    $世界.提示 %玩家名% \"§7/签到 领一份见面礼\"$\n    返回\n如果尾\n```\n\n- `注册指令 规范名 [权限 0~4] 别名…`；规范名决定 `%指令%` 的值（用 `/sign` 进来也是「签到」）。\n- `[指令]规范名|别名1|别名2` 头里列出所有入口，宿主按规范名匹配后**只跑命中的那一条**；\n  没有 `[指令]` 词条时返回 `ok=false`，不会回退到统一事件。\n- 指令词条里可用变量：`%玩家%` / `%玩家名%` / `%指令%`（规范名）/ `%参数%`（玩家输入的整串）/ `%管理员%`。\n- 重复注册是幂等的；**改名 / 删名后的旧入口由加载器自动下线**（每次编译按批次对账，不需要写注销，也不用重启）。\n- 执行结果的输出行会回给执行者；控制台执行也一样。\n\n## 7. 配置与数据文件\n\n配置文件放插件同目录，用 `%库目录%` 定位（编译时由桥接层注入到词库 root，函数帧也能读）：\n\n```text\n[函数]默认配置\n文::{\"货币\":\"minecraft:dirt\",\"货币名\":\"泥土\"}\n%文%\n\n[函数]配置数据\n文:$读文件 %库目录%/配置.json$\n如果:$JSON判断 %文%$!=true\n    文:$默认配置$\n如果尾\n%文%\n\n[f]初始化\n配置:$配置数据$\n```\n\n- `文::{\"a\":1}` 这种**双冒号**写法用来赋一段原样 JSON（单冒号会把内容当表达式）。\n- `$读文件 路径 [默认值]$` 读整份文件；JSON 不要带空格以免被切参数。\n- `$JSON判断$` / `$JSON键读$` / `$JSON键存$` 用来校验、取字段、改字段。\n- `.json` 和 `.n` 一起纳入 debug 指纹，改配置也会自动重载；没开 debug 就 `/nebula load <插件>`。\n- 文件缺失或非法 JSON 时给内置默认值，别让插件整个起不来。\n\n### 7.1 资源：图片 / 模型 / 语言文件\n\n插件目录下的 **`资源/`** 会被 `NebulaPack` 翻译成标准资源包路径，随服下发给客户端。\n目录按**资源类型**用中文分，不用记 `assets/` 那套嵌套：\n\n```text\nnebula/箱子生物/\n├── main.n\n└── 资源/\n    ├── 物品列表/chest_creature_spawn_egg.json      → assets/nebula/items/item/…\n    ├── 物品模型/chest_creature_spawn_egg.json      → assets/nebula/models/item/…\n    ├── 物品材质/chest_creature_spawn_egg.png       → assets/nebula/textures/item/…\n    ├── 方块状态/chest_creature_body.json           → assets/nebula_bridge/blockstates/…\n    ├── 方块模型/chest_creature_body.json           → assets/nebula_bridge/models/block/…\n    └── 实体材质/chest_creature.png                 → assets/nebula_bridge/textures/entity/…\n```\n\n| 资源类型目录 | 包内路径 | 默认命名空间 |\n| --- | --- | --- |\n| `物品列表` | `items/item/` | `nebula` |\n| `物品模型` | `models/item/` | `nebula` |\n| `物品材质` | `textures/item/` | `nebula` |\n| `方块状态` | `blockstates/` | `nebula_bridge` |\n| `方块模型` | `models/block/` | `nebula_bridge` |\n| `方块材质` | `textures/block/` | `nebula_bridge` |\n| `实体材质` | `textures/entity/` | `nebula_bridge` |\n| `粒子` / `音效` / `语言` / `界面` | `particles/` `sounds/` `lang/` `textures/gui/` | `nebula_bridge` |\n| `客户端` | `client/` | `nebula` |\n\n- `物品列表` 落到 `items/item/`，因为物品的 `item_model` 组件统一写 `nebula:item/<名字>`。\n- **方块模型只能引用 `方块材质/`（`textures/block/`）的贴图**：方块图集只自动收 `block/`、`item/` 两个目录，\n  引用 `实体材质/`（`textures/entity/`）会报 `Missing textures in model …` 并渲染成品红/黑的缺图格。\n  `实体材质/` 是给实体模型（`EntityModel` + `LayerDefinition`）用的。\n- 表里没有的类型，可以走「原样命名空间」：`资源/<命名空间>/…` → `assets/<命名空间>/…`（例如 `资源/nebula/font/…`）。\n- **只认 `资源/`**：插件根目录下的 `assets/` 不会被扫描；资源包由 mod 在开服时收集所有插件的 `资源/` 生成，没有共享底板目录。\n- `pack.mcmeta` 由 mod 内建，词库目录里不需要放资源包骨架；同名资源按插件目录名排序先到先得，重名会记 WARN。\n- 一个插件的 `资源/` 都没有时，mod 不生成也不投送资源包（服务器照常运行，纯原版外观）。\n- **改完资源必须重启服务端**（资源包在启动时打包，sha 变了客户端才会重下）；只改 `.n` 用 `/nebula load`。\n- 打包按条目名排序、时间戳固定，所以**包内路径不变时 sha1 一定不变**——挪目录、改目录名不会让玩家重下。\n\n### 7.2 客户端声明（`资源/客户端/*.json`）\n\n客户端 mod 里没有任何写死的外观或文案。插件把客户端表现写进 `资源/客户端/<名字>.json`，\n`NebulaPack` 打成 `assets/nebula/client/*.json` 随资源包下发，客户端 `ClientDecls` 合并后读取：\n\n```json\n{\n  \"实体外观\": {\n    \"nebula_bridge:chest_creature\": {\n      \"方块\": \"nebula_bridge:chest_creature_body\",\n      \"偏移\": [-0.5, 0.0, -0.5],\n      \"阴影\": 0.45\n    }\n  },\n  \"更新提示\": {\n    \"开关\": \"是\",\n    \"端口\": 25568,\n    \"文案\": \"§d[星云] §fmod 有新版本 §e{版本} §7（当前 §f{本地}§7）\"\n  }\n}\n```\n\n- `实体外观`：按实体 id 声明「画哪个方块状态 / 平移 / 阴影」；**没有声明就不画**，mod 不内置外观。\n- `更新提示`：开关为 `否` 或整块缺失时客户端完全不做版本检查；文案的 `{版本}` / `{本地}` 由 mod 填值。\n- 多个插件都写了 `资源/客户端/` 时按目录名合并，先写到的键优先。\n- 改完声明要重启服务端（资源包 sha 变了客户端才会重下）；进服时 `ClientDecls` 会重新读一遍。\n\n### 7.3 自定义物品：一件一个配置文件\n\n物品**不写在 `main.n` 里**，放在 `定义/` 下，一个 `.json` 一件：\n\n```json\n{\n  \"名称\": \"星云剑\",\n  \"基底\": \"minecraft:diamond_sword\",\n  \"颜色\": \"light_purple\",\n  \"稀有度\": \"epic\",\n  \"耐久\": 500,\n  \"外观\": \"star_sword\",\n  \"描述\": [\n    { \"文本\": \"攻击力 11 · 右键：星光斩\", \"颜色\": \"gray\" }\n  ],\n  \"属性\": [\n    { \"属性\": \"minecraft:attack_damage\", \"数值\": 10.0, \"运算\": \"add_value\", \"槽位\": \"mainhand\" }\n  ]\n}\n```\n\n`main.n` 里一件物品一个函数，读文件与设值都在词库这边：\n\n```text\n[f]初始化\n$注册剑 %库目录%$\n\n[函数]注册剑 库\n剑文:$读文件 %库%/定义/star_sword.json$\n剑:$世界.注册物品 nebula:star_sword$\n$剑.载入 %剑文%$\n$剑.生效$\n```\n\n两条实测出来的约束：\n\n- **要接住对象（`剑:$…$`）就得在函数帧里** —— `[f]初始化` 正文的赋值不落地。\n- **一件物品一个函数**：`$读文件$` 的返回值含换行，和别的物品挤在同一个函数里会吞掉后面的语句，\n  表现是「只注册了第一件，其余静默不执行」。分开写互不影响，配置文件也不用压成单行。\n\n| 字段 | 必填 | 说明 |\n| --- | --- | --- |\n| `物品` | 否 | **已不需要**：id 由 `$世界.注册物品 x$` 那一行决定（`x` 可省略 `nebula:` 前缀） |\n| `名称` / `基底` | 是 | 名称与**原版**基底物品 id |\n| `外观` | 否 | 贴图名：派生 `items/item/<名>.json` 与 `models/item/<名>.json`，贴图取 `资源/物品材质/<名>.png`；也接受 `nebula:item/xxx` 全名 |\n| `颜色` / `稀有度` | 否 | `light_purple` / `epic` 这类原版枚举名，写错就当没写 |\n| `堆叠` / `耐久` | 否 | 有 `耐久` 时强制单件堆叠 |\n| `描述` / `属性` / `食物` | 否 | 数组或对象，见 `物品/定义/` 里的现成例子 |\n\n- **成品去处是创造模式的「星云物品」一栏**，注册什么就在那一栏出现什么；不再散到原版各页，也不需要指令发放。\n- **加一件物品 = 加一个配置文件 + 一个注册函数 + 初始化里一行调用**；删物品把这几处一起去掉，\n  本批没声明的物品由批次对账自动下线（日志会写 `物品下线：<id>`），不需要写注销。\n- 配置里的 `[ ]` `\"` 不会被词库语法碰到 —— 这正是把它挪出 `.n` 的好处（词库实参按空格切、含 `]` 要转义）。\n\n### 7.4 什么时候需要换客户端 jar\n\n内容（词库、物品定义、贴图、界面、文案）全部由服务端在运行期下发，**改这些不用换客户端**。\n只有改**注册表条目**才必须两端同版本 —— NeoForge 握手会逐个比对注册表，服务端多一个条目客户端就进不来。\n\n| 改了什么 | 客户端要换吗 |\n| --- | --- |\n| `定义/*.json`、`main.n`、`资源/` | 不要，`/nebula load` 即可 |\n| `ItemRegistry` / `CreativeItems` / `MobRegistry` 等运行期逻辑 | 不要 |\n| `NebulaEntities` / `NebulaBlocks` / `NebulaCreativeTab`（注册项） | **要** |\n| `src/client/` 渲染器、`*Payload` 网络包 | **要** |\n\n构建时看这一行就够了：\n\n```text\nRegistry: unchanged (3e5aeff33940) - client jar NOT required\nRegistry: CHANGED (xxxxxxxxxxxx) - both sides need the same jar\n```\n\n它算的是「声明注册项的三个源文件的指纹」，与内容改动无关，所以改词库永远显示 `unchanged`。\n\n当前注册项池的容量上限，**写满要扩容，那也属于“要换”**：\n生物槽位 32（tiny/small/normal/large 各 8）、外观方块 32、创造页 1 个（`nebula:items`，所有物品共用）。\n\n## 8. 界面与点击闭包\n\n界面是**对象**：`创建界面` 返回 id，后续操作都带这个 id，点击逻辑写成函数值交给 `打开界面`。\n\n```text\n[函数]画菜单 玩家\n面:$世界.创建界面 %玩家% 3 §a我的菜单$\n$世界.界面物品 %面% 11 minecraft:lime_stained_glass_pane 1 \"§a领取\" \"§7点一下\" 是$\n$世界.界面物品 %面% 15 minecraft:barrier 1 \"§c关闭\"$\n点击:[函数]\n    点:%参数1%\n    槽:%点.槽位%\n    如果:%槽%==11\n        $世界.给物品 %玩家% minecraft:bread 4$\n        $世界.提示 %玩家% §a已领取$\n        $世界.关闭界面 %面%$\n        返回\n    如果尾\n    如果:%槽%==15\n        $世界.关闭界面 %面%$\n        返回\n    如果尾\n结束\n$世界.打开界面 %面% %点击%$\n```\n\n- `界面物品 面 槽位 物品 数量 名称 说明 [发光]`；说明里用 `|` 换行。\n- `点击:[函数] … 结束` 是**闭包**，按值捕获定义时的局部变量（`面` / `玩家` / `配置` / `表` 点击时都还在），\n  不用再塞「界面数据」或全局状态表。\n- 宿主点击时把 `玩家名 / 界面 / 槽位 / 按钮 / 动作 / 区域 / 物品 / 数量 / 数据 + 玩家快照`\n  组成 JSON 作为闭包的 `%参数1%`，先 `点:%参数1%` 再用 `%点.槽位%` / `%点.动作%` 取值。\n  常见动作值有 `左键` / `右键`。\n- 界面只读：点击不会拿走物品，也不会动玩家背包。同一玩家只保留最后打开的界面对象，\n  重绘（切页、弹确认框）会顶掉旧的；关窗 / 退出 / 卸载 / 关服都会释放闭包。\n- 按玩家的旧界面方法已移除，界面一律用「对象 + 闭包」。\n\n## 9. 完整可运行示例：签到插件\n\n把下面存成 `<gameDir>/nebula/签到/main.n`，带一个 `nebula.ini`，然后 `/nebula load 签到`：\n\n```text\n// 签到插件：/签到 领面包，背包面包超过 63 个时不再发。\n[f]初始化\n奖励物品:minecraft:bread\n奖励数量:4\n$世界.注册指令 签到 0 sign$\n\n[f]加载\n签到插件已加载\n\n[指令]签到|sign\n余:$世界.取物品数 %玩家名% %奖励物品%$\n如果:%余%>63\n    $世界.提示 %玩家名% \"§7背包里的面包够多了，先吃掉再来吧\"$\n    返回\n如果尾\n$世界.给物品 %玩家名% %奖励物品% %奖励数量%$\n$世界.音效 %玩家名% minecraft:entity.player.levelup$\n$世界.提示 %玩家名% \"§a签到成功 §7· §f面包 ×%奖励数量%\"$\n```\n\n逐行看点：`[f]初始化` 每次编译都跑，所以注册指令写在这里；`[f]加载` 的提示只会在首次插入时出现；\n`[指令]` 头列出规范名和别名；查询 `取物品数` 立即返回值可以赋给 `余`；给物品 / 音效 / 提示是动作，\n排队落地；带空格的文案用引号包住；分支用裸 `返回` 提前结束。\n\n> 这是演示插件，**没有做「每天一次」的持久化**。真要做每日限制，得把领取日期按玩家名存文件：\n> 读取用 `$读文件 %库目录%/记录.json$`，改字段用 `$JSON键存$`，可用的文件写入函数见\n> [`bridge/README.md`](../../bridge/README.md)。\n\n## 10. 调试与排错\n\n```text\n/nebula list                 列出插件及调试开关\n/nebula load <插件|--all>     加载；编译失败时其它插件不受影响\n/nebula load <插件|--all>    加载；已加载则重编译（失败保留旧版本）\n/nebula debug <插件|--all>    开启文件指纹监视，保存即重编译\n/nebula undebug <插件|--all>  关闭\n/nebula unload <插件|--all>   卸载（加载器按归属回收指令 / 界面 / 生物 / 事件订阅，并重推资源包）\n```\n\n插件没反应时按这个顺序查：\n\n1. `/nebula list` 里是否已加载；编译失败的信息在服务端日志 / 控制台。\n2. `$调用$` 的**结尾 `$` 有没有漏**——漏了整行会被当普通文本输出，看起来像「执行了但没效果」。\n3. `如果尾` / `结束` 是否闭合，词条之间是否用了块外空行。\n4. 一行是不是塞了两个 `$调用$`。\n5. 在函数里读事件变量 / 配置 → 忘了显式传参（第 3 节）。\n6. 动作后面立刻查询 → 读到的是旧值（第 5 节）。\n7. 玩家目标传了 UUID 而不是名字（第 5 节）。\n8. 方块查询对未加载区块返回空（第 5 节）。\n9. 指令改名后旧入口还在 → 重启服务端。\n10. 输出行没私聊化 → 被广播出去了，改用 `$世界.提示$`。\n\n`python NebulaLoadMod/selftest/regress.py` 是**桥接层**的一键回归（隔离服 + 双假玩家 +\n原版命令反查），不是插件单元测试；插件逻辑还是靠 `/nebula debug` + 游戏内验证。\n\n## 11. 示例插件索引\n\n| 插件 | 演示什么 | 说明 |\n| --- | --- | --- |\n| `示例` | 最小结构、生命周期、聊天事件 | `server-1.21.11/nebula/示例/main.n` |\n| `伤害显示` | 事件 payload、`%对象.字段%`、条件分支、配置开关、`悬浮字` 飘血 | [`说明.md`](../../server-1.21.11/nebula/伤害显示/说明.md) |\n| `连锁砍树` | 多文件拆分、`[函数]` 显式传参、遍历与数值运算 | 同目录 `main.n` / `判定.n` / `砍伐.n` |\n| `泥土商店` | 自注册指令、`%库目录%` 读 JSON、界面对象 + 点击闭包 + 确认弹窗 | [`说明.md`](../../server-1.21.11/nebula/泥土商店/说明.md) |\n| `Tab列表` | `[事件]每秒` 定时刷新、`取玩家列表` 遍历、`设置Tab列表` 页眉 / 页脚、配置占位符 | `server-1.21.11/nebula/Tab列表/main.n` |\n| `selftest/wordlib` | `[f]初始化` 读回、批量动作 | `NebulaLoadMod/selftest/wordlib/main.n` |\n\n建议阅读顺序：`示例` → `伤害显示`（事件）→ `泥土商店`（指令 + 界面）。\n"}, "apiindex": {"file": "apis/README.md", "title": "API 写在前面 · 约定", "group": "API 参考", "text": "# `世界` API 参考 · 写在前面\n\n> 本套文档的体例参考 [LegacyScriptEngine 的 API 文档](https://docs.levimc.org/LegacyScriptEngine/zh/apis/)：\n> 先约定数据类型与描述格式，再按类别分篇，每条 API 用「用途 → 签名 → 参数 → 返回值 → 示例 → 提示」的固定格式。\n> 对应到我们这里，LLSE 的 `mc` / `Player` 那套对象换成了词库的 `$世界.方法 …$` 与 `%变量%`。\n\n## ⛳ 放在前面\n\n星云词库引擎把 Minecraft Java 版服务端的能力封装成 `世界` 注入类，词库里用 `$世界.方法 参数…$` 调用。Java 宿主只做事件转发与动作落地，\n**业务逻辑全部写在 `.n` 词库里**。\n\n还不会写插件？先看 [`plugin-guide.md`](../plugin-guide.md)。这里只查 API。\n\n## 💊 数据类型\n\n词库是弱类型的，所有值最终都是**文本**或 **JSON 文本**。下面这些类型名只出现在 API 文档的参数\n与返回值说明里，用来告诉你该传什么、会拿回什么。\n\n| 文档类型 | 词库里的写法 | 说明 |\n| --- | --- | --- |\n| `String` | 一段文本，如 `minecraft:stone` | 注册名、名字、文本。含空格要加引号 `\"§7余额：%余%\"` |\n| `Integer` | `64`、`3` | 整数（坐标、数量、槽位、等级） |\n| `Float` | `0.6`、`1.5` | 小数（音量、音调、部分数值） |\n| `Boolean` | `是` / `否` | `是 / true / 1 / 开 / 真 / yes / on` 都视为真 |\n| `Text` | 剩余的一串文本 | **吞掉该位次之后的全部实参**，用空格拼接，通常是最后一个参数 |\n| `Object` | JSON 文本，如 `{\"名称\":\"Steve\"}` | 用 `%变量.字段%` 取字段，如 `%玩家.名称%` |\n| `Array` | JSON 数组文本 | 配合 `遍历:i,件=%表%` 使用 |\n| `Function` | `回调:[函数] … 结束` | 函数值；宿主回调时 payload 落在 `%参数1%` |\n| `Null` | 空串 | 查询失败或动作无返回 |\n\n几个常见的**对象型参数**（都是 JSON 或能自动转成的形式）：\n\n- `玩家` — 传玩家名最稳；也可以传 `%玩家%` 这种 JSON 对象（宿主自动取 `名称`）。\n  **别传 `%玩家.uuid%`**：`give` / `effect` 等命令会拒绝 UUID 字面量。\n- `维度` — 注册名，如 `minecraft:overworld` / `minecraft:the_nether`。\n- `实体` — 数字 id / UUID / 名称，宿主统一换成选择器。\n- `面` — `$世界.创建界面$` 返回的界面对象 id。\n- `坐标 / 方块 / 玩家状态 / 实体数据` — 查询返回的 JSON 对象，用 `%变量.字段%` 取字段。\n\n> `%时间%`（本地时间）和 `%版本%`（引擎版本）是**引擎内置系统变量**，词库里给同名变量赋值会被\n> 遮蔽。自己的变量加前缀，如 `%SC时刻%`。\n\n## 📌 API 文档描述约定\n\n后面每一条 API 都按同一个格式写，看一条就会看全部：\n\n**1. 签名**\n\n```text\n$世界.取方块 维度 X Y Z$\n$世界.取实体列表 [维度] [上限]$\n```\n\n参数按**位次**用空格分隔；`[ ]` 框起来的是**可选参数**，省略时用文档里给出的默认值。\n签名里的 `$` 必须成对——**结尾的 `$` 漏掉，整行会被当普通文本输出**。\n\n**2. 参数**\n\n按 `参数名 : 类型` 逐项列出，并写明含义与默认值。`Text` 类型会吞掉后面的全部实参。\n\n**3. 返回值 / 返回值类型**\n\n- **查询类**（`取…` / `获取…` / `玩家有标签` 等）：调用时**立即返回**结果，可以赋值\n  `余:$世界.取物品数 %玩家名% minecraft:dirt$`。\n- **动作类**：返回空串（`Null`），实际效果**排队延后执行**——同一词条里\n  `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是旧值，要到下一次事件 / 重编译 才生效。\n- 查询失败返回空串 / `{}` / `[]` / `0`（每条 API 会注明），动作失败返回空串并在服务端日志记 WARN。\n\n**4. 实现 / 状态**\n\n给出宿主侧落地方式（原版命令、稳定 API 或反射兜底）与已知降级，便于排查「为什么这个读不到」。\n\n**5. 示例与提示**\n\n示例是真实词库写法；`注意` / `警告` / `提示` 只写会踩坑的点。\n\n## 📜 分类导航\n\n| 分类 | 文档 | 大致对应 LLSE |\n| --- | --- | --- |\n| 方块 | [`方块.md`](方块.md) | GameAPI / Block |\n| 坐标 | [`坐标.md`](坐标.md) | GameAPI / Basic |\n| 玩家 | [`玩家.md`](玩家.md) | GameAPI / Player / Item |\n| 世界与服务器 | [`世界与服务器.md`](世界与服务器.md) | GameAPI / Server / GameUtils |\n| 实体 | [`实体.md`](实体.md) | GameAPI / Entity / Particle |\n| 交互与事件 | [`交互与事件.md`](交互与事件.md) | GameAPI / Command、EventAPI / Listen |\n| 指令与界面 | [`指令与界面.md`](指令与界面.md) | GameAPI / Command、GuiAPI |\n| 事件清单 | [`事件.md`](事件.md) | EventAPI / PlayerEvents 等 |\n\n各分类页与本文一起手写维护（纯静态，无生成脚本），内容以\n[`mc-api-map.md`](../mc-api-map.md)（编译期契约表）和 `NebulaLoadMod/src/main/resources/nebula/world-specs.json`（规格唯一来源）为准；\n改方法要同时改契约表、规格 JSON 与分类页，最后跑 `cargo test --offline --lib` 让单测兜住。\n\n## 📡 调试\n\n```text\n/nebula list                 列出插件及调试状态\n/nebula load <插件>    加载或重编译（失败保留旧版本）\n/nebula debug|undebug <插件>  开关文件指纹自动重编译\n/nebula unload <插件>         卸载并释放界面闭包\n```\n\n没有 LLSE 那种 `jsdebug` 交互控制台；验证词库靠 `/nebula debug` + 游戏内触发事件，\n或用 `$世界.执行命令 say …$` 把中间值打出来（注意 256 字符上限）。\n桥接层的一键回归是 `python NebulaLoadMod/selftest/regress.py`（隔离服 + 双假玩家 + 原版命令反查）。\n\n## 📎 与契约文档的关系\n\n| 文档 | 面向谁 | 谁维护 |\n| --- | --- | --- |\n| 本套 `apis/` | 写插件的人（怎么用） | 生成器 + 少量手写示例字典 |\n| [`mc-api-map.md`](../mc-api-map.md) | 改桥接的人（有哪些方法、参数位次、宿主分支） | 手工维护，**被 `include_str!` 编进单测** |\n| [`neoforge.md`](../neoforge.md) | 改 mod 的人（设计决策与实现现状） | 手工维护 |\n\n三者冲突时以 `bridge/src/lib.rs` 与 Java 宿主代码为准，并顺手把文档校准回来。\n"}, "events": {"file": "apis/事件.md", "title": "事件清单", "group": "API 参考", "text": "# 事件清单\n\n> 事件系统让插件**响应**游戏里发生的事。宿主把 NeoForge 事件整理成 payload JSON 注入词库变量，\n> 词库用 `[事件]名字` 词条接收。写法与排错见 [`plugin-guide.md`](../plugin-guide.md) 第 4、10 节。\n\n宿主内置 6 个中文事件（下表），另有 8 个中文别名词条（7 个玩家交互 + 玩家退出，\n见「中文交互事件」），另外通过**通用事件桥**把 NeoForge 事件总线上的 267 个事件类\n按订阅对接给词库。\n\n## 事件词条格式\n\n```text\n[事件]玩家聊天\n如果:%消息%==你好\n    $世界.提示 %玩家名% §a你好$\n如果尾\n```\n\n- 头写 `[事件]名字`；正文顶格，缩进只用于 `如果` / `遍历` 块内部，块要闭合。\n- payload 字段注入成 `%变量%`；玩家 / 实体 / 方块这类是 **JSON 对象**，用 `%变量.字段%` 取字段。\n- 事件帧的父作用域是 `plugin.state`，能读到 `[f]初始化` 里赋的配置；但 `[函数]` 帧读不到，\n  需要的变量要显式传参。\n\n## 输出、取消与拦截\n\n- 事件里的**裸文本行会被宿主广播 / 回给玩家**；只想让某个人看到，用\n  `$世界.提示 %玩家名% 文本$`。\n- 想拦截事件用 `$世界.取消事件$`：桥接层把取消标志写在本次事件槽位，宿主在分发结束后统一\n  `setCanceled(true)`。**只有「可取消」列是「是」的事件有效**。\n- payload 只含基础类型与 JSON，不跨线程持有 Minecraft 对象；别指望拿到 Java 对象。\n- 事件异常不会抛到 NeoForge 总线，只记日志并跳过该插件。\n\n## 玩家进入\n\n`[事件]玩家进入` · 来源 `PlayerLoggedInEvent` · **可取消：否**\n\n每次**连接成功**都会触发一次（包括断线重连），不是「首次进服」；首次进服要自己查账号库。\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照：`名称` / `uuid` / `维度` / `x` `y` `z` |\n| `%玩家名%` | `String` | 玩家名，等价 `%玩家.名称%` |\n| `%管理员%` | `String` | `是` / `否` |\n| `%维度%` | `String` | 注册名，如 `minecraft:overworld` |\n\n```text\n[事件]玩家进入\n$世界.提示 %玩家名% \"§7你进服了，UUID %玩家.uuid%\"\n```\n\n> 登录类插件必须在这个事件里**重建会话**：玩家上一局是「已登录」，关服 / 重载 / 重连后\n> 必须重新输密码，否则杀一次进程再进服就能绕过验证。\n\n---\n\n\n---\n\n## 玩家聊天\n\n`[事件]玩家聊天` · 来源 `ServerChatEvent` · **可取消：是**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照：`名称` / `uuid` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` / `模式` / `潜行` / `手持物品.名称` |\n| `%玩家名%` | `String` | 玩家名，等价 `%玩家.名称%` |\n| `%消息%` | `String` | 玩家原始发言文本（`getRawText()`） |\n| `%管理员%` | `String` | `是` / `否`（文本），按 OP 列表判断 |\n| `%潜行%` | `String` | `是` / `否`，是否按住潜行 |\n| `%维度%` | `String` | 注册名，如 `minecraft:overworld` |\n| `%x%` `%y%` `%z%` | `Integer` | 玩家坐标 |\n\n示例：\n\n```text\n[事件]玩家聊天\n如果:%消息%==帮助\n    $世界.提示 %玩家名% \"§e/商店 打开商店\"$\n    $世界.取消事件$\n如果尾\n```\n\n> 注意：取消后这条消息所有人都看不到（相当于被吞掉），确认这是你要的效果。\n\n---\n\n## 实体受伤\n\n`[事件]实体受伤` · 来源 `LivingDamageEvent.Post`（**伤害已结算**）· 可取消：否\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%攻击者%` | `Object` | 伤害来源实体快照：`名称` / `uuid` / `维度` / `x` `y` `z` / `血量` / `最大血量` / `类型`；环境伤害无来源实体时为 `{}` |\n| `%攻击者名%` | `String` | 来源实体名；无来源实体时填伤害类型 id（如 `fall` / `generic`） |\n| `%实体%` | `Object` | 被伤害实体快照：`名称` / `id` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` |\n| `%实体名%` | `String` | 目标名字（生物显示名或玩家名） |\n| `%伤害%` | `Float` | 本次**实际**伤害（护甲 / 附魔 / 格挡已算完） |\n| `%剩余%` | `Float` | 伤害生效后目标血量；死亡为 `0.0` |\n| `%最大血量%` | `Float` | 目标最大血量 |\n| `%身高%` | `Float` | 目标碰撞箱高度（`getBbHeight()`），飘字定位用 |\n| `%暴击%` | `String` | `是` / `否`；仅玩家来源按原版 `Player#attack` 条件复算，其余恒 `否` |\n| `%原因%` | `String` | 伤害类型 id，如 `player_attack` / `arrow` |\n| `%致死%` | `String` | `是` / `否` |\n| `%维度%` `%x%` `%y%` `%z%` | — | 目标所在位置 |\n\n示例：\n\n```text\n[事件]实体受伤\n伤害文:$数字格式化 %伤害% 1$\n如果:%致死%==是\n    $世界.动作栏 %攻击者名% \"§c已击杀 §f%实体名%\"$\n    返回\n如果尾\n$世界.动作栏 %攻击者名% \"§7对 §f%实体名% §7造成 §c%伤害文% §7点伤害\"$\n```\n\n> 注意：**任何掉血都会转发**（只要 `伤害 > 0`），不限来源——玩家攻击、怪物互殴、弹射物、\n> 摔落、岩浆、`/damage` 命令、玩家自伤都进词库。环境伤害没有来源实体，此时 `%攻击者%` 是 `{}`、\n> `%攻击者名%` 是伤害类型 id、`%暴击%` 恒为 `否`；写词条时不要假定 `%攻击者.名称%` 一定有值。\n> `%实体.血量%` 与 `%剩余%` 是同一个数。\n\n---\n\n## 实体治疗\n\n`[事件]实体治疗` · 来源 `LivingHealEvent`（**回血写入之前**）· **可取消：否**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%实体%` | `Object` | 回血实体快照：`名称` / `id` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` |\n| `%实体名%` | `String` | 实体名字 |\n| `%数值%` | `Float` | 本次**真实**回复量（已按最大血量截断） |\n| `%之前%` | `Float` | 回血前血量 |\n| `%剩余%` | `Float` | 回血后血量 |\n| `%最大血量%` | `Float` | 最大血量 |\n| `%身高%` | `Float` | 碰撞箱高度，飘字定位用 |\n| `%原因%` | `String` | `自然回复` / `效果` / `其它`（按再生效果、玩家饥饿值粗分） |\n| `%满血%` | `String` | `是` / `否`，这次回复是否把血补满 |\n| `%维度%` `%x%` `%y%` `%z%` | — | 实体所在位置 |\n\n示例（飘一个绿色 +N，满血时什么都不发）：\n\n```text\n[事件]实体治疗\n如果:%原因%==自然回复\n    返回\n如果尾\n回:$数字格式化 %数值% 1$\n飘y:[%y%+%身高%]\n$世界.悬浮字 %维度% %x% %飘y% %z% \"§a+%回%\" 1.0 1.1 22$\n```\n\n> 注意：\n> - **已经满血时宿主不会转发这个事件**——每次 `heal()` 都会被截断到 0，事件根本进不来，\n>   词库不需要再判断一次。\n> - 原版没有「谁治的」信息：自然回血（饥饿 / 饱和度）、生命恢复效果、药水都走同一个\n>   `LivingEntity#heal`，`%原因%` 是宿主按「有没有再生效果 + 是否满饥饿玩家」粗分的。\n>   饱和状态下自然回血是 **每 0.5 秒 +1**，想安静就把 `%原因%==自然回复` 的那一批过滤掉。\n\n---\n\n## 方块破坏\n\n`[事件]方块破坏` · 来源 `BlockEvent.BreakEvent` · **可取消：是**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照，含 `名称` / `uuid` / `模式` / `潜行` / `手持物品.名称` 等 |\n| `%玩家名%` | `String` | 玩家名 |\n| `%方块%` | `Object` | 方块快照：`名称`（注册名）/ `数据`（BlockState 文本）/ `维度` / `x` `y` `z` / `坐标` |\n| `%坐标%` | `Object` | `x` / `y` / `z` 的坐标对象 |\n| `%工具%` | `String` | 手持物品名称 |\n| `%模式%` | `String` | 游戏模式（中文标签） |\n| `%管理员%` `%潜行%` | `String` | `是` / `否` |\n| `%维度%` | `String` | 注册名 |\n| `%x%` `%y%` `%z%` | `Integer` | 方块坐标 |\n\n示例（连锁砍树用的就是这些字段）：\n\n```text\n[事件]方块破坏\n树种:$取树种 %方块.名称%$\n如果:$文本长度 %树种%$==0\n    返回\n如果尾\n$世界.提示 %玩家.名称% \"§7砍到 §f%方块.名称%\"$\n```\n\n> 注意：`%方块.名称%` 是注册名（如 `minecraft:oak_log`），不是显示名。\n\n---\n\n## 每秒\n\n`[事件]每秒` · 来源 `ServerTickEvent.Post`（每 20 tick 一次）· **可取消：否**\n\n给「没有平台事件」的逻辑用：登录倒计时、超时踢人、定时检查。没有插件写 `[事件]每秒` 时\n这一次分发只是空转，开销可以忽略。\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%服务器tick%` | `Integer` | 服务器启动以来的 tick 数（`Long`，约 20/秒） |\n| `%在线人数%` | `Integer` | 当前在线玩家数 |\n\n示例（维护一个 300 秒未登录就踢出的倒计时，节选自 `server-1.21.11/nebula/登录/main.n`）：\n\n```text\n[事件]每秒\n表:$世界.取玩家列表$\n遍历:i,人=%表%\n    名:%人.名称%\n    剩:[%会话.截止%-%今%]\n    如果:%剩%<=0\n        $世界.踢出玩家 %名% \"§c验证超时\"$\n    如果尾\n结束\n```\n\n> - 一秒钟只跑一次，**不是**每 tick；按 20 tick 计数，TPS 掉到 10 时它就是 2 秒一次。\n> - 需要「严格按墙钟计时」就用 `$当前时间戳$` 存截止时间再比较，别累加计数器。\n> - 这个事件每秒都会进词库，别在这里做全量文件扫描或长 IO。\n\n---\n\n## 中文交互事件\n\n玩家左右键交互这一类最常用，宿主给整组 `PlayerInteractEvent` 配了**中文词条名**和\n**中文 payload 键**（玩家退出也顺带中文化），词库里不必再写 Java 类名，\n也不用 `%entity.name%` 这种英文变量。\n中文名写在 `nebula/events.json` 顶层的 `cnNames`（由 `tools/gen_events.py` 随清单生成），\n`EventBridge` 按别名找到事件类、动态注册监听器，分发时用的仍是这个中文词条名。\n\n| 词条 | 对应事件类 | 触发时机 |\n| --- | --- | --- |\n| `[事件]右键物品` | `PlayerInteractEvent.RightClickItem` | 玩家发出「使用物品」的右键动作（含对着空气、普通方块） |\n| `[事件]右键方块` | `PlayerInteractEvent.RightClickBlock` | 右键点到方块 |\n| `[事件]右键空气` | `PlayerInteractEvent.RightClickEmpty` | 右键没命中方块 / 实体 |\n| `[事件]左键方块` | `PlayerInteractEvent.LeftClickBlock` | 左键点到方块 |\n| `[事件]左键空气` | `PlayerInteractEvent.LeftClickEmpty` | 左键没命中方块 |\n| `[事件]右键实体` | `PlayerInteractEvent.EntityInteract` | 右键点到实体 |\n| `[事件]右键实体部位` | `PlayerInteractEvent.EntityInteractSpecific` | 右键点到实体的具体部位 |\n\n玩家退出不属于交互，但同样给了中文名：`[事件]玩家退出` →\n`PlayerEvent.PlayerLoggedOutEvent`（侧边栏插件用它撤掉离线玩家的行），变量与其它\n玩家类事件一致（`%玩家名%` / `%维度%` / `%x%` `%y%` `%z%`）。\n\n**中文 payload 变量**（英文键一律保留，旧插件照常能跑）：\n\n| 变量 | 含义 | 出现条件 |\n| --- | --- | --- |\n| `%玩家名%` / `%玩家%` | 玩家名 / 玩家快照（`.名字%` `.类型%` `.维度%` `.编号%` `.x%` `.y%` `.z%`） | 全部 |\n| `%维度%` / `%x%` `%y%` `%z%` | 玩家所在维度与坐标 | 全部 |\n| `%物品%` / `%数量%` | 手持物品 id（空手为空串）/ 数量 | 事件有 `getItemStack()` 时 |\n| `%手%` / `%主手%` | 主手 / 副手；是 / 否 | 事件有 `getHand()` 时 |\n| `%方块x%` `%方块y%` `%方块z%` / `%坐标%` | 点到方块的坐标 / `{x,y,z}` | 右键方块 / 左键方块 |\n| `%面%` / `%面英文%` | 上 下 北 南 东 西 / 原版 `UP DOWN …` | 右键方块 / 左键方块 |\n| `%用物品%` / `%用方块%` / `%动作%` | 允许 拒绝 默认 跳过 / 开始 中止 停止 持续 | 对应 getter 存在时 |\n| `%目标%` / `%目标名%` | 被右键实体的中文快照 / 名字 | 右键实体系列 |\n| `%事件名%` / `%原事件名%` / `%事件类%` | 中文名 / 清单简名 / 完整类名 | 全部 |\n\n其余事件类仍用英文简名订阅，但只要 payload 里有 `entity` / `itemStack` / `pos`，\n也会同时补一份中文键（`%实体%`、`%实体名%`、`%物品%`、`%方块x%` …）。\n\n```text\n[事件]右键物品\n人:%玩家名%\n物:%物品%\n如果:%主手%==是\n    $世界.提示 %人% 你用 %手% 拿着 %物%$\n如果尾\n```\n\n注意：\n\n- 写中文名**必须用带 `cnNames` 的新 jar**；旧 jar 会把中文名当成「查不到清单」直接跳过，\n  事件静默不触发。英文词条名在两个版本都有效，可以平滑过渡。\n- 同一个插件别同时写 `[事件]右键物品` 和 `[事件]PlayerInteractEvent.RightClickItem`，\n  否则一次交互会注册两个监听器、分发两遍。\n- 事件帧里能用 `%玩家名%` 这类顶层键；要传给 `[函数]` 就先赋给简单变量再传\n  （用户函数实参不展开点号字段）。\n- 值与原版命令相关的部分保持原样：物品 id 仍是 `minecraft:diamond_sword`，\n  `%面英文%` 仍是 `UP`；中文值只用于词库里的比较与提示。\n\n---\n\n## 指令与界面事件\n\n除了上面 6 个内置事件和 8 个中文别名词条，还有两类**宿主主动分发**的入口，写法见\n[`指令与界面.md`](指令与界面.md) 与 [`plugin-guide.md`](../plugin-guide.md) 第 6、8 节：\n\n| 入口 | 触发 | 主要变量 |\n| --- | --- | --- |\n| `[指令]规范名\\|别名` | 玩家 / 控制台执行插件自注册的指令 | `%玩家%` / `%玩家名%` / `%指令%` / `%参数%` / `%管理员%` |\n| 界面点击闭包 | 玩家点击词库打开的箱子界面 | payload JSON 落在闭包的 `%参数1%`：`槽位` / `动作` / `按钮` / `物品` / `数量` / `区域` 等 |\n\n## 避开误区\n\n- **动作延迟执行**：事件里 `$世界.设方块 …$` 后立刻 `$世界.取方块 …$` 读到旧值。要验证就换一次\n  事件触发，或用宿主的查询接口。\n- 别在高频事件里做长 IO 或全量词库扫描；词库事件是同步跑在服务端主线程的。\n- 别在事件里用 `$世界.执行命令 say …$` 拼超长文本（chat 上限 256 字符）。\n- 玩家目标统一用**名字**，不要用 UUID（`give` / `effect` 会拒绝 UUID 字面量）。\n- 事件输出行会广播，私聊务必用 `$世界.提示$`。\n\n## 通用事件桥（NeoForge 全量事件）\n\n除了上面的内置中文事件，宿主还能把 **NeoForge 事件总线上的任意事件类**直接对接给词库。\njar 内的 `nebula/events.json` 是构建期从 `neoforge-21.11.42-universal.jar` 抽取的清单\n（当前 267 个事件类，含 `Pre` / `Post` 等内部类），由 `NebulaLoadMod/tools/gen_events.py` 生成。\n清单顶层的 `cnNames` 同时给出 8 个中文别名（`右键物品` → `PlayerInteractEvent.RightClickItem`、\n`玩家退出` → `PlayerEvent.PlayerLoggedOutEvent` 等），详见上面的「中文交互事件」；\n别名随清单一起生成，升级 NeoForge 不会丢。\n\n词条头直接写 **Java 事件类简名**，内部类用点号代替 `$`：\n\n```text\n[事件]EntityJoinLevelEvent\n$世界.广播 %entity.name% 加入了 %entity.dimension%$\n```\n\n- **按订阅注册**：宿主在开服 `loadAll` 后、以及 `/nebula load|unload|debug|undebug`\n  之后读一次订阅表，只给词库真正写了词条的事件挂监听器。没订阅就一个额外监听器都没有，\n  也不会多跨一次 JNI。订阅表来自 Rust 侧 `eventTriggers(handle)`。\n- **payload 用 Java 字段名**：反射遍历事件的 public getter，`getEntity()` → `%entity%`、\n  `getPos()` → `%pos%`、`isCanceled()` → `%canceled%`，另有 `%eventClass%`（完整类名）。\n  复杂对象转成 JSON：`Entity` → `{name,id,type,dimension,x,y,z}`，`BlockPos` → `{x,y,z}`，\n  `ItemStack` → `{item,count}`，`Identifier` / `Component` / `UUID` / 枚举 → 字符串；\n  集合最多 32 项，未知对象只留 200 字符以内的短字符串。**payload 里没有 Java 对象引用**。\n  英文键之外还会补一份中文别名（`%玩家名%` / `%物品%` / `%面%` / `%事件名%` …），\n  值里的枚举也翻成中文（主手 / 副手、上 / 下 / 北 …），完整对照见「中文交互事件」。\n- **可取消**：事件实现 `ICancellableEvent` 时，`$世界.取消事件$` 会真的 `setCanceled(true)`；\n  否则无效（与内置事件口径一致）。\n- **高频节流**：`EntityTickEvent.*` / `PlayerTickEvent.*` / `LevelTickEvent.*` /\n  `ServerTickEvent.*` 每实体 / 每维度每 tick 都触发，宿主按 **20 tick（1 秒）** 节流后\n  才分发。别指望逐帧精度；真要逐帧请下沉到宿主 Java 侧（如 `FloatingText.tick`）。\n- **加载期事件收不到**：`RegisterCommandsEvent`、`BuildCreativeModeTabContentsEvent` 这类\n  在 mod 加载阶段就发完了，专用服运行时订阅也收不到，宿主会记一条 WARN。客户端专用事件类\n  在服务端不存在，注册时跳过。清单中的辅助枚举 / 接口 / 抽象基类也会被运行时过滤。\n- **内置事件不重复**：`玩家聊天` / `实体受伤` / `实体治疗` / `方块破坏` / `玩家进入` /\n  `每秒` 这 6 个中文名由宿主手写 handler 分发；`右键物品` / `玩家退出` 等 8 个中文名\n  走 `cnNames` 别名表解析到清单条目，两类都不会被重复注册。英文词条名与中文别名等价，\n  二选一即可。\n- 升级 MC / NeoForge 版本后要重跑 `python NebulaLoadMod/tools/gen_events.py` 再全量构建；\n  `regress.py` 会按内容比对 jar 内清单，滞后就报「产物与源码不一致」。\n\n清单本身是构建期快照，不是运行时反射扫 classpath；想看某个版本有哪些可订阅事件，\n直接查 `NebulaLoadMod/src/main/resources/nebula/events.json`。\n\n真机验证：`regress.py` 的自检词库订阅了 `[事件]EntityJoinLevelEvent`，开服后宿主动态注册该\n监听器，假玩家进服时收到 `%eventClass%` / `%entity.name%` 并写进日志（28/28 PASS 里的\n「通用事件桥动态注册」一项）。改词库后 `/nebula load <插件>` 会重编译并刷新订阅表，无需重启。\n\n## 调试\n\n```text\n/nebula list                    确认插件已加载\n/nebula debug <插件>            改 .n 即自动重编译\n/nebula undebug <插件>          关闭\n```\n\n触发事件没反应时，先在事件第一行放一个 `$世界.提示 %玩家名% 事件到了$`，确认是不是根本没分发；\n再逐行排查 `$调用$` 结尾的 `$`、块闭合与变量名。完整排错清单见\n[`plugin-guide.md`](../plugin-guide.md) 第 10 节。\n"}, "block": {"file": "apis/方块.md", "title": "方块", "group": "API 参考", "text": "# 方块 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Block。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取方块`](#取方块) | 查询 | `$世界.取方块 维度 X Y Z$` |\n| [`取方块数据`](#取方块数据) | 查询 | `$世界.取方块数据 维度 X Y Z$` |\n| [`获取方块`](#获取方块) | 查询 | `$世界.获取方块 维度 X Y Z$` |\n| [`取相邻方块`](#取相邻方块) | 查询 | `$世界.取相邻方块 方块数据 维度 X Y Z [预算]$` |\n| [`取方块标签`](#取方块标签) | 查询 | `$世界.取方块标签 维度 X Y Z$` |\n| [`设方块`](#设方块) | 动作 | `$世界.设方块 维度 X Y Z 方块名$` |\n| [`设方块状态`](#设方块状态) | 动作 | `$世界.设方块状态 维度 X Y Z 名称 [状态]$` |\n| [`设方块数据`](#设方块数据) | 动作 | `$世界.设方块数据 维度 X Y Z 数据文本$` |\n| [`破坏方块`](#破坏方块) | 动作 | `$世界.破坏方块 维度 X Y Z$` |\n| [`取生物群系`](#取生物群系) | 查询 | `$世界.取生物群系 维度 X Y Z$` |\n| [`设生物群系`](#设生物群系) | 动作 | `$世界.设生物群系 维度 X1 Z1 X2 Z2 群系$` |\n| [`填充区域`](#填充区域) | 动作 | `$世界.填充区域 维度 X1 Y1 Z1 X2 Y2 Z2 方块$` |\n\n---\n\n### 取方块\n\n`$世界.取方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getBlockState(BlockPos)` → `BuiltInRegistries.BLOCK.getKey`\n\n示例：\n\n```text\n方块:$世界.取方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 取方块数据\n\n`$世界.取方块数据 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`BlockState#toString()`（含属性文本）\n\n示例：\n\n```text\n结果:$世界.取方块数据 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 获取方块\n\n`$世界.获取方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：方块对象：`名称` / `数据` / `标签` / `生物群系`\n\n示例：\n\n```text\n结果:$世界.获取方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 取相邻方块\n\n`$世界.取相邻方块 方块数据 [预算]$ 或 $世界.取相邻方块 维度 X Y Z [预算]$`\n\n- 参数：\n  - 方块数据 : `String`\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 预算 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：26 邻域 `BlockPos.offset` + `getBlockState`，跳过空气，`ServerLevel#isLoaded` 防加载区块\n\n示例：\n\n```text\n邻:$世界.取相邻方块 %方块% 64$\n```\n\n> 注意：两种调用形式二选一：传方块数据 JSON，或传 `维度 X Y Z` 坐标；`预算` 限制扫描格数。\n\n\n### 取方块标签\n\n`$世界.取方块标签 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Array`\n- 失败回退：查询失败返回空数组 `[]`\n- 实现：`BlockState#getTags()` → `TagKey#location`\n\n示例：\n\n```text\n结果:$世界.取方块标签 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 设方块\n\n`$世界.设方块 维度 X Y Z 方块名$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 方块名 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：原版 `setblock` 命令（Brigadier `parse + execute`），跨维度时加 `execute in <维度>` 前缀\n\n示例：\n\n```text\n$世界.设方块 minecraft:overworld 0 64 0 minecraft:diamond_block$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：动作延迟执行：同一词条里紧接着 `$世界.取方块$` 读到的仍是旧方块。\n\n\n### 设方块状态\n\n`$世界.设方块状态 维度 X Y Z 名称 [状态]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 名称 : `String`\n  - 状态 : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：状态 = 空（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`BlockStateParser` 解析 `名称[属性=值]` 后 `setBlock`\n\n示例：\n\n```text\n$世界.设方块状态 minecraft:overworld 0 64 0 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 设方块数据\n\n`$世界.设方块数据 维度 X Y Z 数据文本$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 数据文本 : `String`；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：同上，整段 `BlockState` 文本解析\n\n示例：\n\n```text\n$世界.设方块数据 minecraft:overworld 0 64 0 {}$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 破坏方块\n\n`$世界.破坏方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#destroyBlock(BlockPos, drop)`\n\n示例：\n\n```text\n$世界.破坏方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取生物群系\n\n`$世界.取生物群系 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getBiome(BlockPos)` → `Biome` 注册名\n\n示例：\n\n```text\n结果:$世界.取生物群系 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 设生物群系\n\n`$世界.设生物群系 维度 X1 Z1 X2 Z2 群系$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X1 : `Integer`\n  - Z1 : `Integer`\n  - X2 : `Integer`\n  - Z2 : `Integer`\n  - 群系 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#getChunk` + 区块 biome 写入\n\n示例：\n\n```text\n$世界.设生物群系 minecraft:overworld 0 0 3 3 minecraft:plains$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：走 `fillbiome`，Y 范围固定 -64 ~ 319。\n\n\n### 填充区域\n\n`$世界.填充区域 维度 X1 Y1 Z1 X2 Y2 Z2 方块$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X1 : `Integer`\n  - Y1 : `Integer`\n  - Z1 : `Integer`\n  - X2 : `Integer`\n  - Y2 : `Integer`\n  - Z2 : `Integer`\n  - 方块 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：循环 `ServerLevel#setBlock`，限制格数与 `scan_budget`\n\n示例：\n\n```text\n$世界.填充区域 minecraft:overworld 0 64 0 3 65 3 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n"}, "coord": {"file": "apis/坐标.md", "title": "坐标", "group": "API 参考", "text": "# 坐标 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Basic。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取玩家坐标`](#取玩家坐标) | 查询 | `$世界.取玩家坐标 玩家$` |\n| [`取复活点坐标`](#取复活点坐标) | 查询 | `$世界.取复活点坐标$` |\n| [`设复活点`](#设复活点) | 动作 | `$世界.设复活点 X Y Z$` |\n\n---\n\n### 取玩家坐标\n\n`$世界.取玩家坐标 玩家$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`ServerPlayer#getX/getY/getZ`\n\n示例：\n\n```text\n结果:$世界.取玩家坐标 %玩家名%$\n```\n\n\n### 取复活点坐标\n\n`$世界.取复活点坐标$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`ServerLevel#getSharedSpawnPos()`\n\n示例：\n\n```text\n结果:$世界.取复活点坐标$\n```\n\n\n### 设复活点\n\n`$世界.设复活点 X Y Z$`\n\n- 参数：\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#setDefaultSpawnPos(BlockPos, float)`\n\n示例：\n\n```text\n$世界.设复活点 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n"}, "player": {"file": "apis/玩家.md", "title": "玩家", "group": "API 参考", "text": "# 玩家 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Player / Item。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取玩家状态`](#取玩家状态) | 查询 | `$世界.取玩家状态 玩家名 UUID$` |\n| [`取玩家列表`](#取玩家列表) | 查询 | `$世界.取玩家列表$` |\n| [`取玩家数量`](#取玩家数量) | 查询 | `$世界.取玩家数量$` |\n| [`传送玩家`](#传送玩家) | 动作 | `$世界.传送玩家 玩家 维度 X Y Z$` |\n| [`设置模式`](#设置模式) | 动作 | `$世界.设置模式 模式 玩家$` |\n| [`取玩家模式`](#取玩家模式) | 查询 | `$世界.取玩家模式 模式 玩家$` |\n| [`取玩家血量`](#取玩家血量) | 查询 | `$世界.取玩家血量 玩家 [数值]$` |\n| [`治疗玩家`](#治疗玩家) | 动作 | `$世界.治疗玩家 玩家 [数值]$` |\n| [`伤害玩家`](#伤害玩家) | 动作 | `$世界.伤害玩家 玩家 [数值]$` |\n| [`击杀玩家`](#击杀玩家) | 动作 | `$世界.击杀玩家 玩家 [数值]$` |\n| [`踢出玩家`](#踢出玩家) | 动作 | `$世界.踢出玩家 玩家 原因$` |\n| [`扣耐久`](#扣耐久) | 动作 | `$世界.扣耐久 点数 玩家$` |\n| [`动作栏`](#动作栏) | 动作 | `$世界.动作栏 玩家 文本$` |\n| [`标题`](#标题) | 动作 | `$世界.标题 玩家 主标题 [副标题]$` |\n| [`设置侧边栏`](#设置侧边栏) | 动作 | `$世界.设置侧边栏 玩家 文本$` |\n| [`清除侧边栏`](# 数：\n  - 玩家名 : `String`\n  - UUID : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`PlayerList#getPlayerByName` / `getPlayer(UUID)` 快照\n\n示例：\n\n```text\n结果:$世界.取玩家状态 %玩家名% 示例文本$\n```\n\n\n### 取玩家列表\n\n`$世界.取玩家列表$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Array`\n- 失败回退：查询失败返回空数组 `[]`\n- 实现：`PlayerList#getPlayers()`\n\n示例：\n\n```text\n结果:$世界.取玩家列表$\n```\n\n\n### 取玩家数量\n\n`$世界.取玩家数量$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`getPlayers().size()`\n\n示例：\n\n```text\n结果:$世界.取玩家数量$\n```\n\n\n### 传送玩家\n\n`$世界.传送玩家 玩家 维度 X Y Z$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#teleportTo(ServerLevel, x, y, z, yaw, pitch)`\n\n示例：\n\n```text\n$世界.传送玩家 %玩家名% minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 设置模式\n\n`$世界.设置模式 模式 玩家$`\n\n- 参数：\n  - 模式 : `String`\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#setGameMode(GameType)` / `getGameMode()`\n\n示例：\n\n```text\n$世界.设置模式 创造 %玩家名%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取玩家模式\n\n`$世界.取玩家模式 模式 玩家$`\n\n- 参数：\n  - 模式 : `String`\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerPlayer#setGameMode(GameType)` / `getGameMode()`\n\n示例：\n\n```text\n结果:$世界.取玩家模式 创造 %玩家名%$\n```\n\n\n### 取玩家血量\n\n`$世界.取玩家血量 玩家 [数值]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 数值 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`getHealth` / `heal` / `hurt(server.damageSources().generic(), n)` / `kill`\n\n示例：\n\n```text\n结果:$世界.取玩家血量 %玩家名%$\n```\n\n\n### 治疗玩家\n\n`$世界.治疗玩家 玩家 [数值]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家
