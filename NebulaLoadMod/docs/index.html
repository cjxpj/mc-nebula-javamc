 | `$世界.设难度 [难度]$` |\n| [`取种子`](#取种子) | 查询 | `$世界.取种子$` |\n| [`取游戏规则`](#取游戏规则) | 查询 | `$世界.取游戏规则 名称 [值]$` |\n| [`设游戏规则`](#设游戏规则) | 动作 | `$世界.设游戏规则 名称 [值]$` |\n| [`保存世界`](#保存世界) | 动作 | `$世界.保存世界$` |\n| [`取睡眠状态`](#取睡眠状态) | 查询 | `$世界.取睡眠状态$` |\n| [`区块已加载`](#区块已加载) | 查询 | `$世界.区块已加载 维度 区块X 区块Z$` |\n| [`取TPS`](#取TPS) | 查询 | `$世界.取TPS$` |\n| [`取MSPT`](#取MSPT) | 查询 | `$世界.取MSPT$` |\n| [`取服务器tick`](#取服务器tick) | 查询 | `$世界.取服务器tick$` |\n| [`取协议版本`](#取协议版本) | 查询 | `$世界.取协议版本$` |\n| [`取服务器版本`](#取服务器版本) | 查询 | `$世界.取服务器版本$` |\n| [`取环境变量`](#取环境变量) | 查询 | `$世界.取环境变量 名称 [值]$` |\n| [`设环境变量`](#设环境变量) | 动作 | `$世界.设环境变量 名称 [值]$` |\n| [`取本地时间`](#取本地时间) | 查询 | `$世界.取本地时间$` |\n| [`设置tick冻结`](#设置tick冻结) | 动作 | `$世界.设置tick冻结 是|否 数值$` |\n| [`步进tick`](#步进tick) | 动作 | `$世界.步进tick 是|否 数值$` |\n| [`设置tick加速`](#设置tick加速) | 动作 | `$世界.设置tick加速 是|否 数值$` |\n| [`取模拟暂停`](#取模拟暂停) | 查询 | `$世界.取模拟暂停 是|否 数值$` |\n\n---\n\n### 取时间\n\n`$世界.取时间 [时刻]$`\n\n- 参数：\n  - 时刻 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`ServerLevel#getDayTime` / `setDayTime`\n\n示例：\n\n```text\n结果:$世界.取时间$\n```\n\n\n### 设时间\n\n`$世界.设时间 [时刻]$`\n\n- 参数：\n  - 时刻 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#getDayTime` / `setDayTime`\n\n示例：\n\n```text\n$世界.设时间$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 设天气\n\n`$世界.设天气 天气 持续秒数$`\n\n- 参数：\n  - 天气 : `String`\n  - 持续秒数 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`weather` 命令\n\n示例：\n\n```text\n$世界.设天气 clear 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 更新天气\n\n`$世界.更新天气 天气 持续秒数$`\n\n- 参数：\n  - 天气 : `Integer`\n  - 持续秒数 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`weather` 命令\n\n示例：\n\n```text\n$世界.更新天气 clear 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取难度\n\n`$世界.取难度 [难度]$`\n\n- 参数：\n  - 难度 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getDifficulty` / `MinecraftServer#setDifficulty`\n\n示例：\n\n```text\n结果:$世界.取难度$\n```\n\n\n### 设难度\n\n`$世界.设难度 [难度]$`\n\n- 参数：\n  - 难度 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#getDifficulty` / `MinecraftServer#setDifficulty`\n\n示例：\n\n```text\n$世界.设难度$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取种子\n\n`$世界.取种子$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`ServerLevel#getSeed()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取种子$\n```\n\n\n### 取游戏规则\n\n`$世界.取游戏规则 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `Boolean`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`MinecraftServer#getGameRules()` + 规则键映射\n\n示例：\n\n```text\n结果:$世界.取游戏规则 minecraft:stone$\n```\n\n\n### 设游戏规则\n\n`$世界.设游戏规则 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `String`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#getGameRules()` + 规则键映射\n\n示例：\n\n```text\n$世界.设游戏规则 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 保存世界\n\n`$世界.保存世界$`\n\n- 参数：无\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#saveEverything` / 区块保存\n\n示例：\n\n```text\n$世界.保存世界$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取睡眠状态\n\n`$世界.取睡眠状态$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`ServerLevel` 睡眠状态 API\n\n示例：\n\n```text\n结果:$世界.取睡眠状态$\n```\n\n\n### 区块已加载\n\n`$世界.区块已加载 维度 区块X 区块Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 区块X : `Integer`\n  - 区块Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`ServerLevel#isLoaded` / `getChunkSource`\n\n示例：\n\n```text\n结果:$世界.区块已加载 minecraft:overworld 1 1$\n```\n\n\n### 取TPS\n\n`$世界.取TPS$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getAverageTickTime` + 桥接层滑动窗口\n\n示例：\n\n```text\n结果:$世界.取TPS$\n```\n\n> 注意：宿主用 `ServerTickEvent.Pre/Post` 的 40 tick 滑窗自己统计，不读服务端内部字段。\n\n\n### 取MSPT\n\n`$世界.取MSPT$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getAverageTickTime` + 桥接层滑动窗口\n\n示例：\n\n```text\n结果:$世界.取MSPT$\n```\n\n\n### 取服务器tick\n\n`$世界.取服务器tick$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getTickCount()`\n\n示例：\n\n```text\n结果:$世界.取服务器tick$\n```\n\n\n### 取协议版本\n\n`$世界.取协议版本$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`SharedConstants.getCurrentVersion().protocolVersion()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取协议版本$\n```\n\n\n### 取服务器版本\n\n`$世界.取服务器版本$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`MinecraftServer#getServerVersion()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取服务器版本$\n```\n\n\n### 取环境变量\n\n`$世界.取环境变量 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `Boolean`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`System#getenv`；设置只影响桥接层自己的调度\n\n示例：\n\n```text\n结果:$世界.取环境变量 minecraft:stone$\n```\n\n\n### 设环境变量\n\n`$世界.设环境变量 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`System#getenv`；设置只影响桥接层自己的调度\n\n示例：\n\n```text\n$世界.设环境变量 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取本地时间\n\n`$世界.取本地时间$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`LocalDateTime.now()`\n\n示例：\n\n```text\n结果:$世界.取本地时间$\n```\n\n\n### 设置tick冻结\n\n`$世界.设置tick冻结 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.设置tick冻结 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：1.20.3 起有原生 `/tick` 命令，不需要 Mixin。\n\n\n### 步进tick\n\n`$世界.步进tick 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Integer`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.步进tick 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 设置tick加速\n\n`$世界.设置tick加速 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Float`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.设置tick加速 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取模拟暂停\n\n`$世界.取模拟暂停 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n结果:$世界.取模拟暂停 是 1$\n```\n"}, "entity": {"file": "apis/实体.md", "title": "实体", "group": "API 参考", "text": "# 实体 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Entity / Particle。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`生成生物`](#生成生物) | 动作 | `$世界.生成生物 维度 类型 X Y Z$` |\n| [`刷怪蛋生成`](#刷怪蛋生成) | 查询 | `$世界.刷怪蛋生成 玩家 类型 [标记]$` |\n| [`生成实体`](#生成实体) | 动作 | `$世界.生成实体 维度 类型 X Y Z [NBT]$` |\n| [`生成粒子`](#生成粒子) | 动作 | `$世界.生成粒子 维度 效果 X Y Z$` |\n| [`取实体列表`](#取实体列表) | 查询 | `$世界.取实体列表 [维度] [上限]$` |\n| [`取实体坐标`](#取实体坐标) | 查询 | `$世界.取实体坐标 实体id$` |\n| [`取实体数据`](#取实体数据) | 查询 | `$世界.取实体数据 实体id$` |\n| [`实体传送`](#实体传送) | 动作 | `$世界.实体传送 实体id 维度 X Y Z$` |\n| [`实体伤害`](#实体伤害) | 动作 | `$世界.实体伤害 实体id …$` |\n| [`实体治疗`](#实体治疗) | 动作 | `$世界.实体治疗 实体id …$` |\n| [`实体击杀`](#实体击杀) | 动作 | `$世界.实体击杀 实体id …$` |\n| [`实体移除`](#实体移除) | 动作 | `$世界.实体移除 实体id …$` |\n| [`实体加标签`](#实体加标签) | 动作 | `$世界.实体加标签 实体id 标签$` |\n| [`实体移除标签`](#实体移除标签) | 动作 | `$世界.实体移除标签 实体id 标签$` |\n| [`实体有标签`](#实体有标签) | 查询 | `$世界.实体有标签 实体id 标签$` |\n| [`取实体属性`](#取实体属性) | 查询 | `$世界.取实体属性 实体id 属性$` |\n| [`实体隐身`](#实体隐身) | 动作 | `$世界.实体隐身 实体id 是|否$` |\n| [`悬浮字`](#悬浮字) | 动作 | `$世界.悬浮字 维度 X Y Z 文本 [缩放] [上升] [时长]$` |\n| [`巡逻`](#巡逻) | 查询 | `$世界.巡逻 实体 [半径] [追速] [闲速] [溜达]$` |\n| [`附近掉落物`](#附近掉落物) | 查询 | `$世界.附近掉落物 实体 半径$` |\n| [`可达`](#可达) | 查询 | `$世界.可达 实体 X Y Z$` |\n| [`寻路`](#寻路) | 查询 | `$世界.寻路 实体 X Y Z [速度]$` |\n| [`收取掉落物`](#收取掉落物) | 查询 | `$世界.收取掉落物 实体 半径$` |\n| [`容器空位`](#容器空位) | 查询 | `$世界.容器空位 实体$` |\n| [`聚拢掉落物`](#聚拢掉落物) | 动作 | `$世界.聚拢掉落物 维度 白名单 半径 [保护] [无限]$` |\n\n---\n\n### 生成生物\n\n`$世界.生成生物 维度 类型 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 类型 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`EntityType#create(ServerLevel)` + `moveTo` + `addFreshEntity`\n\n示例：\n\n```text\n$世界.生成生物 minecraft:overworld minecraft:pig 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 刷怪蛋生成\n\n`$世界.刷怪蛋生成 玩家 类型 [标记]$`\n\n- 参数：\n  - 玩家 : `String`；玩家名\n  - 类型 : `String`；实体类型 id，如 `nebula_bridge:chest_creature`\n  - 标记 : `String`（可选）—— 给定时要求手持物品 `custom_data.nebula_id` 等于它，否则直接返回 `0`（防误触）\n- 返回值：`1` 生成成功（已扣 1 个）/ `0` 没生成（不扣）\n- 返回值类型：`String`\n- 实现：**原版 `SpawnEggItem#useOn` 的算法**——眼睛射线（`blockInteractionRange()`）→\n  点到的方块没碰撞就原地生成、有碰撞就挪到点击面外侧、顶面再抬一格、点的是液体就地生成 →\n  `EntityType#spawn(…, SPAWN_ITEM_USE, requireEmpty, invertY)`（居中 / 朝向 / 实体数据交给引擎）\n- 失败回退：没看方块、类型不存在、领地禁止交互（`mayInteract`）都返回 `0`，不扣物品\n\n示例：\n\n```text\n生:$世界.刷怪蛋生成 %人% nebula_bridge:chest_creature chest_mob_egg$\n如果:%生%==1\n    $世界.提示 %人% \"§a放下一只箱子生物\"$\n如果尾\n```\n\n> 注意：这就是「原版刷怪蛋」和 `summon ~ ~ ~` 的区别——后者永远生成在**玩家脚下**，\n> 而这里生成在你**点到的那个方块**上。看着空气右键什么都不发生，也不会扣蛋。\n\n### 生成实体\n\n`$世界.生成实体 维度 类型 X Y Z [NBT]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 类型 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - NBT : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数据 = 空（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`summon` 命令 + 可选 NBT（NBT 不含空格）\n\n示例：\n\n```text\n$世界.生成实体 minecraft:overworld minecraft:pig 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：原设计的整段 SNBT 改为 `维度 类型 X Y Z [NBT]`，NBT 不能含空格。\n\n\n### 生成粒子\n\n`$世界.生成粒子 维度 效果 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 效果 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#sendParticles(ParticleOptions, …)`\n\n示例：\n\n```text\n$世界.生成粒子 minecraft:overworld minecraft:speed 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 取实体列表\n\n`$世界.取实体列表 [维度] [上限]$`\n\n- 参数：\n  - 维度 : `String`（可选参数，省略时用宿主默认值）；注册名，如 `minecraft:overworld`\n  - 上限 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Array`\n- 默认值：上限 = 512（省略该尾部参数时）\n- 失败回退：查询失败返回空数组 `[]`\n- 实现：`ServerLevel#getAllEntities` / `getEntities`；上限默认 512，最大 512\n\n示例：\n\n```text\n结果:$世界.取实体列表$\n```\n\n> 注意：默认 / 最大 512 条。整表可能数百字符，长结果要传 `上限` 或分批输出。\n\n\n### 取实体坐标\n\n`$世界.取实体坐标 实体id$`\n\n- 参数：\n  - 实体id : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`Entity#getX/getY/getZ`\n\n示例：\n\n```text\n结果:$世界.取实体坐标 %实体.id%$\n```\n\n\n### 取实体数据\n\n`$世界.取实体数据 实体id$`\n\n- 参数：\n  - 实体id : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：实体快照\n\n示例：\n\n```text\n结果:$世界.取实体数据 %实体.id%$\n```\n\n\n### 实体传送\n\n`$世界.实体传送 实体id 维度 X Y Z$`\n\n- 参数：\n  - 实体id : `String`\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#teleportTo(ServerLevel, …)`\n\n示例：\n\n```text\n$世界.实体传送 %实体.id% minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体伤害\n\n`$世界.实体伤害 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `Float`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 1（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体伤害 %实体.id% 1.0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体治疗\n\n`$世界.实体治疗 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `Float`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 1（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体治疗 %实体.id% 1.0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体击杀\n\n`$世界.实体击杀 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体击杀 %实体.id% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体移除\n\n`$世界.实体移除 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体移除 %实体.id% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体加标签\n\n`$世界.实体加标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n$世界.实体加标签 %实体.id% vip$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体移除标签\n\n`$世界.实体移除标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n$世界.实体移除标签 %实体.id% vip$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 实体有标签\n\n`$世界.实体有标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n结果:$世界.实体有标签 %实体.id% vip$\n```\n\n\n### 取实体属性\n\n`$世界.取实体属性 实体id 属性$`\n\n- 参数：\n  - 实体id : `String`\n  - 属性 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：反射查 `Attributes` 常量 + `getAttributeValue`\n\n示例：\n\n```text\n结果:$世界.取实体属性 %实体.id% 示例文本$\n```\n\n\n### 实体隐身\n\n`$世界.实体隐身 实体id 是|否$`\n\n- 参数：\n  - 实体id : `String`\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：值 = 是（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#setInvisible`\n\n示例：\n\n```text\n$世界.实体隐身 %实体.id% 是$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 悬浮字\n\n`$世界.悬浮字 维度 X Y Z 文本 [缩放] [上升] [时长]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Float`\n  - Y : `Float`\n  - Z : `Float`\n  - 文本 : `String`\n  - 缩放 : `Float`（可选参数，省略时用宿主默认值）\n  - 上升 : `Float`（可选参数，省略时用宿主默认值）\n  - 时长 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：缩放 = 1，上升 = 1，时长 = 20（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Display.TextDisplay`：1.21.11 走 `EntityType.create(TagValueInput, Level, EntitySpawnReason.COMMAND)`（键名与 `/summon` 一致，setter 全是 private），宿主逐 tick `setPos` 上浮、到时 `discard`\n\n示例：\n\n```text\ny2:[%y%+%身高%]\n$世界.悬浮字 %维度% %x% %y2% %z% \"§6§l暴击 §e12.5\" 1.6 1.2 22$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：文本里的 `§` 颜色码由宿主解析成组件样式（TextDisplay 走实体元数据，客户端不会自己认 `§`），含空格必须用双引号包住。`缩放` / `上升` / `时长` 省略或 <= 0 时用 1.0 / 1.0 / 20。实体是原版 `minecraft:text_display`，客户端零依赖；到时自动移除。实体带 `nebula_fx` 标签，宿主每秒扫一次残留（崩服 / 区块卸载留下的），不会永久留在世界里。\n\n### 巡逻\n\n`$世界.巡逻 实体 [半径] [追速] [闲速] [溜达]$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称（必须是 `Container`，例如箱子生物）\n  - 半径 : `Float`（可选参数，默认 12）—— 找掉落物的范围\n  - 追速 : `Float`（可选参数，默认 1.2）—— 追掉落物时的移动速度倍率\n  - 闲速 : `Float`（可选参数，默认 0.6）—— 没东西可捡时溜达的速度倍率\n  - 溜达 : `Integer`（可选参数，默认 4）—— 「闲时挪一挪」的概率是 `1/溜达`\n- 返回值：空串（**刻意不返回状态**——宿主会把返回值打进日志，每秒每只怪一条会把 `latest.log` 刷满；\n  想知道「为什么没动」就用下面四个原语自己拼）\n- 返回值类型：`String`\n- 失败回退：实体不存在、或不是 `Container` 时什么都不做，同样返回空串\n- 实现：`容器空位` → `附近掉落物` 按距离升序逐个 `可达`（第一个能走到的才是目标）→\n  1.6 格内 `收取掉落物`、否则 `寻路` 追 → 一颗都够不着则 `1/溜达` 概率在 ±3 格内随机挪\n\n示例：\n\n```text\n[事件]每秒\n表:$世界.取实体列表 all 64 nebula_bridge:chest_creature$\n遍历:i,怪=%表%\n    $巡逻 %怪.uuid%$\n结束\n\n[函数]巡逻 怪\n$世界.巡逻 %怪% 12 1.2 0.6 4$\n返回\n```\n\n> 注意：这是**默认策略的封装**——一行就有完整行为，适合「容器生物自己捡东西」这种通用需求。\n> 想要自己的策略就别调它，改用下面四个原语（`附近掉落物` / `可达` / `寻路` / `收取掉落物`）\n> 自己拼；两条路互不影响。它不返回值，所以**不会**往日志里刷东西。\n\n\n### 附近掉落物\n\n`$世界.附近掉落物 实体 半径$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称\n  - 半径 : `Float`（可选参数，默认 12）\n- 返回值：JSON 数组文本，按距离升序；每项 `{id,uuid,x,y,z,距离}`\n- 返回值类型：`String`\n- 失败回退：查不到实体返回 `[]`\n- 实现：`ServerLevel#getEntitiesOfClass(ItemEntity.class, …)`；只滤掉已消失 / 拾取延迟 / 空栈\n\n示例：\n\n```text\n附近:$世界.附近掉落物 %怪% 12$\n```\n\n> 注意：宿主**不做取舍**——哪颗能走到、该先追哪颗，全部由词库用 `可达` 自己判断。\n\n\n### 可达\n\n`$世界.可达 实体 X Y Z$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称\n  - X / Y / Z : `Float`；目标方块坐标（y 用整数即可）\n- 返回值：`1` 能走到 / `0` 走不到\n- 返回值类型：`String`\n- 失败回退：实体不存在返回 `0`\n- 实现：`PathNavigation#createPath(…, 1).canReach()`\n\n示例：\n\n```text\n行:$世界.可达 %怪% %x% %y% %z%$\n```\n\n> 注意：这是**预检**，不是保证——先 `可达` 再锁定目标，比\"寻路失败再换\"省一次 2 秒的卡顿。\n\n\n### 寻路\n\n`$世界.寻路 实体 X Y Z [速度]$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称\n  - X / Y / Z : `Float`\n  - 速度 : `Float`（可选参数，默认 0.7）\n- 返回值：`1` 已下单 / `0` 失败\n- 返回值类型：`String`\n- 实现：`PathNavigation#moveTo(x, y, z, speed)`\n\n示例：\n\n```text\n$世界.寻路 %怪% %x% %y% %z%$\n```\n\n> 注意：原版没有「走到坐标」命令，所以只能出原语；下单后 AI 自己走，卡住由词库用\n> `isStuck` 那套规则换目标（见 `nebula/箱子生物/main.n`）。\n\n\n### 收取掉落物\n\n`$世界.收取掉落物 实体 半径$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称\n  - 半径 : `Float`（可选参数，默认 1.6）\n- 返回值：实际收进容器的件数\n- 返回值类型：`String`\n- 实现：半径内 `ItemEntity` 并入 `Container`，满了就留在原地\n\n示例：\n\n```text\n收:$世界.收取掉落物 %怪% 1.6$\n```\n\n> 注意：先查 `容器空位` 再收，能避免\"收了一半卡住\"。\n\n\n### 容器空位\n\n`$世界.容器空位 实体$`\n\n- 参数：\n  - 实体 : `String`；数字 id / UUID / 名称\n- 返回值：还能放下的件数（逐槽累加）\n- 返回值类型：`String`\n- 失败回退：不是容器返回 `0`\n- 实现：`Container#getContainerSize` + 逐槽空位\n\n示例：\n\n```text\n空:$世界.容器空位 %怪%$\n```\n\n\n### 聚拢掉落物\n\n`$世界.聚拢掉落物 维度 白名单 半径 [保护] [无限]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 白名单 : `String`；物品注册名的 JSON 数组，如 `[\"minecraft:cobblestone\",\"minecraft:dirt\"]`\n  - 半径 : `Float`（可选参数，默认 2）\n  - 保护 : `是|否`（可选参数，默认 `是`）；`是` 时带任意数据组件的物品不参与\n  - 无限 : `是|否`（可选参数，默认 `是`）；`否` 时满堆留给原版合并\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 实现：`ServerLevel#getAllEntities` 快照 → 按总量降序贪心分组 → 小的 `setPos` 走向主堆、\n  进 0.75 格并入宿主 `DropStack` 总量；**总量最大的那颗原地不动**\n\n示例：\n\n```text\n$世界.聚拢掉落物 %维度% %物品表% %半径% %带组件% %无限%$\n```\n\n> 注意：这是**单向**的——只有小的会动。旧版让每颗都 `tp` 到最近邻，两个方向同时命中，\n> 会看到已经堆好的大堆反过来去追新掉的小堆。另外 `白名单` 是实参里的 JSON，含 `[` `\"` 也安全\n> （实参在变量替换前就已切分好）。\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n"}, "interact": {"file": "apis/交互与事件.md", "title": "交互与事件", "group": "API 参考", "text": "# 交互与事件 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Command / EventAPI。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`提示`](#提示) | 动作 | `$世界.提示 玩家 文本$` |\n| [`广播`](#广播) | 动作 | `$世界.广播 文本$` |\n| [`执行命令`](#执行命令) | 动作 | `$世界.执行命令 命令$` |\n| [`取消事件`](#取消事件) | 查询 | `$世界.取消事件$` |\n\n---\n\n### 提示\n\n`$世界.提示 玩家 文本$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 文本 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#sendSystemMessage(Component)`\n\n示例：\n\n```text\n$世界.提示 %玩家名% 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：事件里的裸文本行会被广播，只想让某个玩家看到就用这个方法。\n\n\n### 广播\n\n`$世界.广播 文本$`\n\n- 参数：\n  - 文本 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`PlayerList#broadcastSystemMessage(Component, false)`\n\n示例：\n\n```text\n$世界.广播 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 执行命令\n\n`$世界.执行命令 命令$`\n\n- 参数：\n  - 命令 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#getCommands().performPrefixedCommand(...)`\n\n示例：\n\n```text\n$世界.执行命令 say 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：`say` 受 256 字符 chat 上限；宿主会吞掉命令回显，验证动作要用查询读回或原版 `execute if …` 反查。\n\n\n### 取消事件\n\n`$世界.取消事件$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：桥接层本次事件槽位 → `event.setCanceled(true)`\n\n示例：\n\n```text\n结果:$世界.取消事件$\n```\n\n> 注意：只对「可取消」的事件有效；桥接层把标志写在本次事件槽位，宿主分发结束后统一 `setCanceled(true)`。\n"}, "guicmd": {"file": "apis/指令与界面.md", "title": "指令与界面", "group": "API 参考", "text": "# 指令与界面 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Command / GuiAPI。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取物品数`](#取物品数) | 查询 | `$世界.取物品数 玩家 物品$` |\n| [`注册指令`](#注册指令) | 动作 | `$世界.注册指令 规范名 [权限] 别名…$` |\n| [`注销指令`](#注销指令) | 动作 | `$世界.注销指令 规范名 别名…$` |\n| [`创建界面`](#创建界面) | 动作 | `$世界.创建界面 玩家 [行数] 标题…$` |\n| [`界面物品`](#界面物品) | 动作 | `$世界.界面物品 面 槽位 物品 数量 名称 说明 [发光]$` |\n| [`界面数据`](#界面数据) | 动作 | `$世界.界面数据 面 数据…$` |\n| [`打开界面`](#打开界面) | 动作 | `$世界.打开界面 面 回调$` |\n| [`点击消息`](#点击消息) | 动作 | `$世界.点击消息 玩家 段JSON$` |\n| [`输入界面`](#输入界面) | 动作 | `$世界.输入界面 玩家 标题 回调$` |\n| [`弹窗输入`](#弹窗输入) | 动作 | `$世界.弹窗输入 玩家 标题 提示 标签 最长 提交指令 [退出指令]$` |\n| [`关闭界面`](#关闭界面) | 动作 | `$世界.关闭界面 面$` |\n| [`音效`](#音效) | 动作 | `$世界.音效 玩家 音效 [音量] [音调]$` |\n| [`给物品`](#给物品) | 动作 | `$世界.给物品 玩家 物品 [数量]$` |\n| [`扣物品`](#扣物品) | 动作 | `$世界.扣物品 玩家 物品 [数量]$` |\n\n---\n\n### 取物品数\n\n`$世界.取物品数 玩家 物品$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：遍历 `Inventory#items / armor / offhand` 的 `ItemStack#getCount`，返回总数\n\n示例：\n\n```text\n余:$世界.取物品数 %玩家名% minecraft:dirt$\n$世界.提示 %玩家名% \"§7余额：%余% 个泥土\"\n```\n\n\n### 注册指令\n\n`$世界.注册指令 规范名 [权限] 别名…$`\n\n- 参数：\n  - 规范名 : `String`\n  - 权限 : `String`（可选参数，省略时用宿主默认值）\n  - 别名… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`CommandDispatcher#register`；重复注册按插件 + 规范名幂等，权限变化拆旧节点重注册\n\n示例：\n\n```text\n$世界.注册指令 商店 0 shop 泥土商店$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：写在 `[f]初始化`（每次编译都跑，宿主去重）。**不再需要写 `[f]卸载` 注销**：\n> 加载器每次编译按「批次 + 插件归属」对账，本批没声明的入口自动下线；`/nebula unload`\n> 时直接按插件整批注销。改掉 / 删掉旧名字后下次编译就生效，不用重启。\n\n\n### 注销指令\n\n`$世界.注销指令 规范名 别名…$`\n\n- 参数：\n  - 规范名 : `String`\n  - 别名… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：从根节点 children 按名字移除，只删该插件自己的入口\n\n示例：\n\n```text\n$世界.注销指令 商店 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 创建界面\n\n`$世界.创建界面 玩家 [行数] 标题…$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 行数 : `Integer`（可选参数，省略时用宿主默认值）\n  - 标题… : `String`\n- 返回值：界面对象 id（数字字符串）\n- 返回值类型：`String`\n- 失败回退：创建失败返回空串\n- 实现：返回界面对象 id；同时发 `清空界面` 动作建好容器，Rust 侧记录归属插件 / 玩家 / 标题\n\n示例：\n\n```text\n面:$世界.创建界面 %玩家名% 3 §a我的菜单$\n```\n\n> 注意：返回界面对象 id（数字字符串），后续 `界面物品` / `打开界面` / `关闭界面` 都要带这个 id。\n\n\n### 界面物品\n\n`$世界.界面物品 面 槽位 物品 数量 名称 说明 [发光]$`\n\n- 参数：\n  - 面 : `String`\n  - 槽位 : `Integer`\n  - 物品 : `String`\n  - 数量 : `Integer`\n  - 名称 : `String`\n  - 说明 : `String`\n  - 发光 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：校验对象归属后转成 `设界面物品` 动作（`ItemStack` + `CUSTOM_NAME / LORE / ENCHANTMENT_GLINT_OVERRIDE`）\n\n示例：\n\n```text\n$世界.界面物品 %面% 0 minecraft:diamond 1 minecraft:stone 说明文字$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 界面数据\n\n`$世界.界面数据 面 数据…$`\n\n- 参数：\n  - 面 : `String`\n  - 数据… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：校验对象归属后转成 `设界面数据` 动作\n\n示例：\n\n```text\n$世界.界面数据 %面% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 打开界面\n\n`$世界.打开界面 面 回调$`\n\n- 参数：\n  - 面 : `String`\n  - 回调 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：存下函数值闭包，发 `开界面` 动作（带 `界面ID`）；同一玩家的旧界面对象自动失效\n\n示例：\n\n```text\n$世界.打开界面 %面% %点击%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n> 注意：第二个参数是 `点击:[函数] … 结束` 定义的函数值，按值捕获局部变量；宿主点击时把 payload 作为闭包的 `%参数1%` 传入。\n\n\n### 点击消息\n\n`$世界.点击消息 玩家 段JSON$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 段JSON : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：一行可点击聊天：段是 `[{文,命令,悬停}]`，宿主给每段挂 `ClickEvent.RunCommand`；点击即以玩家身份执行命令\n\n示例：\n\n```text\n$世界.点击消息 %玩家名% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 弹窗输入\n\n`$世界.弹窗输入 玩家 标题 提示 标签 最长 提交指令 [退出指令]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`）\n  - 标题 : `String`，支持 `§` 颜色码（宿主解析成组件样式）\n  - 提示 : `String`，弹窗正文，支持 `§` 颜色码；倒计时、剩余次数这类动态提示由词库拼进这里\n  - 标签 : `String`，输入框左侧标签\n  - 最长 : `Int`，输入框 `max_length`（1~256）\n  - 提交指令 : `String`，已注册的指令名，**不带** `/`；宿主补上 ` $(pw)` 模板\n  - [退出指令] : `String`，可选尾参，默认空。非空时在提交按钮**左侧**加一个「退出服务器」按钮，点它执行该指令（不带参数）；通常配合词库里注册的指令调 `踢出玩家`，给未登录玩家一个明确出口\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：玩家不存在 / 提交指令为空 / 提交模板解析失败时不下发，不记异常；退出指令模板解析失败只退回单按钮弹窗，**不会连弹窗一起丢**\n- 实现：`退出指令` 为空用 `Holder.direct(NoticeDialog)`（单按钮）；非空改用 `MultiActionDialog`，按钮列表顺序即从左到右，`columns=2` 排成一行。`canCloseWithEscape=false`，`after_action=close`；提交按钮挂 `dynamic/run_command`，客户端把输入值替换到 `$(pw)` 后把整条命令发给服务端\n\n> **退出指令必须能被解析成宏**：原版 `ParsedTemplate` 的 CODEC 只接受「至少含一个 `$(变量)`」的模板，纯文本 `nquit` 会报 `No variables in macro`。宿主在退出指令不含 `$(` 时自动补 ` $(pw)`，所以点「退出服务器」实际发出的是 `nquit <输入值>`——指令自己忽略这个多余参数即可。早期版本直接把纯文本丢进去，解析失败后整个弹窗都不下发，表现就是「玩家进服完全没有弹窗」。\n\n> **提交会关闭弹窗**：`after_action=close` 决定每次提交后弹窗都消失。登录类词库必须在所有校验失败的分支重新调一次 `弹窗输入`，否则玩家会「输错一次密码，输入框就没了」。\n>\n> 这是 1.21.6 起才有的服务端可下发表单组件，低于 1.21.6 的版本不支持（当前 1.21.11 可用）。命令模板里的值会被引擎转义特殊字符，登录插件这类纯数字密码最稳妥。\n\n示例（登录插件的真实写法，提示文本里不含空格，避免被按空格切成多个参数）：\n\n```text\n$世界.弹窗输入 %玩家名% §8[§b星云§8]§f输入密码 §7请输入4-8位数字密码§8·§f剩300秒§8·§7错误0/5次 密码 8 npw nquit$\n```\n\n提交后客户端执行 `npw <输入值>`，词库在 `[指令]npw` 里收到完整密码；点左侧按钮执行 `nquit <输入值>`（退出指令不需要这个值，忽略参数即可）。\n\n---\n\n### 输入界面\n\n`$世界.输入界面 玩家 标题 回调$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 标题 : `String`\n  - 回调 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：铁砧命名框当文本框：存函数值闭包，发 `输入界面` 动作（带 `界面ID`）；输入框初始为空，点成品格时 `clickGui` 回传 `{玩家名,文本,动作}`，其它槽位只读\n\n示例：\n\n```text\n$世界.输入界面 %玩家名% §a标题 %点击%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 关闭界面\n\n`$世界.关闭界面 面$`\n\n- 参数：\n  - 面 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：发 `关界面` 动作并释放闭包\n\n示例：\n\n```text\n$世界.关闭界面 %面%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 音效\n\n`$世界.音效 玩家 音效 [音量] [音调]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 音效 : `String`\n  - 音量 : `Float`（可选参数，省略时用宿主默认值）\n  - 音调 : `Float`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#playNotifySound(SoundEvent, SoundSource, float, float)`\n\n示例：\n\n```text\n$世界.音效 %玩家名% minecraft:ui.button.click$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 给物品\n\n`$世界.给物品 玩家 物品 [数量]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n  - 数量 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Inventory#add`，按最大堆叠分批，塞不下 `Player#drop`\n\n示例：\n\n```text\n$世界.给物品 %玩家名% minecraft:diamond$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n\n\n### 扣物品\n\n`$世界.扣物品 玩家 物品 [数量]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n  - 数量 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：遍历背包 / 副手 / 盔甲扣减，不足时能扣多少扣多少\n\n示例：\n\n```text\n$世界.扣物品 %玩家名% minecraft:diamond$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / 重编译 才生效。\n"}, "neoforge": {"file": "neoforge.md", "title": "设计与实现现状", "group": "设计与实现", "text": "# NeoForge 服务端设计与实现现状\n\n> 最后校准：2026-11-09。本文既记录设计决策，也标注代码里**真正落地了什么**。实现以\n> `NebulaLoadMod/src/main/java/nebula/neoforge/` 与 `bridge/src/lib.rs` 为准；逐方法映射见\n> [`mc-api-map.md`](mc-api-map.md)，平台取舍见 [`platform-choice.md`](platform-choice.md)，\n> 三份文档的分工见 [`README.md`](README.md)。\n>\n> 标注口径：**已落地** = 代码里有对应实现；**规划** = 设计上保留、当前未实现；**已废弃** =\n> 早期设计后来被更简单的方案取代，保留说明避免有人照旧方案返工。\n\n## 1. 目标与边界\n\n- **宿主**：Minecraft Java 版专用服务端（1.21.11 / NeoForge 21.11.42 / Java 21）。\n- **词库**：`<gameDir>/nebula/<插件名>/`，入口 `main.n`，同目录顶层 `.n` 自动合并。\n- **桥接**：NeoForge mod 通过 JNI 调用 Rust `cdylib`，Rust 静态链接 `crates/nebula`。\n- **业务**：全部写在 `.n` 词库；Java 侧只做事件转发、命令注册、`世界` 原语与界面容器。\n- **不做**：客户端 mod、网络封包、词库下发、跨进程 IPC。\n- **已落地规模**：128 个 `世界` 方法（39 类查询分支 + 动作），5 个随服词库插件，一键回归自检 28/28 PASS。\n\n## 2. 运行时架构\n\n```text\nNeoForge 专用服务端\n  ├─ mods/nebula-neoforge-bridge-0.2.0.jar\n  │    ├─ nebula/neoforge/\n  │    │    ├─ NebulaMod.java       @Mod 入口：事件监听、/nebula 注册、动作落地\n  │    │    ├─ NativeBridge.java    JNI 声明 + 原生库解压加载\n  │    │    ├─ McApi.java           查询回调：读世界 → 文本 / JSON\n  │    │    ├─ McActions.java       动作落地：原版命令或稳定 API\n  │    │    ├─ McSupport.java       反射兜底、实体查找、物品快照、tick 统计\n  │    │    └─ GuiManager.java      箱子界面对象、点击拦截、会话清理\n  │    ├─ META-INF/neoforge.mods.toml\n  │    └─ META-INF/native/windows-x86_64/nebula_jni.dll\n  ├─ config/nebula-bridge/native/nebula_jni.dll   ← 运行时解压目标\n  └─ nebula/<插件名>/main.n …\n```\n\n数据流：\n\n```text\nNeoForge 事件（服务端主线程）\n  → NebulaMod 组装 payload JSON\n  → NativeBridge.dispatch / dispatchCommand / clickGui\n  → Rust 引擎分发到词库（事件帧 / [指令] 词条 / 界面点击闭包）\n  → 词库调用 $世界.方法 …$\n      查询：Rust → JNI → McApi.query（同步读世界，立即返回）\n      动作：Rust 收集进 actions 队列，dispatch 返回后由宿主 executeActions 落地\n  → 输出行由宿主广播 / 回给玩家；取消标志写回本次事件\n```\n\n> **动作是延迟执行的**：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是\n> 旧值，要到下一次事件 / 重编译才生效。这是查询同步、动作走队列的直接后果，写词库时必须记住。\n\n早期架构图里的 `ServerLifecycle` / `EventBridge` / `ServerTaskQueue` / `NebulaCommand`\n**未落地**：生命周期、事件桥与命令注册目前都集中在 `NebulaMod`，异步结果回主线程尚未实现。\n\n## 3. mod 入口与生命周期\n\n### 3.1 入口\n\n```java\n@Mod(NebulaMod.MODID)   // MODID = \"nebula_bridge\"\npublic final class NebulaMod {\n    public NebulaMod() { /* 只注册事件监听 */ }\n}\n```\n\n构造函数**不读配置、不定位路径、不加载原生库、不创建引擎**（此时服务端世界尚未就绪）。\n实际注册 12 个监听：`ServerStartedEvent`、`ServerStoppingEvent`、`ServerChatEvent`、\n`LivingDamageEvent.Post`、`LivingHealEvent`、`BlockEvent.BreakEvent`、\n`RegisterCommandsEvent`、`PlayerContainerEvent.Close`、`PlayerLoggedInEvent`、\n`PlayerLoggedOutEvent`、`ServerTickEvent.Pre/Post`。\n\n此外 `EventBridge` 在开服后按词库订阅**动态**注册其它 NeoForge 事件监听器（见 5.2），\n不在构造期写死；没有插件订阅时不挂任何额外监听器。\n\n### 3.2 生命周期表\n\n| 阶段 | 事件 | 实际动作 |\n| --- | --- | --- |\n| mod 构造 | `@Mod` 构造函数 | 注册上面 10 个监听，仅此而已 |\n| 服务端启动完成 | `ServerStartedEvent` | `NativeBridge.load()` → `create(<gameDir>/nebula, world-specs.json)` → `loadAll()` → `executeActions`（落地插件指令注册） |\n| 每 tick | `ServerTickEvent.Pre/Post` | 只调 `McSupport.onTickPre/Post`，用 40 tick 滑窗算 TPS / MSPT / 服务器 tick；**不直接调用 JNI**（订阅 tick 事件的插件由通用事件桥节流到 20 tick 一次） |\n| 插件订阅变化 | 开服 `loadAll` / `/nebula load\\|unload\\|debug\\|undebug` | 调 `EventBridge.refresh(handle)`：读 Rust 侧订阅表，增量增删 `IEventBus` 监听器 |\n| 命令注册 | `RegisterCommandsEvent` | 注册 `/nebula` 及其子命令，清空插件指令映射 |\n| 关界面 / 退出 | `PlayerContainerEvent.Close` / `PlayerLoggedOutEvent` | 清理界面会话、释放点击闭包 |\n| 服务端停止 | `ServerStoppingEvent` | `GuiManager.clearAll()`、清空插件指令、`NativeBridge.destroy(handle)` |\n\n两点容易误判：\n\n- `destroy` 只清空界面会话与生物对象表并 `drop(Bridge)`；**`[f]卸载` 钩子已移除**，\n  `/nebula unload` 的回收全部由加载器按插件归属完成（指令 / 界面 / 生物 / 订阅 / 资源包）。\n- 词库根固定为 `FMLPaths.GAMEDIR.get().resolve(\"nebula\")`，没有配置文件可改。\n\n### 3.3 命令\n\n| 命令 | 行为 |\n| --- | --- |\n| `/nebula list` | 列出插件及调试开关状态 |\n| `/nebula load\\|unload <插件名\\|--all>` | 加载（已加载则重编译）/ 卸载 |\n| `/nebula debug\\|undebug <插件名\\|--all>` | 开关词库文件改动自动重编译 |\n\n控制台始终可用，玩家需 OP。早期设计里的 `/nebula 自检` **未落地**：自检能力由\n`NebulaLoadMod/selftest/` 的独立测试服脚本提供。`[f]自检` 是词库侧约定，不是 `/nebula` 子命令。\n\n**插件指令**由词库自己注册，不再写进 `nebula.ini`：`[f]初始化` 里\n`$世界.注册指令 商店 0 shop 泥土商店$`。**不需要写 `[f]卸载` 注销**：宿主在每次编译后\n按「批次 + 插件归属」对账，本批没声明的指令自动摘掉；`/nebula unload` 时直接按插件\n整批注销。宿主在 `executeActions` 里增删 Brigadier 节点并 `sendCommands` 重发命令树；\n执行时按规范名匹配 `[指令]商店|shop` 词条；没有对应词条时返回 `ok=false`。\n\n### 3.4 tick 与异步：设计与实现的差异\n\n| 早期设计 | 现状 |\n| --- | --- |\n| 每 tick 调 `NativeBridge.tick(handle, tickCount)` | **已废弃**：JNI 契约里没有 `tick`，tick 事件只用于统计 |\n| 热重载每 20 tick 轮询一次指纹 | **已废弃**：debug 插件在**每次事件分发前**比一次指纹 |\n| 编译放工作线程、成功后原子替换 | **已废弃**：`compile_plugin` 在调用线程同步执行，成功后用 `Mutex` 替换注册表 |\n| `$异步$` 结果投递 `ServerTaskQueue` 回主线程 | **规划**：该类未落地；当前 `世界` 查询/动作都在事件分发的主线程同步完成 |\n\n结论：现在不存在跨线程的 `世界` 调用，因此也就没有「非主线程访问 Minecraft 对象」的路径；\n代价是一次事件处理必须短小，长 IO 仍应避免（词库侧 `$异步$` 由 Rust 引擎维护）。\n\n## 4. 词库加载与热重载\n\n### 4.1 目录与元数据\n\n```text\n<gameDir>/\n├── mods/nebula-neoforge-bridge-<version>.jar\n├── config/nebula-bridge/native/nebula_jni.dll   ← 原生库解压目录（不是配置）\n└── nebula/                                      ← 词库根（固定）\n    └── <插件名>/\n        ├── main.n\n        ├── 其它.n          ← 目录顶层自动合并\n        ├── nebula.ini      ← 元数据，桥接层不解析\n        └── *.json          ← 插件自己的配置 / 商品数据\n```\n\n- 一个文件夹 = 一个插件，文件夹名即插件名；`_` / `.` 开头的目录禁用。\n- 入口 `main.n` 优先；没有 `main.n` 时只允许目录内唯一一个 `.n`；单文件 `$引入` 不再支持。\n- `nebula.ini` 目前是纯元数据（`名称` / `作者` / `地址` / `版本` / `描述`），**桥接层不读取**；\n  早期用它声明「指令」的做法已废弃。\n- 编译时会把插件目录注入成 `%库目录%`（词库 root，函数帧也能读），配置文件用\n  `$读文件 %库目录%/x.json$` 读取；`.json` 也纳入 debug 指纹。\n- `%时间%` / `%版本%` 是引擎内置系统变量，词库同名赋值会被遮蔽，变量名要加前缀。\n\n### 4.2 生命周期钩子（早期文档写错了，以此为准）\n\n| 钩子 | 触发时机 | 适合做什么 |\n| --- | --- | --- |\n| `[f]@头部` / `[f]初始化` | **每次编译**：load / loadAll / debug 自动重编译 | 配置、状态、注册指令 |\n| `[f]加载` | 仅插件首次插入（`load` 新插件 / `loadAll`） | 「就绪」提示；已加载后再 `load` 不跑 |\n\n`compile_plugin()` 编译成功后先跑 `@头部` + `初始化`；只有首次插入才再跑 `加载`。\n**debug 自动重编译只跑 `初始化`**，不会跑 `加载`——这是自检词库把\n「就绪」提示放在 `[f]加载`、把读回验证放在 `[f]初始化`（在线人数守卫）的原因。\n\n其它编写约束：布局敏感（块外空行分隔词条，`如果尾` / `结束` 必须闭合）；一行只能一个\n`$调用$` 且**结尾 `$` 不能漏**；`[函数]` 帧不继承调用方作用域，配置 / 状态要显式传参；\n事件帧的父作用域是 `plugin.state`；函数值用 `回调:[函数] … 结束` 定义，作为实参传入后\n在被调时落到 `%参数1%`。详见 [`bridge/README.md`](../../bridge/README.md) 第 4、5 节。\n\n### 4.3 热重载与调试\n\n- `/nebula load`：先编译新版本，成功才替换；词库写坏时旧版本继续可用。**已加载的插件再 `load` 就是重编译**（没有独立的 reload 指令）。\n- `/nebula debug`：每次事件分发前比一次插件目录内全部 `.n` + `.json` 的「文件名 + 修改时间」\n  指纹；变了就同步重编译并替换，失败保留旧版本并记下这次指纹，同一份坏文件不会反复刷日志。\n- 重新 `load` 不清除调试开关；`unload` 后重新 `load` 回到非调试状态。\n- 卸载插件会同时清掉它创建的界面对象回调，避免悬空闭包。\n\n## 5. 事件桥、指令与界面\n\n### 5.1 内置事件（6 个中文词条）\n\n| 词库词条 | NeoForge 事件 | 可取消 | payload 要点 |\n| --- | --- | --- | --- |\n| `[事件]玩家聊天` | `ServerChatEvent` | 是 | `玩家` / `玩家名` / `消息` / `管理员` / `潜行` / `维度` / `x,y,z` |\n| `[事件]实体受伤` | `LivingDamageEvent.Post` | 否（伤害已结算） | `攻击者` / `实体` / `伤害` / `剩余` / `身高` / `暴击` / `原因` / `致死`；任意来源的掉血都转发（含怪物互殴 / 环境 / 自伤），暴击仅玩家来源按 `Player#attack` 复算，其余为 `否` |\n| `[事件]实体治疗` | `LivingHealEvent` | 否（回血已发生） | `实体` / `数值`（按上限截断后的真实回复）/ `之前` / `剩余` / `身高` / `原因`（自然回复 / 效果 / 其它）/ `满血`；已满血直接不转发 |\n| `[事件]方块破坏` | `BlockEvent.BreakEvent` | 是 | 玩家 + 方块 + 坐标快照 |\n| `[事件]玩家进入` | `PlayerLoggedInEvent` | 否 | `玩家` / `玩家名` / `管理员` / `维度`；每次连接都触发，登录插件用它重建会话 |\n| `[事件]每秒` | `ServerTickEvent.Post`（每 20 tick） | 否 | `服务器tick` / `在线人数`；给倒计时、超时踢人这类没有平台事件的逻辑用 |\n\n约定：payload 只含基础类型与 JSON，不跨线程持有 Minecraft 对象；事件异常只记日志并跳过该插件；\n取消标志由 Rust 写入本次事件槽位，宿主在 `executeActions` 前后统一 `event.setCanceled(true)`。\n事件输出行会被宿主广播 / 回给玩家，私聊用 `$世界.提示$`。\n这 6 个是语义定制的中文事件；另有 8 个中文别名（7 个玩家交互：`右键物品` / `右键方块` /\n`右键空气` / `左键方块` / `左键空气` / `右键实体` / `右键实体部位`，外加\n`玩家退出` → `PlayerEvent.PlayerLoggedOutEvent`），由 5.2 的 `cnNames` 别名表解析到\n对应事件类，payload 同时注入中文键\n（`%玩家名%` / `%物品%` / `%面%` / `%手%` …，枚举值翻成「主手 / 上 / 是」这类中文）。\n其余 NeoForge 事件类走 5.2 的通用事件桥。\n\n### 5.2 通用事件桥（事件总线全量映射）\n\n`NebulaLoadMod/tools/gen_events.py` 在构建期从 `neoforge-21.11.42-universal.jar` 抽出\n`net/neoforged/neoforge/event/**` 下的 267 个事件类，写成 jar 内的\n`nebula/events.json`（`name` = Java 类简名，内部类用 `.` 代替 `$`；`class` = 完整类名；\n`throttle` = tick 类事件的节流周期；`hint` = 加载期事件提示；顶层 `cnNames` = 中文名 →\n类简名的别名表，条目上的 `cn` = 反向标注）。别名表由 `gen_events.py` 的 `CN_ALIASES`\n生成，指向不存在的事件会直接报错，不会静默留下死名字。\n\n- **订阅驱动**：Rust 侧 `eventTriggers(handle)` 汇总所有插件 `dic_funcs[\"事件\"]` 的\n  trigger 名；`EventBridge.refresh` 与当前 `ACTIVE` 表做 diff，用\n  `IEventBus.addListener(EventPriority, boolean, Class, Consumer)` 注册新增的、\n  `unregister(consumer)` 摘掉不再订阅的。内置中文事件不在清单里，不会重复分发。\n- **payload**：反射遍历 public getter，按 Java 字段名注入（`getEntity()` → `%entity%`），\n  复杂对象结构化；未知类型只留短字符串。随后 `addChineseFields` 按已有 JSON 字段\n  **另加一份中文别名**（`%玩家名%` / `%物品%` / `%方块x%` / `%面%` / `%事件名%` …），\n  英文键不删；这一步只做 JSON 映射，不依赖具体 MC 类。实现 `ICancellableEvent` 的事件\n  支持 `$世界.取消事件$`。\n- **中文名分发**：`refresh` 先把订阅名经 `cnNames` 换成清单简名再注册，但 `dispatch`\n  仍用原订阅名（中文），所以命中 `[事件]右键物品` 而不是英文词条；注册成功会记一条\n  `中文事件 右键物品 → … 已注册`，`regress.py` 拿它当回归锁。\n- **成本约束**：没有订阅就零额外 JNI；`EntityTickEvent` / `PlayerTickEvent` /\n  `LevelTickEvent` / `ServerTickEvent` 这类每实体 / 每 tick 事件按 20 tick 节流。\n  注册期 / 客户端专用类运行时被过滤，专用服收不到加载期事件时会记 WARN。\n- **信任链**：`build.ps1` 把清单打进 jar，`regress.py` 按内容比对 jar 内清单与源码，\n  升级 NeoForge 后不重新生成 + 全量构建就会报「产物与源码不一致」。\n\n词库写法见 [`apis/事件.md`](apis/事件.md) 末节与 [`plugin-guide.md`](plugin-guide.md) 第 4 节。\n\n### 5.3 界面与点击（不再需要 Mixin）\n\n早期把「物品栏点击事件」列为待拍板、认为必须 Mixin。`GuiManager` 用自定义 `ChestMenu`\n落地后，这条路已经不需要了：\n\n- `创建界面` 返回界面对象 id → `界面物品` / `界面数据` 只操作该对象 → `打开界面 面 回调` 把\n  `回调:[函数] … 结束` 闭包交给宿主；点击时 `NebulaMenu#clicked` 全拦截（不移动物品），\n  按菜单绑定的界面 id 调 `clickGui(handle, id, payload)`，Rust 直接执行闭包，payload 落在 `%参数1%`。\n- 界面统一用对象写法；缺少界面对象 id 的点击会被忽略并记 WARN。\n- 关窗 / 退出 / 卸载 / `destroy` 都会走 `closeGui` 释放闭包；同一玩家只保留最后一个打开的界面对象。\n- 覆盖面只到「词库自己打开的箱子界面」，原版容器与客户端本地背包界面不接管。\n\n### 5.4 唯一占位\n\n`$世界.打开背包$`：玩家背包是客户端本地 `InventoryScreen`，服务端不管理，宿主只记一条 WARN。\n需要界面时用 `创建界面` + `打开界面` 打开箱子界面。\n\n## 6. 线程模型\n\n- **硬约束不变**：Minecraft / NeoForge API 只能在服务端主线程调用；词库事件分发、`世界`\n  查询与动作落地全部同步发生在主线程。\n- 早期设计里「`McApi` 入口统一检查 `server.isSameThread()`」**未落地**——代码里没有这层断言。\n  当前之所以安全，是因为所有入口都从事件回调同步进来，没有第二条线程能触达 `McApi`。\n- 编译 / 热重载同步执行，替换靠 `Mutex`；`plugin.state` 与异步任务带 epoch，过期回调丢弃。\n- 词库事件里不要长时间 IO；`$异步$` 结果回主线程的 `ServerTaskQueue` 仍是规划项。\n\n## 7. 客户端 / 服务端边界\n\n- **双端 mod**（`side=BOTH`）：`src/main/java` 放服务端与通用逻辑，`src/client/java` 放渲染 /\n  界面 / 客户端资源读取；`build.ps1` 把两个源集编进同一个 jar（服端 jar 里也有客户端类，\n  靠 dist 守卫避免被加载）。\n- 词库引擎只在服务端跑（`ServerStartedEvent` 创建）；`FMLEnvironment.getDist()` 只出现在\n  创造页声明这一条链路上。\n- **创造页的坑（0.2.9 修）**：创造页是客户端**本地**重建的——\n  `CreativeModeInventoryScreen#tryRebuildTabContents` → `CreativeModeTab#buildContents`\n  → `EventHooks.onCreativeModeTabBuildContents`。也就是说客户端机器的\n  `FMLPaths.GAMEDIR` 里必须有声明文件，而玩家机器上根本没有服务端的 `nebula/` 目录。\n  插件资源目录是 `资源/<类型>/…`（`NebulaPack` 按类型表映射成包内 `assets/**`；不再支持插件根下的 `assets/`）。\n  所以 `ItemRegistry` / `MobRegistry` 派生的 `assets/nebula/creative/*.json`\n  **随资源包下发**，客户端 `ClientCreativeDecls` 用\n  `ResourceManager#listResources(\"creative\", …)` 读回来，填进「星云物品」那一栏。\n  结论：**只在服务端放声明，玩家永远看不到那颗蛋**。\n- 资源包 / 创造页声明改动 → 资源包 sha 变 → 客户端重连会重新提示接受。\n\n\n## 8. 构建、部署与配置\n\n### 8.1 版本（已锁定，不再是待拍板）\n\n| 项 | 当前值 |\n| --- | --- |\n| Minecraft | 1.21.11 |\n| NeoForge | 21.11.42（依赖范围 `[21.11,21.12)`） |\n| Java | 21（服务端自带 `.jdk/jdk-*`） |\n| Rust | stable，`cdylib`，`jni` crate |\n| 构建 | **没有 Gradle**：`build.ps1` 直接调 `cargo build --release` + `javac` + `jar` |\n\n**1.21.11 实现要点**：注册表 id 用 `Identifier`、`GameProfile.name()` 取用户名、\n`Inventory` 字段私有化后走 `McSupport.inventorySlots()` 槽位视图、\n`ComponentSerialization.CODEC` 序列化聊天组件、`EntityType.create(TagValueInput, …)` +\n`EntitySpawnReason.COMMAND` 建实体，权限判断走 `Commands.hasPermission(LEVEL_*)` /\n`permissions().hasPermission(...)`。能用公开 API 的地方直接调用（种子 / 协议号 / 时间 /\nFoodData / 实体交互），只有游戏规则、属性注册表与事件 getter 这类需要动态枚举的场景保留反射。\n\n`mods.toml` 依赖范围锁死为 `[1.21.11,1.21.12)` / `[21.11,21.12)`：其它 MC 版本有破坏性 API\n变更，用错版本编译的 jar 会因常量池方法引用懒解析而「服起得来、玩家一进就崩」。事件清单由\n`python NebulaLoadMod/tools/gen_events.py` 从 21.11.42 的 universal jar 抽取（当前 267 个事件类），\n升级 NeoForge 必须重新生成。\n\n早期推荐的 ModDevGradle 2.x / NeoGradle 7.x 方案**未采用**：工程规模小，直接用服务端\n`libraries` 里的官方映射 jar 编译更省事。若将来引入 Mixin 或多模块再评估。\n\n### 8.2 构建脚本\n\n```powershell\npowershell -ExecutionPolicy Bypass -File NebulaLoadMod/build.ps1            # 全量\npowershell -ExecutionPolicy Bypass -File NebulaLoadMod/build.ps1 -SkipRust   # 只改 Java\n```\n\n四步：`cargo build --release` → `javac`（classpath 取 `server-1.21.11/libraries` 下除\n`-slim` / `-unpacked` 外的 jar，这两类带 SRG 名会编译失败）→ 复制 `neoforge.mods.toml`\n与 `nebula_jni.dll` 到 `build/classes/META-INF/` → `jar --create` 并部署到 `server-1.21.11/mods/`。\n`-RustTargetDir` 可指定 Rust 产物目录。`-SkipRust` 要求 `target/release/nebula_jni.dll` 已存在。\n脚本最后会打开 jar 比对内嵌 dll 与 release dll 的 SHA256——`Deployed` 只证明复制成功，不证明内容新。\n构建时还会把 `bridge/src/**/*.rs`、`Cargo.toml`、`src/main/java/**/*.java` 的逐文件 SHA256\n写进 jar 内 `META-INF/nebula-build.json`。全量构建还会在 `target/release/` 落下\n`nebula_jni.manifest.json`——与 dll 哈希绑定的一手记录，写明「这份 dll 由哪份 Rust 源码编出」；\n`-SkipRust` 不重编 dll，只读这份清单（不再信上一个 jar 的自述），清单缺失或 dll 哈希不符即失败。\n`bridge/build.rs` 在编译期把 `src/**/*.rs` + `Cargo.toml` 的逐文件 SHA256 经 `cargo:rustc-env`\n烧进 dll 的 `.rodata`（`NEBULA_SOURCES=` 标记）；`-SkipRust` 会比对清单记录与该标记，不一致即失败。\n\n### 8.3 原生库加载\n\n`NativeBridge.load()` 按 `os.name` / `os.arch` 拼出平台目录，从 jar 内\n`/META-INF/native/<platform>/` 解压到 `<gameDir>/config/nebula-bridge/native/`，再 `System.load`。\n`platform()` 能识别 windows / macos / linux × x86_64 / aarch64，但**构建脚本目前只打包\nwindows-x86_64**，其它平台需先扩展脚本。\n\n### 8.4 配置现状\n\n早期草案里的 `config/nebula-bridge.toml`（`wordlib.root` / `debug_poll_ticks` /\n`scan_budget` / `event.player_move`）**不存在，也没有被读取**。当前约定是：词库根固定、\ndebug 靠命令开关、事件集写死在 `NebulaMod` 构造函数里。`config/nebula-bridge/` 目录只放\n解压出来的原生库。要支持可配置，得同时改 Java 侧与 Rust 侧，作为后续项。\n\n### 8.5 一键回归\n\n`python NebulaLoadMod/selftest/regress.py`（`--keep` 保留现场）：准备隔离服（端口 25566 /\nRCON 25576，目录联接共享 `libraries` / `.jdk`，独立 `level-name`）→ 启动两个 mineflayer\n假玩家 → 跑 `selftest/wordlib` → 按 `selftest/checks.json` 用原版 `execute if …` /\n`data get entity …` 批量反查 → 恢复 tick、RCON `stop`、清理。实测 **28/28 PASS、0 告警**。\n\n启服前先做**产物校验**：jar 内嵌 dll 与 `bridge/target/release/nebula_jni.dll` 的 SHA256 一致，\n并逐文件比对 `META-INF/nebula-build.json` 记录的源码内容指纹与工作区现状；\n不一致会报出具体变动文件并中止，避免用旧 jar 得出假 PASS。\n按**内容**而非修改时间判断，所以编辑器空保存不会误报；jar 无 manifest 时才退回 mtime 兜底。\n另外会拿 `target/release/nebula_jni.manifest.json` 做交叉校验（dll 哈希 + Rust 指纹），\n确保 jar 里的指纹来自 dll 产出时的一手记录，而不是上一个 jar 的转述。\n**最终一手证据来自 dll 自身**：回归脚本从 jar 内 dll 的字节里解析 `NEBULA_SOURCES=` 标记，\n与当前源码逐文件比对。即使 jar manifest 与原生库清单被同时伪造，只要 dll 没重编就会被拦住。\n信任链到此为止——再往上需要代码签名或可信构建，超出本地项目的范围。\n只想秒级检查用 `python NebulaLoadMod/selftest/regress.py --verify-only`；`--skip-verify` 不推荐。\n升级 Minecraft / NeoForge 版本前先跑它，断言写在 `checks.json`。清理时先摘目录联接再删目录，\n**绝不碰 `server-1.21.11/world`**。线上服未开 RCON、stdin 不可注入，不要用 `taskkill` 代替 `stop`。\n\n## 9. 决策台账\n\n### 已定\n\n1. **版本**：Minecraft 1.21.11 / NeoForge 21.11.42 / Java 21。\n2. **构建**：`build.ps1` + `javac`，不引入 Gradle。\n3. **词库根**：`<gameDir>/nebula`（固定，不可配置）。\n4. **运行模式**：只支持专用服务端。\n5. **物品栏点击**：自定义 `ChestMenu` 拦截，不引入 Mixin；`打开背包` 保持占位。\n6. **原生库**：jar 内打包 + 运行时解压到 `config/nebula-bridge/native/`。\n7. **mod 元信息**：`modId = nebula_bridge`、`displayName = Nebula Bridge`、`license = All Rights Reserved`。\n8. **平台矩阵**：先只做 Windows x64；Linux / macOS 待扩展构建脚本。\n9. **插件指令**：词库自注册，不再读 `nebula.ini`。\n\n### 仍开放\n\n- Linux / macOS（含 aarch64）原生库打包与跨平台冒烟。\n- `nebula-bridge.toml` 配置化：词库根、事件开关、`scan_budget` 等。\n- `ServerTaskQueue`：`$异步$` 结果回主线程的正式通道。\n- 监听任意容器（含原版容器 / 玩家背包）时才考虑 Mixin `AbstractContainerMenu#clicked`。\n- 集成服务端支持；侧边栏分数行；完整 SNBT 实体生成。\n- 通用事件桥的高频事件按需分频（当前固定 20 tick 节流）。\n\n## 10. 验证清单\n\n| 项 | 状态 | 证据 |\n| --- | --- | --- |\n| 目录与基岩版对应、词库结构一致 | ✅ | `server-1.21.11/nebula/` 与 `bridge/README.md` |\n| 生命周期覆盖启动 / tick / 停止 / 命令，构造期不碰世界 | ✅ | `NebulaMod#onServerStarted` / `onServerStopping` |\n| 热重载失败回退、旧任务 epoch | ✅ | `op_load` 先编译后替换；`bridge/src/lib.rs` 单测 |\n| 每个 `世界` 方法都能对应到实现或明确降级 | ✅ | 128 个方法全量落地，唯一占位 `打开背包`；见 `mc-api-map.md` |\n| 主线程同步、无跨线程 `世界` 调用 | ✅ | 动作走 `executeActions`，无 JNI tick |\n| 客户端/服务端边界明确 | ✅ | `side = \"SERVER\"`，客户端无需装 mod |\n| 构建产物布局可执行 | ✅ | `build.ps1` 构建部署成功；jar 已在 `server-1.21.11/mods/` |\n| 真机验证 | ✅ | 1.21.11 / 21.11.42：查询、动作、双假玩家、悬浮字 / 治疗 / 通用事件桥动态注册，28/28 PASS、0 告警；见 `mc-api-map.md` 第 0 节 |\n| Rust 单测 | ✅ | `cargo test --offline --lib` 7/7 通过（含文档 ↔ 代码双向断言、随服词库编译） |\n| 一键回归 | ✅ | `regress.py` 28/28 PASS、0 告警 |\n"}, "api": {"file": "mc-api-map.md", "title": "世界 方法映射（契约）", "group": "设计与实现", "text": "# `世界` 内置函数 ↔ NeoForge / Minecraft API 映射\n\n> 本文是**编译期契约**，不是事后补的说明：`bridge/src/lib.rs` 用 `include_str!` 把第 1~6 节的\n> 映射表读进单测，双向断言「文档里的方法都有函数、注册过的函数都写进了文档」。\n> 参数位次 / 类型 / 尾参默认值的唯一来源是 `NebulaLoadMod/src/main/resources/nebula/world-specs.json`，\n> 本表由单测与它对齐。新增 / 删除方法的步骤见第 0 节末尾的「维护流程」。\n> 设计背景见 [`neoforge.md`](neoforge.md)，三份文档的分工见 [`README.md`](README.md)。\n\n约定：\n\n- 方法名、参数顺序、返回值形态与基岩版 `mc` 保持一致（Java 侧注入对象统一为 `世界`），便于词库迁移。\n- 使用 Mojang 官方映射（NeoForge 默认）；类名以 `net.minecraft.*` 为准。\n- **状态列**：`确认` = 方向明确，具体签名按目标版本落地；`待版本确认` = 方法存在但签名随版本变动；`需 Mixin` = 无公开事件/API；`不支持` = 明确不做。\n- 查询失败返回空串 / `{}` / `[]`；动作失败返回空串并记录日志。\n- 表格里的**状态列**是早期设计评估（`确认` / `待版本确认` / `需 Mixin`），不是实现状态；实现情况见下节。原「需 Mixin」的 tick 四项改走 1.20.3 起就有的原生 `/tick`，无需字节码增强。\n\n## 0. 实现状态（2026-11-08 全量落地）\n\n> **注入对象**：词库里统一写 `$世界.取方块 …$`。\n> 文件名 `mc-api-map.md` 沿用旧称，避免各处链接失效。\n\n映射表共 **131 个 `世界` 方法全部有对应函数**（22 个手写 hook + 109 个表驱动规格），\n词库调用时不会再出现「未知方法」。界面统一用「对象 + 点击闭包」。\n统一的规约是「一条映射 = 一个规格 = 一个函数」。\n\n**方法规格的唯一来源是 `NebulaLoadMod/src/main/resources/nebula/world-specs.json`**：每条声明\n`name` / `query` / `fallback` 与 `fields`（`key` / `at` / `kind` / 可选 `default`）。\nJava 在 `NativeBridge.create` 时把这份 JSON 交给 Rust，Rust 只做通用转发，不再硬编码任何方法名。\n因此增删或改一个表驱动方法只需动 JSON 与宿主分支，**不用重编 dll**（`-SkipRust` 即可）。\n22 个手写 hook 仍留在 `bridge/src/lib.rs`，因为它们带界面对象 id 与点击闭包等运行期状态。\n\n| 层 | 文件 | 职责 |\n| --- | --- | --- |\n| 规格唯一来源 | `NebulaLoadMod/src/main/resources/nebula/world-specs.json` | 109 条表驱动方法的声明，随 jar 走；`WorldSpecs.load()` 读出后传给原生层 |\n| 注入类 `世界` | `bridge/src/lib.rs` `mc_methods()` + `register_table_driven()` | 把规格翻译成 `NasFunc`；查询类构造请求 JSON 走 `java_query`，动作类压入动作队列 |\n| 查询回调 | `NebulaLoadMod/.../McApi.java` | `op` → 读世界 → 返回文本 / JSON 文本 |\n| 动作落地 | `NebulaLoadMod/.../McActions.java` | `op` → 原版命令或稳定 API；不确定的签名交给反射兜底 |\n| 通用支撑 | `NebulaLoadMod/.../McSupport.java` | 反射调用、实体查找（id / UUID / 名称）、物品与实体快照、tick 统计、环境变量 |\n\n- 现有的 22 个手写 hook（提示 / 广播 / 界面对象 / 指令注册 / 取消事件 / 取相邻方块 / 取物品数等）保持不动，规格 JSON 只补缺失项。\n- 绝大多数动作用原版命令实现（`setblock` / `fill` / `fillbiome` / `effect` / `gamemode` / `experience` / `summon` / `particle` / `gamerule` / `save-all` …），好处是自带权限、掉落与客户端同步，也不受版本方法签名浮动影响。\n- 少数版本相关查询（种子、生物群系、方块标签、游戏规则、协议版本、实体属性、FoodData setter、经验进度等）走反射，读不到就返回空串 / 默认值，**不会让整个 mod 编译失败**。\n- `取TPS` / `取MSPT` / `取服务器tick` 由宿主自己统计 `ServerTickEvent.Pre/Post` 的 40 tick 滑窗，不依赖服务端内部字段。\n- 一致性由单测锁住：`cargo test --offline --lib` 里的 `every_mapped_mc_method_has_a_function` 双向断言「文档每个方法都有函数、每个函数都写进了文档」；`every_method_has_a_host_handler` 直接读 `world-specs.json`，断言每条规格在 `McApi` / `McActions` / `NebulaMod` 里有分支；另有两条测试校验参数位次、布尔 / 文本 / 回退值与尾参默认值。`regress.py` 还会比对 jar 里的规格 JSON 与源码哈希。\n\n### 参数规约\n\n规格 JSON 按**参数位次**取值，字段命名如下（与宿主 JSON 一致）：\n\n| 词库实参 | 请求字段 | 说明 |\n| --- | --- | --- |\n| 玩家 | `玩家` | 接受玩家名，也接受 `%玩家%` 注入的 JSON 对象（自动取 `名称`） |\n| 维度 | `维度` | `minecraft:overworld` 这类注册名 |\n| 坐标 | `x` / `y` / `z` | 区域类用 `x1/y1/z1/x2/y2/z2`；区块类 `x`/`z` 是区块坐标 |\n| 实体 | `实体` | 数字 id / UUID / 名称都可以，命令里统一换成 UUID 选择器 |\n| 是/否 | `值` | `是 / true / 1 / 开 / 真 / yes / on` 视为真 |\n| 数值 | `数值` / `数量` / `时刻` / `秒` / `等级` … | 整型或浮点由规格 JSON 的 `kind` 指定 |\n| 剩余文本 | `文本` / `原因` / `状态` / `数据` / `说明` | 吞掉该位次之后的全部参数，用空格拼接 |\n\n### 可选尾参（省略时用声明的默认值）\n\n**只有尾部参数可以省略**。词库按位置传实参，省掉中间参数会让后面的参数整体错位，所以规格 JSON\n只对尾参写 `default` 字段。省略时 `build_request` 直接写默认值，而不是让 `d.int()` 的 `0`\n混进宿主——否则「秒」会变成 1 秒而不是 30 秒、「数量」会被夹到 1 但语义不清。\n\n| 方法 | 可省参数 | 默认值 |\n| --- | --- | --- |\n| `给予物品` / `丢弃物品` / `设置副手` | 数量 | 1 |\n| `设背包物品` | 数量 | 1 |\n| `加效果` | 秒 / 等级 | 30 / 1 |\n| `治疗玩家` / `伤害玩家` / `实体伤害` / `实体治疗` | 数值 | 1 |\n| `加等级` / `加经验` | 数值 | 1 |\n| `设置等级` / `设置经验进度` | 数值 | 0 |\n| `设置饥饿` / `设置饱和度` / `设置消耗度` | 数值 | 20 / 5 / 0 |\n| `设置权限` | 等级 | 0 |\n| `设置能力` / `设置飞行` / `设置无敌` / `设置隐身` / `设置名牌可见` / `实体隐身` | 值 | 是 |\n| `取实体列表` | 上限 | 512 |\n| `设置区块半径` / `重发区块` | 数值 | 8 / 0 |\n| `悬浮字` | 缩放 / 上升 / 时长 | 1 / 1 / 20 |\n| `踢出玩家` / `设方块状态` / `生成实体` | 原因 / 状态 / 数据 | 空 |\n\n传全参数的行为完全不变；上面每一项都由 `optional_tail_params_use_defaults` 单测锁住。\n\n### 明确降级 / 占位 / 实现偏差\n\n| 方法 | 现状 |\n| --- | --- |\n| `打开背包` | **唯一占位**：玩家背包是客户端本地 `InventoryScreen`，服务端不管理；宿主记一条 WARN。需要界面时用 `创建界面` + `打开界面` 打开箱子界面 |\n| `生成实体` | 原设计的「整段 SNBT」改为 `维度 类型 X Y Z [NBT]`，走 `summon` 命令；NBT 不能含空格 |\n| `设生物群系` | 走 `fillbiome`，Y 范围固定 `-64 ~ 319` |\n| `更新天气` | 数值按 `weather rain <秒>` 原样传给命令 |\n| `设置权限` | 用 `op` / `deop` 近似「等级 > 0」，不是分级权限 |\n| `设置侧边栏` | 用全局 `nebula_sidebar` 目标，标题可重复更新（已存在走 `modify displayname`，不再 remove/add），暂不设置分数行 |\n| `交互` | `interactOn` 签名随版本浮动，按参数个数反射调用 |\n| `悬浮字` | `text_display` 的 `text` 是 **组件 NBT**（1.21.11 的 `readAdditionalSaveData` 用 `ValueInput.read(\"text\", ComponentSerialization.CODEC)`），不是 JSON 字符串。写 `putString` 塞 JSON 会被 codec 当成纯文本组件、把整串 JSON 原样显示（`data get … text` 返回带引号的字符串）；1.21.1 的 `Component.Serializer.fromJson` 路径已不存在。宿主先用 `§` 解析器拼样式，再用 `ComponentSerialization.CODEC.encodeStart(NbtOps.INSTANCE, …)` 得到 `Tag` 后 `put(\"text\", …)`；`brightness` / `transformation` / `billboard` 走 codec，解析失败只记日志不影响实体创建。实体带 `nebula_fx` 标签，宿主每秒扫一次「带标签但不在活动列表」的残留并 discard，开服再扫一遍已加载区块——区块卸载 / 崩服留下的飘字不会永久留在存档里。**平滑要靠 `teleport_duration`（= Java 常量 `TAG_POS_ROT_INTERPOLATION_DURATION`）**：默认 0 时客户端每收到一次位置包就 `applyTargetPosAndRot` + `setOldPosAndRot`，逐 tick 改位置会变成 20 Hz 硬跳；给 2 tick 后走 `lerpPositionAndRotationStep`，渲染按帧过渡 |\n\n> 原先的 7 个占位已消除 6 个：tick 四方法改走 1.20.3 起就有的原生 `/tick`（不需要 Mixin），\n> `设置区块半径` / `重发区块` 改走 `ClientboundSetChunkCacheRadiusPacket` /\n> `ClientboundLevelChunkWithLightPacket` 两个原生封包。**目前只剩 `打开背包` 一个占位。**\n\n### 1.21.11 真机实测结论\n\n隔离服（独立端口 / RCON，不碰线上 world）跑全量查询与代表性动作后的结论：\n\n| 结论 | 说明 |\n| --- | --- |\n| 公开 API 直调 | `取种子` / `取协议版本` / `取时间` / `取服务器版本` 直接读 `ServerLevel#getSeed()` / `SharedConstants.getCurrentVersion().protocolVersion()` / `Level#getDayTime()` / `MinecraftServer#getServerVersion()`，不再按名字反射 |\n| tick 统计有效 | `取TPS` / `取MSPT` / `取服务器tick` 由 `ServerTickEvent.Pre/Post` 滑窗算出 |\n| 动作确实落地 | `设方块`、`设生物群系`、`设时间`、`设难度`、`设游戏规则`、`设复活点`、`生成生物` / `生成实体`、`设环境变量`、`保存世界`、`注册指令` 都能读回或用原版命令反查 |\n| 区块未加载 → 查询为空 | 方块类查询先用 `level.isLoaded` 判一次，未加载返回空串 / `{}` / `[]`。`/forceload add 0 0` 之后 `区块已加载=是`，四类方块查询立刻恢复。词库应先 `$世界.区块已加载$` 或用 `/forceload` |\n| 规则名按 id 匹配 | 静态常量字段名不稳定，按 `GameRules.Key#getId()` 匹配才能覆盖 `doDaylightCycle` 这类规则 |\n| 实体列表要设上限 | 默认最多 512 个实体；`取实体列表 维度 1` 只返回 1 条。整表可能数百字符，而 `say` 有 256 字符上限，长结果必须分批输出或传 `上限` |\n| 玩家类动作必须用名字 | `give <uuid>` / `experience set <uuid>` 会报「Only players may be affected…」；`tp` 接受实体所以 UUID 能用，但只允许玩家的命令会拒绝 UUID 字面量。宿主统一用 `GameProfile.name()`；**不能取实体的 `getName()`**，它会被 `设置名牌` 改成显示名 |\n| 玩家在线场景全通 | mineflayer 假玩家进服后，11 个玩家查询全部返回真实数据；给 / 扣物品、背包槽位、副手、等级 / 经验、饥饿 / 饱和度、飞行 / 能力、名牌、标签、传送、侧边栏等经读回或 NBT 反查生效 |\n| 命令失败现在可见 | 动作命令走 Brigadier `parse + execute`（`performPrefixedCommand` 返回 `void` 且吞异常）。真正的 `CommandSyntaxException` 会打 WARN；「状态没变 / 粒子无人可见 / objective 不存在」统一过滤 |\n| 占位只剩 `打开背包` | `/tick` 四方法、`设置区块半径`（`ClientboundSetChunkCacheRadiusPacket`）、`重发区块`（`ClientboundLevelChunkWithLightPacket`）均已原生落地，不需 Mixin；`打开背包` 是客户端本地界面，服务端不接管 |\n| 动作效果反查全通 | 12 项原版反查全部 PASS：方块状态 `[axis=x]`、方块数据、填充区域、下界跨维度 `execute in`、生成生物、难度 / 时间 / 效果 / 模式 / 侧边栏 |\n| 通用事件桥 | 清单来自 `neoforge-21.11.42-universal.jar`，267 个事件类按订阅动态注册；双假玩家进服触发 `EntityJoinLevelEvent` |\n| 一键回归 | `python NebulaLoadMod/selftest/regress.py`：隔离服 + 双假玩家 + 原版命令反查 + 悬浮字 / 治疗 / 残留清理 + RCON `stop`，**28/28 PASS、0 告警** |\n| 手工复现 | 无玩家场景用 `[f]初始化` 跑查询与读回；玩家场景用 mineflayer 假玩家执行 `/自检` 触发 `[指令]` 词条；动作效果用原版 `execute if …` / `data get entity …` 反查 |\n\n词库层的两个坑（不属于 API 映射，但调用时会踩）：\n\n- `%时间%` 是引擎内置的 `Value::Time`（本地时间），`%版本%` 是引擎版本字符串；词库里给同名变量赋值会被系统变量遮蔽，应改用带前缀的名字（如 `%SC时刻%`）。\n- 动作是**延迟执行**的：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是旧值，要到下一次事件 / 重编译 才能读到结果。\n\n### 维护流程：新增 / 删除一个 `世界` 方法\n\n因为本文被编进单测，改方法不是「改完文档再补代码」，而是一次动 4 处，缺一处测试就会红：\n\n1. **本文第 1~6 节的映射表**：增删一行，方法名写在第一列反引号内（`/`、`,`、`，` 分隔的别名会被算成多个方法）。方法名里不要带空格、`[` 或 `$`，这些会被解析器跳过。\n2. **规格 JSON**：`NebulaLoadMod/src/main/resources/nebula/world-specs.json` 的 `methods` 加一条，写 `name` / `query` / `fallback` 与 `fields`（`key` / `at` / `kind` / 可选 `default`）；`kind` 取 `Str` / `Int` / `Float` / `Bool` / `Text` / `Player`。**Rust 侧不用改，也不用重编 dll**。\n3. **宿主分支**：查询加到 `NebulaLoadMod/.../McApi.java`，动作加到 `McActions.java`（少数入口在 `NebulaMod.java`）；`op` 名必须与方法名一致。\n4. **跑测试与重建 jar**：`cargo test --offline --lib` 锁住文档 ↔ 函数（`every_mapped_mc_method_has_a_function`）、规格 JSON ↔ 宿主 switch（`every_method_has_a_host_handler`）、参数位次与尾参默认值；再用 `-SkipRust` 重建 jar 让新 JSON 进到 `nebula/world-specs.json`，`regress.py` 会比对它与源码哈希。\n\n解析器的边界要记住：只从 `## 1. 方块` 开始读表格，遇到 `## 7.` 停止；只认以 `|` 开头的行，取第一列反引号里的内容；映射区里遇到事件表标题行后就不再收集（那里是事件名，不是方法）。所以**说明性文字一律写在第 0 节**，别塞进映射表格，否则会被误当成新方法。第 0 节里可以放心解释规则——`in_mapping_table` 为真之后才识别事件表标记，说明文字不会误触发。\n改降级 / 实测结论、补真机验证记录不影响解析，但改完记得跑一次测试。\n\n## 1. 方块\n\n| `世界` 方法 | 参数 | NeoForge / Minecraft API | 状态 |\n| --- | --- | --- | --- |\n| `取方块` | 维度 X Y Z | `ServerLevel#getBlockState(BlockPos)` → `BuiltInRegistries.BLOCK.getKey` | 确认 |\n| `取方块数据` | 维度 X Y Z | `BlockState#toString()`（含属性文本） | 确认 |\n| `获取方块` | 维度 X Y Z | 方块对象：`名称` / `数据` / `标签` / `生物群系` | 确认 |\n| `取相邻方块` | 方块数据 / 维度 X Y Z [预算] | 26 邻域 `BlockPos.offset` + `getBlockState`，跳过空气，`ServerLevel#isLoaded` 防加载区块 | 确认 |\n| `取方块标签` | 维度 X Y Z | `BlockState#getTags()` → `TagKey#location` | 待版本确认 |\n| `设方块` | 维度 X Y Z 方块名 | 原版 `setblock` 命令（Brigadier `parse + execute`） | 确认 |\n| `设方块状态` | 维度 X Y Z 名称 [状态] | `BlockStateParser` 解析 `名称[属性=值]` 后 `setBlock` | 待版本确认 |\n| `设方块数据` | 维度 X Y Z 数据文本 | 同上，整段 `BlockState` 文本解析 | 待版本确认 |\n| `破坏方块` | 维度 X Y Z | `ServerLevel#destroyBlock(BlockPos, drop)` | 确认 |\n| `取生物群系` | 维度 X Y Z | `ServerLevel#getBiome(BlockPos)` → `Biome` 注册名 | 确认 |\n| `设生物群系` | 维度 X1 Z1 X2 Z2 群系 | `ServerLevel#getChunk` + 区块 biome 写入 | 待版本确认 |\n| `填充区域` | 维度 X1 Y1 Z1 X2 Y2 Z2 方块 | 循环 `ServerLevel#setBlock`，限制格数与 `scan_budget` | 确认 |\n\n## 2. 坐标\n\n| `世界` 方法 | 参数 | API | 状态 |\n| --- | --- | --- | --- |\n| `取玩家坐标` | 玩家 | `ServerPlayer#getX/getY/getZ` | 确认 |\n| `取复活 stries.MOB_EFFECT` + `addEffect` / `removeEffect(MobEffectInstance)` | 待版本确认 |\n| `设置能力` | 玩家 能力 是\\|否 | `Abilities` 字段反射写入 + `onUpdateAbilities` | 已落地 |\n| `设置飞行` / `设置无敌` / `设置隐身` | 玩家 是\\|否 | `mayfly/flying/invulnerable` / `setInvisible` | 已落地 |\n| `设置名牌` / `设置名牌可见` | 玩家 文本/是\\|否 | `setCustomName` / `setCustomNameVisible` | 确认 |\n| `玩家加标签` / `玩家移除标签` / `玩家有标签` | 玩家 标签 | `Entity#addTag` / `removeTag` / `getTags` | 确认 |\n| `设置玩家出生点` | 玩家 维度 X Y Z | `ServerPlayer#setRespawnPosition` | 待版本确认 |\n| `设置区块半径` | 玩家 数值 | `ClientboundSetChunkCacheRadiusPacket(int)` | 已落地（封包） |\n| `重发区块` | 玩家 [半径] | `ClientboundLevelChunkWithLightPacket` 重发附近已加载区块，半径 0~2 | 已落地（封包） |\n| `打开背包` | 玩家 | 客户端本地 `InventoryScreen`，服务端不接管；用 `创建界面` + `打开界面` 替代 | 唯一占位 |\n| `播放动作` | 玩家 动作 | `ClientboundAnimatePacket` | 待版本确认 |\n| `骑乘` / `取消骑乘` | 玩家 实体id | `startRiding` / `stopRiding` | 确认 |\n| `攻击` / `交互` | 玩家 实体id | `ServerPlayer#attack` / `interactOn` | 待版本确认 |\n\n## 4. 世界 / 服务器\n\n| `世界` 方法 | 参数 | API | 状态 |\n| --- | --- | --- | --- |\n| `取时间` / `设时间` | [时刻] | `ServerLevel#getDayTime` / `setDayTime` | 确认 |\n| `设天气` / `更新天气` | 天气 / 持续秒数 | `weather` 命令 | 已落地（命令） |\n| `取难度` / `设难度` | [难度] | `ServerLevel#getDifficulty` / `MinecraftServer#setDifficulty` | 确认 |\n| `取种子` | — | `ServerLevel#getSeed()` | 确认（1.21.11 实测） |\n| `取游戏规则` / `设游戏规则` | 名称 [值] | `MinecraftServer#getGameRules()` + 规则键映射 | 待版本确认 |\n| `保存世界` | — | `MinecraftServer#saveEverything` / 区块保存 | 待版本确认 |\n| `取睡眠状态` | — | `ServerLevel` 睡眠状态 API | 待版本确认 |\n| `区块已加载` | 维度 区块X 区块Z | `ServerLevel#isLoaded` / `getChunkSource` | 确认 |\n| `取TPS` / `取MSPT` | — | `MinecraftServer#getAverageTickTime` + 桥接层滑动窗口 | 待版本确认 |\n| `取服务器tick` | — | `MinecraftServer#getTickCount()` | 确认 |\n| `取协议版本` / `取服务器版本` | — | `SharedConstants.getCurrentVersion().protocolVersion()` / `MinecraftServer#getServerVersion()` | 确认（1.21.11 实测） |\n| `取环境变量` / `设环境变量` | 名称 [值] | `System#getenv`；设置只影响桥接层自己的调度 | 确认 |\n| `取本地时间` | — | `LocalDateTime.now()` | 确认 |\n| `设置tick冻结` / `步进tick` / 整套「追货 / 溜达」决策：`附近掉落物` → 逐个 `可达` 选目标 → 1.6 格内收 / 否则 `寻路`；一颗都不行就按 `溜达` 概率随机走一步。返回 `无` 表示没目标 | 已落地（0.2.6） |\n| `注册生物` | 品种 | 返回 `Value::Class` 生物对象；后续用对象方法 `设` / `外观` / `加物品` / `生效` / `卸载` / `列表`，字段读取写 `%怪.键%`；`生效` 提交后由宿主派生物品与资源包条目 | 已落地（0.4.0） |\n| `注册物品` | 物品id（可省 `nebula:`） | 返回 `Value::Class` 物品对象。id 不含冒号时自动补 `nebula:`，写 `star_sword` 与 `nebula:star_sword` 等价。只建空白对象，字段由词库填：`$剑.载入 %配置文本%$`（词库用 `$读文件$` 读进来）或 `$剑.设 键 值$`。要接住对象必须写在 `[函数]` 里（初始化帧赋值不落地） | 已落地（0.4.0） |\n| `取物品列表` | — | 已注册物品的展示名串（`星云剑 · 星云苹果`），供插件直接打印菜单 | 已落地（0.4.0） |\n| `刷怪蛋生成` | 玩家 类型 [标记] | 原版 `SpawnEggItem#useOn` 的落点算法：眼睛射线 → 无碰撞就地 / 有碰撞外移一格 / 顶面 invertY / 液体就地 → `EntityType#spawn(…SPAWN_ITEM_USE…)`；`类型` 也接受品种 id（走槽位池）；主副手都认，只有真生成出来才扣 1 颗物品，返回生成数量（0 = 没放出） | 已落地（0.3.0 / 0.4.0 扩品种） |\n\n## 6. 交互 / 事件\n\n| `世界` 方法 | 参数 | API | 状态 |\n| --- | --- | --- | --- |\n| `提示` | 玩家 文本 | `ServerPlayer#sendSystemMessage(Component)` | 确认 |\n| `广播` | 文本 | `PlayerList#broadcastSystemMessage(Component, false)` | 确认 |\n| `执行命令` | 命令 | `MinecraftServer#getCommands().performPrefixedCommand(...)` | 确认 |\n| `取消事件` | — | 桥接层本次事件槽位 → `event.setCanceled(true)`（通用事件桥里对实现 `ICancellableEvent` 的事件同样生效） | 确认 |\n\n> 事件源不止上表：宿主内置 6 个中文事件、通用事件桥按订阅对接 `nebula/events.json`\n> 里的 267 个 NeoForge 事件类（`EventBridge` + `eventTriggers(handle)`）。清单由\n> `NebulaLoadMod/tools/gen_events.py` 生成并打进 jar，升级 NeoForge 要重新生成 + 全量构建。\n> `世界` 方法数量的单测只锁本契约表，不锁事件清单。\n\n## 6.1 指令 / 界面 / 物品\n\n宿主新增的 `世界` 方法（`interface` 前缀的方法由宿主转成事件回传，词库不直接读 Java API）：\n\n| `世界` 方法 | 参数 | 实现 | 状态 |\n| --- | --- | --- | --- |\n| `取物品数` | 玩家 物品 | 遍历 `Inventory#items / armor / offhand` 的 `ItemStack#getCount`，返回总数 | 确认 |\n| `注册指令` | 规范名 [权限] 别名… | `CommandDispatcher#register`；重复注册按插件 + 规范名幂等，权限变化拆旧节点重注册 | 确认 |\n| `注销指令` | 规范名 别名… | 从根节点 children 按名字移除，只删该插件自己的入口。**插件通常不需要调用**：加载器在重新 load / unload 时按批次 + 归属自动注销；保留给运行期动态摘单个入口的场景 | 确认 |\n| `创建界面` | 玩家 [行数] 标题… | 返回界面对象 id；同时发 `清空界面` 动作建好容器，Rust 侧记录归属插件 / 玩家 / 标题 | 确认 |\n| `界面物品` | 面 槽位 物品 数量 名称 说明 [发光] | 校验对象归属后转成 `设界面物品` 动作（`ItemStack` + `CUSTOM_NAME / LORE / ENCHANTMENT_GLINT_OVERRIDE`） | 确认 |\n| `界面数据` | 面 数据… | 校验对象归属后转成 `设界面数据` 动作 | 确认 |\n| `打开界面` | 面 回调 | 存下函数值闭包，发 `开界面` 动作（带 `界面ID`）；同一玩家的旧界面对象自动失效 | 确认 |\n| `点击消息` | 玩家 段JSON | 一行可点击聊天：段是 `[{文,命令,悬停}]`，宿主给每段挂 `ClickEvent.RunCommand`；点击即以玩家身份执行命令 | 确认（1.21.11 实测） |\n| `输入界面` | 玩家 标题 回调 | 铁砧命名框当文本框：存函数值闭包，发 `输入界面` 动作（带 `界面ID`）；输入框初始为空，点成品格时 `clickGui` 回传 `{玩家名,文本,动作}`，其它槽位只读 | 确认（1.21.11 实测） |\n| `弹窗输入` | 玩家 标题 提示 标签 最长 提交指令 [退出指令] | 1.21.6+ 原版 dialog：`ClientboundShowDialogPacket(Holder.direct(...))`，一个 `minecraft:text` 输入框 + `dynamic/run_command` 模板 `<提交指令> $(pw)`；点提交由客户端发出 `<提交指令> <输入值>`，无需数据包 / `/reload`。省略 `退出指令`（默认空）用单按钮 `NoticeDialog`；给了就改用 `MultiActionDialog`，左侧「退出服务器」执行该指令、右侧「提交」，`columns=2` 排一行。原版宏模板必须含 `$(变量)`，退出指令不含 `$(` 时宿主补 ` $(pw)`，实际发出 `<退出指令> <输入值>` | 1.21.11 落地 |\n| `关闭界面` | 面 | 发 `关界面` 动作并释放闭包 | 确认 |\n| `标题` | 玩家 主标题 [副标题] | `ClientboundSetTitlesAnimationPacket` + `SetTitleTextPacket` + `SetSubtitleTextPacket` | 确认 |\n| `音效` | 玩家 音效 [音量] [音调] | `ServerPlayer#playNotifySound(SoundEvent, SoundSource, float, float)` | 确认 |\n| `给物品` | 玩家 物品 [数量] | 依次尝试：注册表（物品 id 或标记）→ 生物的刷怪蛋定义 → 裸原版物品；构造出带组件的 `ItemStack` 后 `Inventory#add` 分批，塞不下 `Player#drop` | 确认 |\n| `扣物品` | 玩家 物品 [数量] | 遍历背包 / 副手 / 盔甲扣减，不足时能扣多少扣多少 | 确认 |\n\n指令与点击事件：\n\n| 事件 | payload 字段 | 触发方式 | 状态 |\n| --- | --- | --- | --- |\n| `[指令]商店\\|shop` | `玩家 / 玩家名 / 指令 / 参数 / 管理员` | 指令执行时按规范名匹配 `dic_funcs[\"指令\"]` 的别名列表，只跑命中词条（`dispatchCommand`） | 确认 |\n| 界面对象点击闭包 | `玩家 / 玩家名 / 界面 / 槽位 / 动作 / 按钮 / 区域 / 物品 / 数量 / 数据` 组成 JSON，作为闭包的 `%参数1%` | `NebulaMenu#clicked` 拦截点击后 `clickGui(handle, 界面ID, payload)`，Rust 直接调该对象保存的函数值；不移动任何物品 | 确认 |\n\n## 7. 明确缺口\n\n| 能力 | 现状 | 建议 |\n| --- | --- | --- |\n| 物品栏点击事件 | 已用自定义 `ChestMenu#clicked` 拦截，按界面对象 id 调点击闭包；只覆盖词库打开的箱子界面，原版容器 / 玩家背包界面不接管 | 需要监听任意容器时再考虑 Mixin `AbstractContainerMenu#clicked` |\n| tick 冻结 / 步进 / 加速 | 1.20.3 起有原生 `/tick`，1.21.11 已用命令 + `ServerTickRateManager` 落地；真机验证 frozen / rate 40 / unfreeze 都生效 | 无需 Mixin |\n| 客户端本地背包界面 | 只有 `打开背包` 仍是占位（服务端不管理 `InventoryScreen`）；`设置区块半径` / `重发区块` 已用原生封包落地 | 用 `创建界面` + `打开界面` 打开箱子界面 |\n| 客户端侧动作（粒子 / 标题 / 音效）执行端 | 服务端发命令 / 发包 | 统一走服务端，不需要客户端 mod |\n| SNBT 实体生成 | 原版 SNBT 解析器不公开；改为 `summon 类型 坐标 [NBT]`，NBT 不含空格 | 需要完整 SNBT 时再引入内部解析器 |\n| 动态枚举类 API（游戏规则 / 属性注册表 / 事件 getter） | 需要遍历注册表或按字段名派生，仍走反射；种子 / 协议号 / 时间 / FoodData / 实体交互已改直调公开 API | 升级 MC 版本后跑一次查询冒烟 |\n| 睡眠状态 / 侧边栏分数行 | 睡眠状态按反射结果返回是否；侧边栏只显示标题 | 需要分数行时扩展 `设置侧边栏` 的参数 |\n"}, "choice": {"file": "platform-choice.md", "title": "平台取舍（归档）", "group": "设计与实现", "text": "# NeoForge 与 Paper 的取舍\n\n> 归档说明：Paper / Spigot 备选分支（原 `javamc/paper/`，含插件元信息与 Bukkit 事件映射）已于 2026-11-06 移除。本文保留当时的取舍论证与对比表，供日后重新评估参考；Bukkit 侧映射文档不再保留。\n\n## 1. 结论\n\n- **NeoForge 作为主方案**：与 Minecraft 服务端同进程，能拿到完整服务端对象（`MinecraftServer` / `ServerLevel` / `ServerPlayer` / `BlockState`），不依赖 Bukkit 抽象层。\n- **Paper / Spigot 曾作为备选分支**：骨架与 Bukkit 映射文档现已删除，不再维护；以下对比保留作历史参考。\n- **共用层**：词库语法、加载规则、生命周期、事件变量命名、Rust 引擎、JNI 契约两端共用，平台差异只落在“事件源 + `世界` 实现”。\n\n## 2. 对比（历史参考）\n\n| 维度 | NeoForge | Paper / Spigot |\n| --- | --- | --- |\n| 接入方式 | mod（`@Mod` + 事件总线） | 插件（`plugin.yml` + 监听器） |\n| API 稳定性 | 跟随 MC 版本，映射随版本变动 | Bukkit API 跨版本较稳定 |\n| 世界对象 | 直接拿 `ServerLevel` / `BlockState` / `Entity` | 经过 `World` / `Block` / `Entity` 包装 |\n| 事件覆盖 | 更接近原生，但部分事件需要 Mixin（如物品栏点击） | Bukkit 事件更“产品化”，覆盖面广 |\n| 部署 | 服务端装 NeoForge + mod jar | 服务端装 Paper + 插件 jar |\n| 客户端 | 服务端专属 mod，客户端不必安装 | 纯服务端插件，客户端不必安装 |\n| 性能 | 少一层包装，适合高频方块/实体操作 | 包装层有额外开销，但通常可接受 |\n| 生态 | 模组生态，需处理与其他 mod 的兼容 | 插件生态，插件间隔离较好 |\n| 构建 | NeoGradle / ModDevGradle，依赖 NeoForge 版本 | Maven / Gradle，依赖 Paper API |\n| 升级成本 | 跟随 MC 大版本，Mojang 映射变动 | 跟随 Paper API，通常更平滑 |\n\n## 3. 为什么以 NeoForge 为主\n\n1. **引擎在同进程**：Rust `cdylib` 通过 JNI 直接拿服务端对象，不需要跨进程 IPC，事件延迟低。\n2. **方块/实体操作完整**：`世界` 的高频原语（26 邻域扫描、批量填充、实体查询）可以直接走 `ServerLevel`，不受 Bukkit 包装限制。\n3. **与基岩版结构同构**：都是“宿主事件总线 → 桥接层 → 词库”，只是宿主不同，词库几乎可以复用。\n4. **服务端 mod 无客户端要求**：词库逻辑全在服务端，客户端不安装 mod 也能进服。\n\n代价：版本耦合更紧、部分事件缺失（如物品栏点击）、需要处理与其他 mod 的 Mixin/事件顺序问题。\n\n## 4. 原 Paper 骨架的处置（历史）\n\n| 现有内容 | 当时处置 | 当时位置（已随分支删除） |\n| --- | --- | --- |\n| `javamc/bridge/README.md` 的 Bukkit 事件/API 映射 | **下沉**为 Paper 分支资料 | `javamc/paper/plugin/API-MAP.md` |\n| 原 Paper 插件元信息 `plugin.yml` | **下沉** | `javamc/paper/plugin/plugin.yml` |\n| `javamc/bridge/`（JNI 契约思路） | **保留并升级**为平台无关的共用桥接层 | `javamc/bridge/README.md` |\n| 原共享示例词库 | **保留共用**，随 NeoForge 专用服存放 | `javamc/server-1.21.11/nebula/示例/` |\n| `javamc/README.md` 的 Paper 架构 | **替换**为 NeoForge 主方案说明 | `javamc/README.md` |\n\n`javamc/paper/` 曾标记为“备选分支 / 暂停实现”，不进入 NeoForge 评审范围；该目录及其中的 `README.md`、`plugin/API-MAP.md`、`plugin/plugin.yml`、`server-1.21.11/README.md` 现已删除。NeoForge 侧的 `世界` 映射以 [`mc-api-map.md`](mc-api-map.md) 为准。\n\n## 5. 落地状态（2026-11-09 校准）\n\n本文是归档记录，下面几条说明「当时的判断后来变成什么样」，实现细节以\n[`neoforge.md`](neoforge.md) 为准。\n\n- 主方案已在 Minecraft 1.21.11 / NeoForge 21.11.42 上跑通：`bridge/` 保持平台无关，\n  `mod` 落地 128 个 `世界` 方法，1.21.11 真机自检与一键回归 28/28 PASS。\n- 第 2 节对比表里「部分事件需要 Mixin（如物品栏点击）」的顾虑已消解：点击由 `GuiManager`\n  的自定义 `ChestMenu#clicked` 拦截，**不需要字节码增强**；只有客户端本地的 `打开背包`\n  仍是占位。\n- 构建没有采用 ModDevGradle / NeoGradle，而是 `build.ps1` 直接 `cargo` + `javac` + `jar`。\n- 若日后重新引入别的宿主，平台差异仍集中在「事件源 + `世界` 实现」，JNI 契约与\n  `bridge/` 不用重写。\n\n## 6. 已确认与待拍板\n\n已确认：\n\n- NeoForge 为唯一主方案，Paper 备选分支已移除。\n- 服务端专属，词库不下发客户端。\n- 共用 Rust 引擎、JNI 桥接、词库加载规则与事件变量命名。\n- 平台差异集中在事件源与 `世界` 实现层（当前只有 NeoForge 一侧宿主）。\n\n待拍板：\n\n- 若未来重新引入 Paper 或其他宿主，是否抽出 `javamc/common` 的 `世界` 语义层（当前不建）。\n"}, "index": {"file": "README.md", "title": "文档索引 · 维护约定", "group": "总览", "text": "# 文档索引（NebulaLoadMod/docs/）\n\n> **写词库插件，从这里开始**：[`plugin-guide.md`](plugin-guide.md) —— 五分钟上手、语法速查、\n> 生命周期钩子、事件变量、`世界` 原语、自注册指令、配置 JSON、界面闭包、完整示例与排错清单。\n>\n> **浏览器入口**：双击 [`index.html`](index.html)（离线单文件，默认打开插件开发指南），\n> 内嵌同目录全部文档，带目录、章节筛选与文档间跳转，不需要联网或起本地服务器。\n> 改完任意 `.md` 要手动同步 [`index.html`](index.html) 里对应段落（搜索同一句话即可定位）——\n> 文档是纯静态页，没有生成脚本。\n\n文档随 mod 工程走：**一份面向插件作者的开发指南 + 三份设计 / 实现文档**。2026-11-09 从\n顶层 `design/` 迁到此处，让文档和它描述的工程待在一起。\n\n| 文档 | 讲什么 | 什么时候看 |\n| --- | --- | --- |\n| [`plugin-guide.md`](plugin-guide.md) | 怎么开发一个 `.n` 插件：目录、语法、钩子、事件、指令、配置、界面、完整示例、排错 | 第一次写插件，或写的时候卡住 |\n| [`neoforge.md`](neoforge.md) | 设计决策 + 实现现状：边界、架构、生命周期、事件桥、线程、构建、决策台账 | 想理解整条链路，或不确定某条设计落地没有、要改 mod |\n| [`mc-api-map.md`](mc-api-map.md) | `世界` 131 个方法的逐项映射、参数规约、降级清单、1.21.11 真机实测结论 | 查 `$世界.…$` 的参数与返回值，或新增 / 删除方法 |\n| [`platform-choice.md`](platform-choice.md) | NeoForge 与 Paper / Spigot 的历史取舍（归档） | 重新评估宿主选型时 |\n\n### API 参考（`apis/`，按 LLSE 体例）\n\n参考 [LegacyScriptEngine API 文档](https://docs.levimc.org/LegacyScriptEngine/zh/apis/) 的组织方式：\n先约定数据类型与描述格式，再按类别分篇，每条 API 都写「用途 → 签名（可选参数 `[]`）→ 参数名:类型\n→ 返回值/类型 → 实现 → 示例 → 提示」。\n\n- [`apis/README.md`](apis/README.md)：数据类型、描述约定、分类导航、调试。\n- [`apis/事件.md`](apis/事件.md)：6 个内置事件 + 通用事件桥的 payload 字段、取消与避坑。\n- 分类手册：[方块](apis/方块.md) · [坐标](apis/坐标.md) · [玩家](apis/玩家.md) ·\n  [世界与服务器](apis/世界与服务器.md) · [实体](apis/实体.md) ·\n  [交互与事件](apis/交互与事件.md) · [指令与界面](apis/指令与界面.md)（共 **131 条**）。\n\n分类手册按 `mc-api-map.md`（契约表）与 `NebulaLoadMod/src/main/resources/nebula/world-specs.json`（规格唯一来源）手工维护，\n增删方法时三处一起改，最后跑 `cargo test --offline --lib` 让单测兜住不一致。\n\n其它入口：[`../README.md`](../README.md)（mod 工程说明）、\n[`../../bridge/README.md`](../../bridge/README.md)（JNI 契约、词库加载规则、调用链）、\n[`../../README.md`](../../README.md)（项目总览）。\n\n> 注意路径：从 `NebulaLoadMod/docs/` 往上两级是仓库根 `javamc/`。\n\n## 建议的阅读顺序\n\n**插件作者**：`plugin-guide.md` 第 0 节五分钟上手 → 第 1/2 节语法与生命周期 → 第 9 节完整可运行示例\n→ 第 10 节排错。之后按需查 `mc-api-map.md` 里某个方法的参数。\n\n**改桥接 / 改 mod**：项目总览 → mod 工程 README → `neoforge.md` 第 1~4 节（边界、生命周期、\n钩子）→ `mc-api-map.md` 第 0 节参数规约。要增删方法看该节末尾的「维护流程」。\n\n两个最容易踩的点：`[f]初始化` **每次编译都跑**（`[f]加载` 只在首次插入时跑）；\n`$世界.…$` 动作**延迟执行**，同一词条里改完立刻查会读到旧值。\n\n## 现成的示例插件\n\n| 插件 | 演示什么 |\n| --- | --- |\n| `示例` | 最小结构、生命周期、聊天事件（`server-1.21.11/nebula/示例/main.n`） |\n| `伤害显示` | 事件 payload、`%对象.字段%`、条件分支、配置开关（[`说明.md`](../../server-1.21.11/nebula/伤害显示/说明.md)） |\n| `连锁砍树` | 多文件拆分、`[函数]` 显式传参、遍历与数值运算 |\n| `泥土商店` | 自注册指令、`%库目录%` 读 JSON、界面对象 + 点击闭包（[`说明.md`](../../server-1.21.11/nebula/泥土商店/说明.md)） |\n| `selftest/wordlib` | `[f]初始化` 读回、批量动作 |\n\n## 事实来源优先级\n\n代码 > 单测 > 文档。三者冲突时以代码为准，并顺手把文档校准回来：\n\n- `bridge/src/lib.rs`：通用转发、生命周期钩子、JNI 契约；方法规格在 `NebulaLoadMod/src/main/resources/nebula/world-specs.json`。\n- `NebulaLoadMod/src/main/java/nebula/neoforge/`：宿主实现（事件 payload 与方法分支）。\n- `server-1.21.11/nebula/*/main.n`：真实可跑的词库写法，指南里的示例都从这些文件核对过。\n- `cargo test --offline --lib`：文档 ↔ 函数、规格 JSON ↔ 宿主、参数位次三层一致性。\n- `python NebulaLoadMod/selftest/regress.py`：1.21.11 真机一键回归（28/28 PASS）；启服前按 jar 内 `META-INF/nebula-build.json` 的源码内容指纹校验（不看 mtime），与 `target/release/nebula_jni.manifest.json` 交叉校验，并读取 dll 内 `build.rs` 烧入的 `NEBULA_SOURCES=` 编译期指纹作为终点证据，`--verify-only` 可秒级检查。用旧 jar 跑出的 PASS 不算数。\n\n## 维护约定\n\n- **HTML 入口（有生成脚本）**：`index.html` 是离线单文件阅读器，内嵌本目录全部 `.md`\n  （`file://` 下 `fetch` 本地 md 会被浏览器拦截，所以只能内嵌）。默认落地页是插件开发指南。\n  **改了任何 `.md` 就跑一次 `python NebulaLoadMod/tools/gen_docs.py` 重建内嵌数据**，\n  它会用 `json.dumps` 生成合法 JSON 并自检解析。\n  > 2026-11-15 修：此前是手工拼接内嵌文本，markdown 里 ```json 代码块的双引号没有转义，\n  > `const DOCS = {…}` 整段是非法 JS，文档站白屏且内容停在「`[f]重载` / `[f]卸载`」时代。\n  > 手工维护没有校验手段，所以脚本加回来了。\n  判断有没有漏：`gen_docs.py` 结尾会打印篇数；`regress.py` 也会按内容指纹把滞后报出来。\n- **随服分发的离线站点**：`build.ps1` 把本目录的 `.md` 和 `index.html` 打进 jar 的 `docs/`，\n  同时写 `docs/version.txt`（内容取自\n  `neoforge.mods.toml` 的 `version`，版本号只有这一个来源，jar 名也从它来）和\n  `docs/.stamp` 内容指纹——版本号本身折进指纹，所以只改版本号也会触发 `_docs` 重建，\n  不会留下一份写着旧版本的站点。开服时\n  `DocsSite.ensure()` 把它们铺到 `<gameDir>/nebula/_docs/`：目录以下划线开头，\n  引擎 `scan_plugins` 直接跳过，不会被当词库编译或执行，纯粹给人用浏览器打开看\n  （自包含单文件，`file://` 双击即可，不需要起服务）。指纹一致就跳过，jar 里的文档\n  变了才整目录重建；手动改 `_docs` 里的文件不会被自动纠正（当成本地改动），想回出厂\n  内容就删掉 `_docs` 或它的 `.stamp`。改完 md 要先同步 `index.html` 再重建 jar，\n  否则随服那份站点里的页面还是旧内容（`regress.py` 会按内容指纹把这种滞后报出来）。\n- **`mc-api-map.md` 是编译期契约**：`bridge/src/lib.rs` 用\n  `include_str!(\"../../NebulaLoadMod/docs/mc-api-map.md\")` 把它读进单测。再挪路径要同步改\n  这行 `include_str!`、各级 README 链接和 Java 注释里的路径，然后跑一次 `cargo test`。\n- 增删 `世界` 方法要同时改 4 处（文档表格 / world-specs.json / 宿主分支 / 测试），步骤写在\n  `mc-api-map.md` 的「维护流程」。\n- 改了词库语法或生命周期语义，`plugin-guide.md` 也要跟着改——它是对外的第一入口，别只更新\n  `neoforge.md`。\n- 设计决策变化记进 `neoforge.md` 第 9 节决策台账；作废的早期设计标成「已废弃」并说明被什么取代。\n- `platform-choice.md` 是归档，描述当时的判断，不随实现更新。\n"}};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip = (s) => String(s).replace(/<[^>]+>/g,'');

function inline(s){
  const codes=[];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ codes.push('<code>'+esc(c)+'</code>'); return '\u0002'+(codes.length-1)+'\u0002'; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u)=> '<a href="'+u+'">'+t+'</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s.replace(/\u0002(\d+)\u0002/g, (m,i)=>codes[+i]);
}
function splitRow(line){
  let s = line.trim().replace(/\\\|/g,'\u0001');
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0,-1);
  return s.split('|').map(c=>c.replace(/\u0001/g,'|').trim());
}
function render(src){
  const lines = src.replace(/\r\n/g,'\n').split('\n');
  let out=[], toc=[], i=0, hn=0;
  while (i < lines.length){
    const line = lines[i];
    if (/^```/.test(line)){
      const lang = line.slice(3).trim();
      let buf=[]; i++;
      while (i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h){
      const lv=h[1].length, id='sec-'+(++hn);
      out.push('<h'+lv+' id="'+id+'">'+inline(h[2].trim())+'</h'+lv+'>');
      toc.push({id, lv, text: strip(inline(h[2].trim()))});
      i++; continue;
    }
    if (line.trim().startsWith('|') && i+1<lines.length && /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i+1])){
      const head = splitRow(line); i+=2;
      const rows=[];
      while (i<lines.length && lines[i].trim().startsWith('|')) rows.push(splitRow(lines[i++]));
      let t='<div class="table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=> t+='<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');
      out.push(t+'</tbody></table></div>');
      continue;
    }
    if (/^>\s?/.test(line)){
      const buf=[];
      while (i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+buf.filter(x=>x.trim()).map(b=>'<p>'+inline(b)+'</p>').join('')+'</blockquote>');
      continue;
    }
    if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){
      const ordered = /^\s*\d+\.\s+/.test(line), items=[];
      while (i<lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))){
        let t = lines[i++].replace(/^\s*(?:[-*]|\d+\.)\s+/,'');
        while (i<lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*(?:[-*]|\d+\.)\s+/.test(lines[i]) && !/^```/.test(lines[i])) t+=' '+lines[i++].trim();
        items.push('<li>'+inline(t)+'</li>');
      }
      const tag = ordered?'ol':'ul';
      out.push('<'+tag+'>'+items.join('')+'</'+tag+'>');
      continue;
    }
    if (/^\s*---+\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if (!line.trim()){ i++; continue; }
    const para=[line]; i++;
    while (i<lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*[-*]\s|\s*\d+\.\s|>|\s*\|)/.test(lines[i])) para.push(lines[i++]);
    out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  return {html: out.join('\n'), toc};
}

function show(key, anchor){
  const doc = DOCS[key] || DOCS[Object.keys(DOCS)[0]];
  const r = render(doc.text);
  $('#content').innerHTML = r.html;
  $('#toc').innerHTML = r.toc.map(t=>'<a class="l'+t.lv+'" href="#'+key+'/'+t.id+'" data-text="'+esc(t.text)+'">'+esc(t.text)+'</a>').join('');
  $('#crumb-doc').textContent = doc.title;
  $('#crumb-file').textContent = doc.file;
  $('#source').href = doc.file;
  document.querySelectorAll('#docs a').forEach(a=> a.classList.toggle('active', a.dataset.key===key));
  function norm(p){
    const parts=[];
    p.split('/').forEach(s=>{ if(!s||s==='.') return; if(s==='..') parts.pop(); else parts.push(s); });
    return parts.join('/');
  }
  const base = doc.file.includes('/') ? doc.file.slice(0, doc.file.lastIndexOf('/')+1) : '';
  document.querySelectorAll('#content a[href]').forEach(a=>{
    const href = a.getAttribute('href');
    if (href.startsWith('#')){
      const label = decodeURIComponent(href.slice(1));
      const heads = [...document.querySelectorAll('#content h1,#content h2,#content h3,#content h4')];
      const target = heads.find(h => strip(h.innerHTML) === label);
      if (target){
        a.onclick = (e)=>{ e.preventDefault(); target.scrollIntoView({behavior:'smooth',block:'start'}); };
        a.title = '跳到 '+label;
      }
      return;
    }
    const hit = Object.keys(DOCS).find(k=>DOCS[k].file===norm(base+href));
    if (hit){ a.href='#'+hit; a.title='跳到 '+DOCS[hit].title; }
    else if (!/^https?:/.test(href)){ a.title='打开本地文件：'+href; }
  });
  filter();
  if (anchor){
    const el = document.getElementById(anchor);
    if (el) requestAnimationFrame(()=> el.scrollIntoView({behavior:'smooth', block:'start'}));
  } else {
    window.scrollTo(0,0);
  }
  document.title = doc.title + ' · 星云 NeoForge 文档';
}
function route(){
  const raw = decodeURIComponent(location.hash.replace(/^#/,''));
  const [key, anchor] = raw.split('/');
  show(DOCS[key] ? key : Object.keys(DOCS)[0], anchor);
}
function filter(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('#toc a').forEach(a=>{
    a.style.display = !q || a.dataset.text.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('#docs a').forEach(a=>{
    a.style.display = !q || a.dataset.text.toLowerCase().includes(q) || DOCS[a.dataset.key].text.toLowerCase().includes(q) ? '' : 'none';
  });
}
const groups=[];
Object.keys(DOCS).forEach(k=>{ if(!groups.includes(DOCS[k].group)) groups.push(DOCS[k].group); });
$('#docs').innerHTML = groups.map(g=>
  '<div class="group-label">'+esc(g)+'</div>'+
  Object.keys(DOCS).filter(k=>DOCS[k].group===g).map(k=>
    '<a href="#'+k+'" data-key="'+k+'" data-text="'+esc(DOCS[k].title+DOCS[k].file)+'">'+esc(DOCS[k].title)+'</a>'
  ).join('')
).join('');
$('#q').addEventListener('input', filter);
window.addEventListener('hashchange', route);
route();
</script>
