[package]
name = "nebula_jni"
version = "0.2.0"
edition = "2021"
publish = false
build = "build.rs"

[build-dependencies]
sha2 = "0.10"

[lib]
name = "nebula_jni"
crate-type = ["cdylib"]

[dependencies]
# jit 特性默认不开启（引擎 crate 是 default = []）。这里显式打开 Cranelift 热点循环
# JIT：词库里的整数 / 浮点算术循环跑够 HOT_LOOP 次后会编译成 native 并缓存复用。
# 需要 rustc 1.96+；离线缓存已有 cranelift 0.136.4 全套依赖。
nebula = { path = "../../../rust-nebula/crates/nebula", features = ["jit"] }
serde_json = "1"
jni = "0.21"

[profile.release]
opt-level = 2
lto = false
strip = true

# 独立工作区：不并入 rust-nebula 根 workspace，避免把宿主依赖带进主构建。
[workspace]
