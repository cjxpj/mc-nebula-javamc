const DOCS = {"guide": {"file": "plugin-guide.md", "title": "词库插件开发指南", "group": "快速开始", "text": "# 词库插件开发指南\n\n> 面向**要写 `.n` 插件的人**。本文不解释桥接层怎么实现，只讲「一个插件从建目录到能跑、能调试」需要知道什么。\n> 当前环境：Minecraft 1.21.11 / NeoForge 21.11.42 / Java 21。\n>\n> **查 API 去 [`apis/README.md`](apis/README.md)**：按 LLSE 体例组织的 128 条方法手册，按类别分篇，\n> 每条都有签名、参数类型、返回值与示例；事件清单在 [`apis/事件.md`](apis/事件.md)。\n> 想了解桥接实现、事件来源与构建方式看 [`neoforge.md`](neoforge.md)；JNI 契约与词库加载规则看\n> [`bridge/README.md`](../../bridge/README.md)。契约表 [`mc-api-map.md`](mc-api-map.md) 面向改桥接的人。\n\n## 0. 五分钟上手\n\n**插件就是一个文件夹**。在专用服的 `<gameDir>/nebula/` 下建一个目录，写两个文件：\n\n```text\n<gameDir>/nebula/我的插件/\n├── main.n\n└── nebula.ini\n```\n\n`main.n`：\n\n```text\n// 行首 // 是注释\n[f]初始化\n问候:§a你好，欢迎来到星云\n\n[f]加载\n我的插件已加载\n\n[事件]玩家聊天\n如果:%消息%==你好\n    $世界.提示 %玩家名% %问候%$\n如果尾\n```\n\n`nebula.ini`（元数据，桥接层**不读取**，只是留档）：\n\n```ini\n名称 = 我的插件\n作者 = me\n地址 =\n版本 = 1.0.0\n描述 = 第一个星云插件\n```\n\n然后进游戏或控制台：\n\n```text\n/nebula load 我的插件       ← 首次加载\n/nebula list                ← 确认已加载\n```\n\n在聊天里发「你好」，会收到私聊提示。改完词库用 `/nebula reload 我的插件` 生效；开发时开\n`/nebula debug 我的插件`，之后**保存文件就会自动重编译**，不用反复敲命令。\n\n> `main.n` 优先作为入口；同目录顶层的其它 `.n` 会自动合并进同一个命名空间，所以大插件可以拆成\n> `界面.n` / `配置.n` / `商品.n`（参考泥土商店）。`_[开头]` 或 `.[开头]` 的目录会被禁用。\n\n## 1. 词条与语法速查\n\n词库是**布局敏感**的：一个词条 = 一行「头」+ 紧随其后的正文行，词条之间用**块外空行**分隔。\n正文行**顶格写**，缩进只用在 `如果` / `否则` / `遍历` / `点击:[函数]` 这些块的**内部**；\n块必须闭合（`如果尾` / `结束`），漏一个整个插件编译失败。\n\n| 写法 | 含义 |\n| --- | --- |\n| `名:值` | 变量赋值。值可以是文本、`%变量%`、`$调用$` 或 `[%a%+%b%]`；赋原样 JSON 用 `名::{...}`（见第 7 节） |\n| 裸文本行 | 输出一行（事件里的输出会被宿主广播 / 回给玩家） |\n| `%名%` | 取变量；`%对象.字段%` 取 JSON 字段，如 `%玩家.名称%`、`%配置.货币%` |\n| `$函数 参数…$` | 调用内置函数 / 自定义函数 / `世界` 方法，**结尾的 `$` 不能漏** |\n| `[%a%+%b%]` | 数值运算（也支持 `-` `*` `/`），如 `总额:[%单%*%量%]` |\n| `// 注释` | 行注释 |\n| `\"带空格的文本\"` | 用双引号包住含空格的实参，如 `\"§7余额：§a%余% 个泥土\"` |\n\n条件与循环（**必须闭合**，否则整个插件编译失败）：\n\n```text\n如果:%消息%==帮助\n    $世界.提示 %玩家名% 用法：/签到$\n否则如果:%消息%==余额\n    ...\n否则\n    ...\n如果尾\n\n遍历:i,件=%表%\n    $世界.界面物品 %面% %件.槽% %件.物品% 1$\n结束\n```\n\n比较符实测可用：`==`、`!=`、`>`、`<`。函数与返回：\n\n```text\n[函数]查余额 玩家 货币\n余:$世界.取物品数 %玩家% %货币%$\n返回 %余%\n\n[指令]商店\n余:$查余额 %玩家名% minecraft:dirt$\n```\n\n- `[函数]名 参数A 参数B` 定义函数，调用写 `$名 值A 值B$`，函数体内用 `%参数A%`。\n- `返回 内容` 产生返回值；裸 `返回` 直接结束且不输出。\n- `[G]名字` 是公开函数（只改可见性，**不是**全局变量），`[f]名字` 是私有 / 生命周期函数。\n- **一行只能写一个 `$调用$`**；赋值行里最多一个。需要串联就拆成多行用中间变量。\n- 常用的内置函数：`$读文件 路径$`、`$JSON判断 文本$`、`$JSON键读 文本 键$`、\n  `$JSON键存 文本 键 值$`、`$去除左右 文本$`、`$文本长度 文本$`、`$数字格式化 数 位数$`、\n  `$引用 函数名$`。\n- JSON 作为实参时**不要带空格**（`{\"货币\":\"minecraft:dirt\"}`），否则会被按空格切参数。\n\n## 2. 生命周期钩子（最容易写错的地方）\n\n| 钩子 | 什么时候跑 | 该放什么 |\n| --- | --- | --- |\n| `[f]初始化`（编译前另有 `@头部` 触发） | **每次编译**：load / loadAll / reload / debug 自动重编译 | 配置默认值、读 JSON、状态初始化、`$世界.注册指令$` |\n| `[f]加载` | 仅 `/nebula load` 与开服 `loadAll`（插件首次插入） | 「插件已就绪」这类只提示一次的文案 |\n| `[f]重载` | 仅 `/nebula reload` | 重载后的读回验证、状态汇报 |\n| `[f]卸载` | 仅 `/nebula unload` | `$世界.注销指令$`、释放资源 |\n| `[f]自检` | 词库侧约定的词条（连锁砍树里有） | 打印插件状态；`/nebula` **没有**对应子命令 |\n\n三个高频误解：\n\n1. **「初始化只跑一次」是错的**。它每次编译都跑，所以注册指令必须幂等（宿主侧已做去重），\n   别在这里累加计数或写一次性副作用。\n2. **reload 不跑「加载」**，所以「已加载」提示放在 `[f]加载` 是对的；想每次 reload 都看到东西，\n   放 `[f]重载`。\n3. **关服不跑「卸载」**：`ServerStoppingEvent` 直接销毁引擎。别指望关服时靠 `[f]卸载` 保存状态；\n   要持久化就写文件。\n\n调试自动重编译只跑 `初始化`，不会跑 `加载` / `重载` / `卸载`。\n\n## 3. 作用域：配置为什么总要传参\n\n这是写多文件插件时最常卡住的一点：\n\n- **事件帧**的父作用域是 `plugin.state`，能读到 `[f]初始化` 里赋的配置变量。\n- **`[函数]` 帧**的父作用域是词库 root，**不继承调用方作用域**——既读不到事件里的 `%玩家%`，\n  也读不到运行时配置。配置、玩家名、选中数据都要**显式传参**。\n\n```text\n[事件]方块破坏\n// 错：函数里读不到 %玩家% 和 %上限%\n结果:$砍伐 %方块%$\n\n// 对：把需要的东西都作为参数传进去\n结果:$砍伐 %方块% %玩家.名称% %上限%$\n```\n\n唯一例外是**闭包**：`点击:[函数] … 结束` 定义的函数值会按值捕获当时的局部变量，\n点击时这些变量还在（见第 7 节）。\n\n## 3.1 尾部参数可以省略\n\n`$世界.xxx …$` 是按位置传实参的。规格表里标记了默认值的**尾部参数**可以不写，\n例如 `$世界.给予物品 Steve minecraft:diamond$` 等价于数量 1，\n`$世界.加效果 Steve minecraft:speed$` 等价于 30 秒 / 1 级。\n**不要省略中间参数**：`$世界.加效果 Steve minecraft:speed 1$` 里的 `1` 会被当成「秒」，\n而不是「等级」。完整清单与默认值见 [`mc-api-map.md`](mc-api-map.md) 第 0 节的\n「可选尾参」表。\n\n## 4. 事件与变量\n\n当前宿主**内置 6 个中文事件**（下表）；另外还有**通用事件桥**，可以直接用 Java 事件类名\n订阅 NeoForge 总线上的其它 267 个事件，见 [`apis/事件.md`](apis/事件.md) 末节。\n\n| 词条 | 触发 | 主要变量 | 可取消 |\n| --- | --- | --- | --- |\n| `[事件]玩家聊天` | 玩家发言 | `%玩家%`（JSON）/ `%玩家名%` / `%消息%` / `%管理员%` / `%潜行%` / `%维度%` / `%x%` `%y%` `%z%` | 是 |\n| `[事件]实体受伤` | 玩家造成伤害后 | `%攻击者%` / `%攻击者名%` / `%实体%` / `%实体名%` / `%伤害%` / `%剩余%` / `%最大血量%` / `%身高%` / `%暴击%` / `%原因%` / `%致死%` | 否（伤害已结算） |\n| `[事件]实体治疗` | 实体回血且未满血 | `%实体%` / `%实体名%` / `%数值%` / `%之前%` / `%剩余%` / `%最大血量%` / `%身高%` / `%原因%` / `%满血%` | 否（回血已发生） |\n| `[事件]方块破坏` | 玩家破坏方块 | `%玩家%`（含 `.手持物品.名称%`）/ `%玩家名%` / `%方块%`（`.名称%` / `.数据%` / `.维度%`）/ `%坐标%` / `%工具%` / `%模式%` / `%维度%` / `%x%` `%y%` `%z%` | 是 |\n| `[事件]玩家进入` | 每次连接成功（含重连） | `%玩家%`（JSON）/ `%玩家名%` / `%管理员%` / `%维度%` | 否 |\n| `[事件]每秒` | 每 20 tick（约 1 秒） | `%服务器tick%` / `%在线人数%` | 否 |\n\n- 玩家、实体、方块这类变量是 **JSON 对象**，用 `%玩家.名称%`、`%方块.名称%` 取字段。\n- 想取消事件：$世界.取消事件$（聊天 / 方块破坏有效）。\n- **事件里的裸文本行会被宿主广播 / 回给玩家**；只想让某个玩家看到，用 `$世界.提示 玩家 文本$`。\n- payload 只含基础类型与 JSON，拿不到 Java 对象；别试图跨线程持有任何东西。\n\n**想接上表之外的事件**，直接写 Java 类名，宿主按订阅动态注册监听器：\n\n```text\n[事件]EntityJoinLevelEvent\n$世界.提示 %entity.name% 欢迎$\n```\n\n字段名来自 Java getter（`getEntity()` → `%entity%`），内置事件仍用中文名。高频 tick 事件\n被节流到每秒一次，加载期事件收不到——规则与完整清单见\n[`apis/事件.md`](apis/事件.md) 的「通用事件桥」一节。改完词库 `/nebula reload <插件>`\n就会刷新订阅表，不用重启服务端。\n\n## 5. 调用 `世界` 原语\n\n语法是 `$世界.方法 参数…$`。\n\n```text\n余:$世界.取物品数 %玩家名% minecraft:dirt$      ← 查询：立即返回结果，可以赋值\n$世界.给物品 %玩家名% minecraft:diamond 3$       ← 动作：排队，dispatch 返回后才落地\n$世界.提示 %玩家名% §a已发放$\n```\n\n**动作是延迟执行的**：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的还是旧值，\n要到下一次事件 / reload 才生效。写成「先查 → 再改 → 立刻回读验证」会得到假失败，验证请换一次\n事件或用宿主的查询接口。\n\n常用方法速查（完整 128 个按类别分篇在 [`apis/`](apis/README.md)）：\n\n| 用途 | 方法 |\n| --- | --- |\n| 私聊 / 动作栏 / 标题 | `提示`、`动作栏`、`标题` |\n| 飘字（RPG 伤害数字 / 全息文字） | `悬浮字` |\n| 音效 / 粒子 | `音效`、`生成粒子` |\n| 物品 | `给物品`、`扣物品`、`取物品数`、`取背包物品`、`设背包物品` |\n| 玩家 | `取玩家状态`、`取玩家列表`、`传送玩家`、`设置模式`、`加效果`、`玩家加标签` |\n| 方块 | `取方块`、`设方块`、`设方块状态`、`填充区域`、`破坏方块`、`取相邻方块` |\n| 世界 | `取时间` / `设时间`、`设难度`、`设游戏规则`、`执行命令`、`广播` |\n| 指令 / 界面 | `注册指令`、`注销指令`、`创建界面`、`界面物品`、`打开界面`、`关闭界面` |\n\n几个真机踩过的坑：\n\n- **玩家目标用名字**：`give` / `experience` / `effect` 这类命令会拒绝 UUID 字面量，\n  统一用 `%玩家名%` 或 `%玩家.名称%`，别传 `%玩家.uuid%`。\n- **`$世界.执行命令 say …$` 有 256 字符上限**：`取实体列表` 这类长结果要么传 `上限`，要么分批。\n- **未加载区块的方块查询返回空**：先 `$世界.区块已加载$` 判断，或让管理员 `/forceload add`。\n- `%时间%` / `%版本%` 是引擎内置变量，词库里同名赋值会被遮蔽，变量名加前缀（如 `%SC时刻%`）。\n\n## 6. 插件指令\n\n指令由**词库自己注册**，不写进 `nebula.ini`：\n\n```text\n[f]初始化\n$世界.注册指令 签到 0 sign$\n\n[f]卸载\n$世界.注销指令 签到 sign$\n\n[指令]签到|sign\n参:$去除左右 %参数%$\n如果:%参%==帮助\n    $世界.提示 %玩家名% \"§7/签到 领一份见面礼\"$\n    返回\n如果尾\n```\n\n- `注册指令 规范名 [权限 0~4] 别名…`；规范名决定 `%指令%` 的值（用 `/sign` 进来也是「签到」）。\n- `[指令]规范名|别名1|别名2` 头里列出所有入口，宿主按规范名匹配后**只跑命中的那一条**；\n  没有 `[指令]` 词条时返回 `ok=false`，不会回退到统一事件。\n- 指令词条里可用变量：`%玩家%` / `%玩家名%` / `%指令%`（规范名）/ `%参数%`（玩家输入的整串）/ `%管理员%`。\n- 重复注册是幂等的，但**改名 / 删名后的旧入口要重启服务端才消失**（新词库的 `[f]卸载` 不知道旧名字）。\n- 执行结果的输出行会回给执行者；控制台执行也一样。\n\n## 7. 配置与数据文件\n\n配置文件放插件同目录，用 `%库目录%` 定位（编译时由桥接层注入到词库 root，函数帧也能读）：\n\n```text\n[函数]默认配置\n文::{\"货币\":\"minecraft:dirt\",\"货币名\":\"泥土\"}\n%文%\n\n[函数]配置数据\n文:$读文件 %库目录%/配置.json$\n如果:$JSON判断 %文%$!=true\n    文:$默认配置$\n如果尾\n%文%\n\n[f]初始化\n配置:$配置数据$\n```\n\n- `文::{\"a\":1}` 这种**双冒号**写法用来赋一段原样 JSON（单冒号会把内容当表达式）。\n- `$读文件 路径 [默认值]$` 读整份文件；JSON 不要带空格以免被切参数。\n- `$JSON判断$` / `$JSON键读$` / `$JSON键存$` 用来校验、取字段、改字段。\n- `.json` 和 `.n` 一起纳入 debug 指纹，改配置也会自动重载；没开 debug 就 `/nebula reload <插件>`。\n- 文件缺失或非法 JSON 时给内置默认值，别让插件整个起不来。\n\n## 8. 界面与点击闭包\n\n界面是**对象**：`创建界面` 返回 id，后续操作都带这个 id，点击逻辑写成函数值交给 `打开界面`。\n\n```text\n[函数]画菜单 玩家\n面:$世界.创建界面 %玩家% 3 §a我的菜单$\n$世界.界面物品 %面% 11 minecraft:lime_stained_glass_pane 1 \"§a领取\" \"§7点一下\" 是$\n$世界.界面物品 %面% 15 minecraft:barrier 1 \"§c关闭\"$\n点击:[函数]\n    点:%参数1%\n    槽:%点.槽位%\n    如果:%槽%==11\n        $世界.给物品 %玩家% minecraft:bread 4$\n        $世界.提示 %玩家% §a已领取$\n        $世界.关闭界面 %面%$\n        返回\n    如果尾\n    如果:%槽%==15\n        $世界.关闭界面 %面%$\n        返回\n    如果尾\n结束\n$世界.打开界面 %面% %点击%$\n```\n\n- `界面物品 面 槽位 物品 数量 名称 说明 [发光]`；说明里用 `|` 换行。\n- `点击:[函数] … 结束` 是**闭包**，按值捕获定义时的局部变量（`面` / `玩家` / `配置` / `表` 点击时都还在），\n  不用再塞「界面数据」或全局状态表。\n- 宿主点击时把 `玩家名 / 界面 / 槽位 / 按钮 / 动作 / 区域 / 物品 / 数量 / 数据 + 玩家快照`\n  组成 JSON 作为闭包的 `%参数1%`，先 `点:%参数1%` 再用 `%点.槽位%` / `%点.动作%` 取值。\n  常见动作值有 `左键` / `右键`。\n- 界面只读：点击不会拿走物品，也不会动玩家背包。同一玩家只保留最后打开的界面对象，\n  重绘（切页、弹确认框）会顶掉旧的；关窗 / 退出 / 卸载 / 关服都会释放闭包。\n- 按玩家的旧界面方法已移除，界面一律用「对象 + 闭包」。\n\n## 9. 完整可运行示例：签到插件\n\n把下面存成 `<gameDir>/nebula/签到/main.n`，带一个 `nebula.ini`，然后 `/nebula load 签到`：\n\n```text\n// 签到插件：/签到 领面包，背包面包超过 63 个时不再发。\n[f]初始化\n奖励物品:minecraft:bread\n奖励数量:4\n$世界.注册指令 签到 0 sign$\n\n[f]加载\n签到插件已加载\n\n[f]重载\n签到插件已重载\n\n[f]卸载\n$世界.注销指令 签到 sign$\n\n[指令]签到|sign\n余:$世界.取物品数 %玩家名% %奖励物品%$\n如果:%余%>63\n    $世界.提示 %玩家名% \"§7背包里的面包够多了，先吃掉再来吧\"$\n    返回\n如果尾\n$世界.给物品 %玩家名% %奖励物品% %奖励数量%$\n$世界.音效 %玩家名% minecraft:entity.player.levelup$\n$世界.提示 %玩家名% \"§a签到成功 §7· §f面包 ×%奖励数量%\"$\n```\n\n逐行看点：`[f]初始化` 每次编译都跑，所以注册指令写在这里；`[f]加载` 的提示只会在首次插入时出现；\n`[指令]` 头列出规范名和别名；查询 `取物品数` 立即返回值可以赋给 `余`；给物品 / 音效 / 提示是动作，\n排队落地；带空格的文案用引号包住；分支用裸 `返回` 提前结束。\n\n> 这是演示插件，**没有做「每天一次」的持久化**。真要做每日限制，得把领取日期按玩家名存文件：\n> 读取用 `$读文件 %库目录%/记录.json$`，改字段用 `$JSON键存$`，可用的文件写入函数见\n> [`bridge/README.md`](../../bridge/README.md)。\n\n## 10. 调试与排错\n\n```text\n/nebula list                 列出插件及调试开关\n/nebula load <插件|--all>     加载；编译失败时其它插件不受影响\n/nebula reload <插件|--all>   重编译；失败保留旧版本\n/nebula debug <插件|--all>    开启文件指纹监视，保存即重编译\n/nebula undebug <插件|--all>  关闭\n/nebula unload <插件|--all>   卸载（会跑 [f]卸载、释放界面闭包）\n```\n\n插件没反应时按这个顺序查：\n\n1. `/nebula list` 里是否已加载；编译失败的信息在服务端日志 / 控制台。\n2. `$调用$` 的**结尾 `$` 有没有漏**——漏了整行会被当普通文本输出，看起来像「执行了但没效果」。\n3. `如果尾` / `结束` 是否闭合，词条之间是否用了块外空行。\n4. 一行是不是塞了两个 `$调用$`。\n5. 在函数里读事件变量 / 配置 → 忘了显式传参（第 3 节）。\n6. 动作后面立刻查询 → 读到的是旧值（第 5 节）。\n7. 玩家目标传了 UUID 而不是名字（第 5 节）。\n8. 方块查询对未加载区块返回空（第 5 节）。\n9. 指令改名后旧入口还在 → 重启服务端。\n10. 输出行没私聊化 → 被广播出去了，改用 `$世界.提示$`。\n\n`python mod/selftest/regress.py` 是**桥接层**的一键回归（隔离服 + 双假玩家 +\n原版命令反查），不是插件单元测试；插件逻辑还是靠 `/nebula debug` + 游戏内验证。\n\n## 11. 示例插件索引\n\n| 插件 | 演示什么 | 说明 |\n| --- | --- | --- |\n| `示例` | 最小结构、生命周期、聊天事件 | `server-1.21.11/nebula/示例/main.n` |\n| `伤害显示` | 事件 payload、`%对象.字段%`、条件分支、配置开关、`悬浮字` 飘血 | [`说明.md`](../../server-1.21.11/nebula/伤害显示/说明.md) |\n| `连锁砍树` | 多文件拆分、`[函数]` 显式传参、遍历与数值运算 | 同目录 `main.n` / `判定.n` / `砍伐.n` |\n| `泥土商店` | 自注册指令、`%库目录%` 读 JSON、界面对象 + 点击闭包 + 确认弹窗 | [`说明.md`](../../server-1.21.11/nebula/泥土商店/说明.md) |\n| `selftest/wordlib` | `[f]重载` 读回、批量动作 | `mod/selftest/wordlib/main.n` |\n\n建议阅读顺序：`示例` → `伤害显示`（事件）→ `泥土商店`（指令 + 界面）。\n"}, "apiindex": {"file": "apis/README.md", "title": "API 写在前面 · 约定", "group": "API 参考", "text": "# `世界` API 参考 · 写在前面\n\n> 本套文档的体例参考 [LegacyScriptEngine 的 API 文档](https://docs.levimc.org/LegacyScriptEngine/zh/apis/)：\n> 先约定数据类型与描述格式，再按类别分篇，每条 API 用「用途 → 签名 → 参数 → 返回值 → 示例 → 提示」的固定格式。\n> 对应到我们这里，LLSE 的 `mc` / `Player` 那套对象换成了词库的 `$世界.方法 …$` 与 `%变量%`。\n\n## ⛳ 放在前面\n\n星云词库引擎把 Minecraft Java 版服务端的能力封装成 `世界` 注入类，词库里用 `$世界.方法 参数…$` 调用。Java 宿主只做事件转发与动作落地，\n**业务逻辑全部写在 `.n` 词库里**。\n\n还不会写插件？先看 [`plugin-guide.md`](../plugin-guide.md)。这里只查 API。\n\n## 💊 数据类型\n\n词库是弱类型的，所有值最终都是**文本**或 **JSON 文本**。下面这些类型名只出现在 API 文档的参数\n与返回值说明里，用来告诉你该传什么、会拿回什么。\n\n| 文档类型 | 词库里的写法 | 说明 |\n| --- | --- | --- |\n| `String` | 一段文本，如 `minecraft:stone` | 注册名、名字、文本。含空格要加引号 `\"§7余额：%余%\"` |\n| `Integer` | `64`、`3` | 整数（坐标、数量、槽位、等级） |\n| `Float` | `0.6`、`1.5` | 小数（音量、音调、部分数值） |\n| `Boolean` | `是` / `否` | `是 / true / 1 / 开 / 真 / yes / on` 都视为真 |\n| `Text` | 剩余的一串文本 | **吞掉该位次之后的全部实参**，用空格拼接，通常是最后一个参数 |\n| `Object` | JSON 文本，如 `{\"名称\":\"Steve\"}` | 用 `%变量.字段%` 取字段，如 `%玩家.名称%` |\n| `Array` | JSON 数组文本 | 配合 `遍历:i,件=%表%` 使用 |\n| `Function` | `回调:[函数] … 结束` | 函数值；宿主回调时 payload 落在 `%参数1%` |\n| `Null` | 空串 | 查询失败或动作无返回 |\n\n几个常见的**对象型参数**（都是 JSON 或能自动转成的形式）：\n\n- `玩家` — 传玩家名最稳；也可以传 `%玩家%` 这种 JSON 对象（宿主自动取 `名称`）。\n  **别传 `%玩家.uuid%`**：`give` / `effect` 等命令会拒绝 UUID 字面量。\n- `维度` — 注册名，如 `minecraft:overworld` / `minecraft:the_nether`。\n- `实体` — 数字 id / UUID / 名称，宿主统一换成选择器。\n- `面` — `$世界.创建界面$` 返回的界面对象 id。\n- `坐标 / 方块 / 玩家状态 / 实体数据` — 查询返回的 JSON 对象，用 `%变量.字段%` 取字段。\n\n> `%时间%`（本地时间）和 `%版本%`（引擎版本）是**引擎内置系统变量**，词库里给同名变量赋值会被\n> 遮蔽。自己的变量加前缀，如 `%SC时刻%`。\n\n## 📌 API 文档描述约定\n\n后面每一条 API 都按同一个格式写，看一条就会看全部：\n\n**1. 签名**\n\n```text\n$世界.取方块 维度 X Y Z$\n$世界.取实体列表 [维度] [上限]$\n```\n\n参数按**位次**用空格分隔；`[ ]` 框起来的是**可选参数**，省略时用文档里给出的默认值。\n签名里的 `$` 必须成对——**结尾的 `$` 漏掉，整行会被当普通文本输出**。\n\n**2. 参数**\n\n按 `参数名 : 类型` 逐项列出，并写明含义与默认值。`Text` 类型会吞掉后面的全部实参。\n\n**3. 返回值 / 返回值类型**\n\n- **查询类**（`取…` / `获取…` / `玩家有标签` 等）：调用时**立即返回**结果，可以赋值\n  `余:$世界.取物品数 %玩家名% minecraft:dirt$`。\n- **动作类**：返回空串（`Null`），实际效果**排队延后执行**——同一词条里\n  `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是旧值，要到下一次事件 / reload 才生效。\n- 查询失败返回空串 / `{}` / `[]` / `0`（每条 API 会注明），动作失败返回空串并在服务端日志记 WARN。\n\n**4. 实现 / 状态**\n\n给出宿主侧落地方式（原版命令、稳定 API 或反射兜底）与已知降级，便于排查「为什么这个读不到」。\n\n**5. 示例与提示**\n\n示例是真实词库写法；`注意` / `警告` / `提示` 只写会踩坑的点。\n\n## 📜 分类导航\n\n| 分类 | 文档 | 大致对应 LLSE |\n| --- | --- | --- |\n| 方块 | [`方块.md`](方块.md) | GameAPI / Block |\n| 坐标 | [`坐标.md`](坐标.md) | GameAPI / Basic |\n| 玩家 | [`玩家.md`](玩家.md) | GameAPI / Player / Item |\n| 世界与服务器 | [`世界与服务器.md`](世界与服务器.md) | GameAPI / Server / GameUtils |\n| 实体 | [`实体.md`](实体.md) | GameAPI / Entity / Particle |\n| 交互与事件 | [`交互与事件.md`](交互与事件.md) | GameAPI / Command、EventAPI / Listen |\n| 指令与界面 | [`指令与界面.md`](指令与界面.md) | GameAPI / Command、GuiAPI |\n| 事件清单 | [`事件.md`](事件.md) | EventAPI / PlayerEvents 等 |\n\n各分类页与本文一起手写维护（纯静态，无生成脚本），内容以\n[`mc-api-map.md`](../mc-api-map.md)（编译期契约表）和 `bridge/src/lib.rs` 的规格表为准；\n改方法要同时改契约表、规格表与分类页，最后跑 `cargo test --offline --lib` 让单测兜住。\n\n## 📡 调试\n\n```text\n/nebula list                 列出插件及调试状态\n/nebula load|reload <插件>    加载 / 重编译（失败保留旧版本）\n/nebula debug|undebug <插件>  开关文件指纹自动重编译\n/nebula unload <插件>         卸载并释放界面闭包\n```\n\n没有 LLSE 那种 `jsdebug` 交互控制台；验证词库靠 `/nebula debug` + 游戏内触发事件，\n或用 `$世界.执行命令 say …$` 把中间值打出来（注意 256 字符上限）。\n桥接层的一键回归是 `python mod/selftest/regress.py`（隔离服 + 双假玩家 + 原版命令反查）。\n\n## 📎 与契约文档的关系\n\n| 文档 | 面向谁 | 谁维护 |\n| --- | --- | --- |\n| 本套 `apis/` | 写插件的人（怎么用） | 生成器 + 少量手写示例字典 |\n| [`mc-api-map.md`](../mc-api-map.md) | 改桥接的人（有哪些方法、参数位次、宿主分支） | 手工维护，**被 `include_str!` 编进单测** |\n| [`neoforge.md`](../neoforge.md) | 改 mod 的人（设计决策与实现现状） | 手工维护 |\n\n三者冲突时以 `bridge/src/lib.rs` 与 Java 宿主代码为准，并顺手把文档校准回来。\n"}, "events": {"file": "apis/事件.md", "title": "事件清单", "group": "API 参考", "text": "# 事件清单\n\n> 事件系统让插件**响应**游戏里发生的事。宿主把 NeoForge 事件整理成 payload JSON 注入词库变量，\n> 词库用 `[事件]名字` 词条接收。写法与排错见 [`plugin-guide.md`](../plugin-guide.md) 第 4、10 节。\n\n宿主内置 6 个中文事件（下表），另外通过**通用事件桥**把 NeoForge 事件总线上的 267 个\n事件类按订阅对接给词库，见文末「通用事件桥」。\n\n## 事件词条格式\n\n```text\n[事件]玩家聊天\n如果:%消息%==你好\n    $世界.提示 %玩家名% §a你好$\n如果尾\n```\n\n- 头写 `[事件]名字`；正文顶格，缩进只用于 `如果` / `遍历` 块内部，块要闭合。\n- payload 字段注入成 `%变量%`；玩家 / 实体 / 方块这类是 **JSON 对象**，用 `%变量.字段%` 取字段。\n- 事件帧的父作用域是 `plugin.state`，能读到 `[f]初始化` 里赋的配置；但 `[函数]` 帧读不到，\n  需要的变量要显式传参。\n\n## 输出、取消与拦截\n\n- 事件里的**裸文本行会被宿主广播 / 回给玩家**；只想让某个人看到，用\n  `$世界.提示 %玩家名% 文本$`。\n- 想拦截事件用 `$世界.取消事件$`：桥接层把取消标志写在本次事件槽位，宿主在分发结束后统一\n  `setCanceled(true)`。**只有「可取消」列是「是」的事件有效**。\n- payload 只含基础类型与 JSON，不跨线程持有 Minecraft 对象；别指望拿到 Java 对象。\n- 事件异常不会抛到 NeoForge 总线，只记日志并跳过该插件。\n\n## 玩家进入\n\n`[事件]玩家进入` · 来源 `PlayerLoggedInEvent` · **可取消：否**\n\n每次**连接成功**都会触发一次（包括断线重连），不是「首次进服」；首次进服要自己查账号库。\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照：`名称` / `uuid` / `维度` / `x` `y` `z` |\n| `%玩家名%` | `String` | 玩家名，等价 `%玩家.名称%` |\n| `%管理员%` | `String` | `是` / `否` |\n| `%维度%` | `String` | 注册名，如 `minecraft:overworld` |\n\n```text\n[事件]玩家进入\n$世界.提示 %玩家名% \"§7你进服了，UUID %玩家.uuid%\"\n```\n\n> 登录类插件必须在这个事件里**重建会话**：玩家上一局是「已登录」，关服 / 重载 / 重连后\n> 必须重新输密码，否则杀一次进程再进服就能绕过验证。\n\n---\n\n\n---\n\n## 玩家聊天\n\n`[事件]玩家聊天` · 来源 `ServerChatEvent` · **可取消：是**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照：`名称` / `uuid` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` / `模式` / `潜行` / `手持物品.名称` |\n| `%玩家名%` | `String` | 玩家名，等价 `%玩家.名称%` |\n| `%消息%` | `String` | 玩家原始发言文本（`getRawText()`） |\n| `%管理员%` | `String` | `是` / `否`（文本），按 OP 列表判断 |\n| `%潜行%` | `String` | `是` / `否`，是否按住潜行 |\n| `%维度%` | `String` | 注册名，如 `minecraft:overworld` |\n| `%x%` `%y%` `%z%` | `Integer` | 玩家坐标 |\n\n示例：\n\n```text\n[事件]玩家聊天\n如果:%消息%==帮助\n    $世界.提示 %玩家名% \"§e/商店 打开商店\"$\n    $世界.取消事件$\n如果尾\n```\n\n> 注意：取消后这条消息所有人都看不到（相当于被吞掉），确认这是你要的效果。\n\n---\n\n## 实体受伤\n\n`[事件]实体受伤` · 来源 `LivingDamageEvent.Post`（**伤害已结算**）· 可取消：否\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%攻击者%` | `Object` | 攻击者玩家快照：`名称` / `uuid` / `维度` / `x` `y` `z` / `血量` / `最大血量` / `类型` |\n| `%攻击者名%` | `String` | 攻击者名字，等价 `%攻击者.名称%` |\n| `%实体%` | `Object` | 被伤害实体快照：`名称` / `id` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` |\n| `%实体名%` | `String` | 目标名字（生物显示名或玩家名） |\n| `%伤害%` | `Float` | 本次**实际**伤害（护甲 / 附魔 / 格挡已算完） |\n| `%剩余%` | `Float` | 伤害生效后目标血量；死亡为 `0.0` |\n| `%最大血量%` | `Float` | 目标最大血量 |\n| `%身高%` | `Float` | 目标碰撞箱高度（`getBbHeight()`），飘字定位用 |\n| `%暴击%` | `String` | `是` / `否`，按原版 `Player#attack` 的落地暴击条件复算 |\n| `%原因%` | `String` | 伤害类型 id，如 `player_attack` / `arrow` |\n| `%致死%` | `String` | `是` / `否` |\n| `%维度%` `%x%` `%y%` `%z%` | — | 目标所在位置 |\n\n示例：\n\n```text\n[事件]实体受伤\n伤害文:$数字格式化 %伤害% 1$\n如果:%致死%==是\n    $世界.动作栏 %攻击者名% \"§c已击杀 §f%实体名%\"$\n    返回\n如果尾\n$世界.动作栏 %攻击者名% \"§7对 §f%实体名% §7造成 §c%伤害文% §7点伤害\"$\n```\n\n> 注意：**只有玩家造成的伤害会转发**（宿主在分发前就过滤了攻击者类型），怪物互殴 / 摔落 /\n> 岩浆不进词库；玩家自伤也不转发。`%实体.血量%` 与 `%剩余%` 是同一个数。\n\n---\n\n## 实体治疗\n\n`[事件]实体治疗` · 来源 `LivingHealEvent`（**回血写入之前**）· **可取消：否**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%实体%` | `Object` | 回血实体快照：`名称` / `id` / `类型` / `维度` / `x` `y` `z` / `血量` / `最大血量` |\n| `%实体名%` | `String` | 实体名字 |\n| `%数值%` | `Float` | 本次**真实**回复量（已按最大血量截断） |\n| `%之前%` | `Float` | 回血前血量 |\n| `%剩余%` | `Float` | 回血后血量 |\n| `%最大血量%` | `Float` | 最大血量 |\n| `%身高%` | `Float` | 碰撞箱高度，飘字定位用 |\n| `%原因%` | `String` | `自然回复` / `效果` / `其它`（按再生效果、玩家饥饿值粗分） |\n| `%满血%` | `String` | `是` / `否`，这次回复是否把血补满 |\n| `%维度%` `%x%` `%y%` `%z%` | — | 实体所在位置 |\n\n示例（飘一个绿色 +N，满血时什么都不发）：\n\n```text\n[事件]实体治疗\n如果:%原因%==自然回复\n    返回\n如果尾\n回:$数字格式化 %数值% 1$\n飘y:[%y%+%身高%]\n$世界.悬浮字 %维度% %x% %飘y% %z% \"§a+%回%\" 1.0 1.1 22$\n```\n\n> 注意：\n> - **已经满血时宿主不会转发这个事件**——每次 `heal()` 都会被截断到 0，事件根本进不来，\n>   词库不需要再判断一次。\n> - 原版没有「谁治的」信息：自然回血（饥饿 / 饱和度）、生命恢复效果、药水都走同一个\n>   `LivingEntity#heal`，`%原因%` 是宿主按「有没有再生效果 + 是否满饥饿玩家」粗分的。\n>   饱和状态下自然回血是 **每 0.5 秒 +1**，想安静就把 `%原因%==自然回复` 的那一批过滤掉。\n\n---\n\n## 方块破坏\n\n`[事件]方块破坏` · 来源 `BlockEvent.BreakEvent` · **可取消：是**\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%玩家%` | `Object` | 玩家快照，含 `名称` / `uuid` / `模式` / `潜行` / `手持物品.名称` 等 |\n| `%玩家名%` | `String` | 玩家名 |\n| `%方块%` | `Object` | 方块快照：`名称`（注册名）/ `数据`（BlockState 文本）/ `维度` / `x` `y` `z` / `坐标` |\n| `%坐标%` | `Object` | `x` / `y` / `z` 的坐标对象 |\n| `%工具%` | `String` | 手持物品名称 |\n| `%模式%` | `String` | 游戏模式（中文标签） |\n| `%管理员%` `%潜行%` | `String` | `是` / `否` |\n| `%维度%` | `String` | 注册名 |\n| `%x%` `%y%` `%z%` | `Integer` | 方块坐标 |\n\n示例（连锁砍树用的就是这些字段）：\n\n```text\n[事件]方块破坏\n树种:$取树种 %方块.名称%$\n如果:$文本长度 %树种%$==0\n    返回\n如果尾\n$世界.提示 %玩家.名称% \"§7砍到 §f%方块.名称%\"$\n```\n\n> 注意：`%方块.名称%` 是注册名（如 `minecraft:oak_log`），不是显示名。\n\n---\n\n## 每秒\n\n`[事件]每秒` · 来源 `ServerTickEvent.Post`（每 20 tick 一次）· **可取消：否**\n\n给「没有平台事件」的逻辑用：登录倒计时、超时踢人、定时检查。没有插件写 `[事件]每秒` 时\n这一次分发只是空转，开销可以忽略。\n\n| 变量 | 类型 | 说明 |\n| --- | --- | --- |\n| `%服务器tick%` | `Integer` | 服务器启动以来的 tick 数（`Long`，约 20/秒） |\n| `%在线人数%` | `Integer` | 当前在线玩家数 |\n\n示例（维护一个 300 秒未登录就踢出的倒计时，节选自 `server-1.21.11/nebula/登录/main.n`）：\n\n```text\n[事件]每秒\n表:$世界.取玩家列表$\n遍历:i,人=%表%\n    名:%人.名称%\n    剩:[%会话.截止%-%今%]\n    如果:%剩%<=0\n        $世界.踢出玩家 %名% \"§c验证超时\"$\n    如果尾\n结束\n```\n\n> - 一秒钟只跑一次，**不是**每 tick；按 20 tick 计数，TPS 掉到 10 时它就是 2 秒一次。\n> - 需要「严格按墙钟计时」就用 `$当前时间戳$` 存截止时间再比较，别累加计数器。\n> - 这个事件每秒都会进词库，别在这里做全量文件扫描或长 IO。\n\n---\n\n## 指令与界面事件\n\n除了上面 5 个 NeoForge 事件，还有两类**宿主主动分发**的入口，写法见\n[`指令与界面.md`](指令与界面.md) 与 [`plugin-guide.md`](../plugin-guide.md) 第 6、8 节：\n\n| 入口 | 触发 | 主要变量 |\n| --- | --- | --- |\n| `[指令]规范名\\|别名` | 玩家 / 控制台执行插件自注册的指令 | `%玩家%` / `%玩家名%` / `%指令%` / `%参数%` / `%管理员%` |\n| 界面点击闭包 | 玩家点击词库打开的箱子界面 | payload JSON 落在闭包的 `%参数1%`：`槽位` / `动作` / `按钮` / `物品` / `数量` / `区域` 等 |\n\n## 避开误区\n\n- **动作延迟执行**：事件里 `$世界.设方块 …$` 后立刻 `$世界.取方块 …$` 读到旧值。要验证就换一次\n  事件触发，或用宿主的查询接口。\n- 别在高频事件里做长 IO 或全量词库扫描；词库事件是同步跑在服务端主线程的。\n- 别在事件里用 `$世界.执行命令 say …$` 拼超长文本（chat 上限 256 字符）。\n- 玩家目标统一用**名字**，不要用 UUID（`give` / `effect` 会拒绝 UUID 字面量）。\n- 事件输出行会广播，私聊务必用 `$世界.提示$`。\n\n## 通用事件桥（NeoForge 全量事件）\n\n除了上面的内置中文事件，宿主还能把 **NeoForge 事件总线上的任意事件类**直接对接给词库。\njar 内的 `nebula/events.json` 是构建期从 `neoforge-21.11.42-universal.jar` 抽取的清单\n（当前 267 个事件类，含 `Pre` / `Post` 等内部类），由 `mod/tools/gen_events.py` 生成。\n\n词条头直接写 **Java 事件类简名**，内部类用点号代替 `$`：\n\n```text\n[事件]EntityJoinLevelEvent\n$世界.广播 %entity.name% 加入了 %entity.dimension%$\n```\n\n- **按订阅注册**：宿主在开服 `loadAll` 后、以及 `/nebula load|reload|unload|debug|undebug`\n  之后读一次订阅表，只给词库真正写了词条的事件挂监听器。没订阅就一个额外监听器都没有，\n  也不会多跨一次 JNI。订阅表来自 Rust 侧 `eventTriggers(handle)`。\n- **payload 用 Java 字段名**：反射遍历事件的 public getter，`getEntity()` → `%entity%`、\n  `getPos()` → `%pos%`、`isCanceled()` → `%canceled%`，另有 `%eventClass%`（完整类名）。\n  复杂对象转成 JSON：`Entity` → `{name,id,type,dimension,x,y,z}`，`BlockPos` → `{x,y,z}`，\n  `ItemStack` → `{item,count}`，`Identifier` / `Component` / `UUID` / 枚举 → 字符串；\n  集合最多 32 项，未知对象只留 200 字符以内的短字符串。**payload 里没有 Java 对象引用**。\n- **可取消**：事件实现 `ICancellableEvent` 时，`$世界.取消事件$` 会真的 `setCanceled(true)`；\n  否则无效（与内置事件口径一致）。\n- **高频节流**：`EntityTickEvent.*` / `PlayerTickEvent.*` / `LevelTickEvent.*` /\n  `ServerTickEvent.*` 每实体 / 每维度每 tick 都触发，宿主按 **20 tick（1 秒）** 节流后\n  才分发。别指望逐帧精度；真要逐帧请下沉到宿主 Java 侧（如 `FloatingText.tick`）。\n- **加载期事件收不到**：`RegisterCommandsEvent`、`BuildCreativeModeTabContentsEvent` 这类\n  在 mod 加载阶段就发完了，专用服运行时订阅也收不到，宿主会记一条 WARN。客户端专用事件类\n  在服务端不存在，注册时跳过。清单中的辅助枚举 / 接口 / 抽象基类也会被运行时过滤。\n- **内置事件不重复**：`玩家聊天` / `实体受伤` / `实体治疗` / `方块破坏` / `玩家进入` /\n  `每秒` 这 6 个中文名由宿主手写 handler 分发，不在清单里，写它们仍是原来的语义。\n- 升级 MC / NeoForge 版本后要重跑 `python mod/tools/gen_events.py` 再全量构建；\n  `regress.py` 会按内容比对 jar 内清单，滞后就报「产物与源码不一致」。\n\n清单本身是构建期快照，不是运行时反射扫 classpath；想看某个版本有哪些可订阅事件，\n直接查 `mod/src/main/resources/nebula/events.json`。\n\n真机验证：`regress.py` 的自检词库订阅了 `[事件]EntityJoinLevelEvent`，开服后宿主动态注册该\n监听器，假玩家进服时收到 `%eventClass%` / `%entity.name%` 并写进日志（19/19 PASS 里的\n「通用事件桥动态注册」一项）。改词库后 `/nebula reload <插件>` 会刷新订阅表，无需重启。\n\n## 调试\n\n```text\n/nebula list                    确认插件已加载\n/nebula debug <插件>            改 .n 即自动重编译\n/nebula undebug <插件>          关闭\n```\n\n触发事件没反应时，先在事件第一行放一个 `$世界.提示 %玩家名% 事件到了$`，确认是不是根本没分发；\n再逐行排查 `$调用$` 结尾的 `$`、块闭合与变量名。完整排错清单见\n[`plugin-guide.md`](../plugin-guide.md) 第 10 节。\n"}, "block": {"file": "apis/方块.md", "title": "方块", "group": "API 参考", "text": "# 方块 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Block。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取方块`](#取方块) | 查询 | `$世界.取方块 维度 X Y Z$` |\n| [`取方块数据`](#取方块数据) | 查询 | `$世界.取方块数据 维度 X Y Z$` |\n| [`获取方块`](#获取方块) | 查询 | `$世界.获取方块 维度 X Y Z$` |\n| [`取相邻方块`](#取相邻方块) | 查询 | `$世界.取相邻方块 方块数据 维度 X Y Z [预算]$` |\n| [`取方块标签`](#取方块标签) | 查询 | `$世界.取方块标签 维度 X Y Z$` |\n| [`设方块`](#设方块) | 动作 | `$世界.设方块 维度 X Y Z 方块名$` |\n| [`设方块状态`](#设方块状态) | 动作 | `$世界.设方块状态 维度 X Y Z 名称 [状态]$` |\n| [`设方块数据`](#设方块数据) | 动作 | `$世界.设方块数据 维度 X Y Z 数据文本$` |\n| [`破坏方块`](#破坏方块) | 动作 | `$世界.破坏方块 维度 X Y Z$` |\n| [`取生物群系`](#取生物群系) | 查询 | `$世界.取生物群系 维度 X Y Z$` |\n| [`设生物群系`](#设生物群系) | 动作 | `$世界.设生物群系 维度 X1 Z1 X2 Z2 群系$` |\n| [`填充区域`](#填充区域) | 动作 | `$世界.填充区域 维度 X1 Y1 Z1 X2 Y2 Z2 方块$` |\n\n---\n\n### 取方块\n\n`$世界.取方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getBlockState(BlockPos)` → `BuiltInRegistries.BLOCK.getKey`\n\n示例：\n\n```text\n方块:$世界.取方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 取方块数据\n\n`$世界.取方块数据 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`BlockState#toString()`（含属性文本）\n\n示例：\n\n```text\n结果:$世界.取方块数据 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 获取方块\n\n`$世界.获取方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：方块对象：`名称` / `数据` / `标签` / `生物群系`\n\n示例：\n\n```text\n结果:$世界.获取方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 取相邻方块\n\n`$世界.取相邻方块 方块数据 [预算]$ 或 $世界.取相邻方块 维度 X Y Z [预算]$`\n\n- 参数：\n  - 方块数据 : `String`\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 预算 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：26 邻域 `BlockPos.offset` + `getBlockState`，跳过空气，`ServerLevel#isLoaded` 防加载区块\n\n示例：\n\n```text\n邻:$世界.取相邻方块 %方块% 64$\n```\n\n> 注意：两种调用形式二选一：传方块数据 JSON，或传 `维度 X Y Z` 坐标；`预算` 限制扫描格数。\n\n\n### 取方块标签\n\n`$世界.取方块标签 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Array`\n- 失败回退：查询失败返回空数组 `[]`\n- 实现：`BlockState#getTags()` → `TagKey#location`\n\n示例：\n\n```text\n结果:$世界.取方块标签 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 设方块\n\n`$世界.设方块 维度 X Y Z 方块名$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 方块名 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：原版 `setblock` 命令（Brigadier `parse + execute`），跨维度时加 `execute in <维度>` 前缀\n\n示例：\n\n```text\n$世界.设方块 minecraft:overworld 0 64 0 minecraft:diamond_block$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：动作延迟执行：同一词条里紧接着 `$世界.取方块$` 读到的仍是旧方块。\n\n\n### 设方块状态\n\n`$世界.设方块状态 维度 X Y Z 名称 [状态]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 名称 : `String`\n  - 状态 : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：状态 = 空（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`BlockStateParser` 解析 `名称[属性=值]` 后 `setBlock`\n\n示例：\n\n```text\n$世界.设方块状态 minecraft:overworld 0 64 0 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 设方块数据\n\n`$世界.设方块数据 维度 X Y Z 数据文本$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - 数据文本 : `String`；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：同上，整段 `BlockState` 文本解析\n\n示例：\n\n```text\n$世界.设方块数据 minecraft:overworld 0 64 0 {}$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 破坏方块\n\n`$世界.破坏方块 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#destroyBlock(BlockPos, drop)`\n\n示例：\n\n```text\n$世界.破坏方块 minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取生物群系\n\n`$世界.取生物群系 维度 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getBiome(BlockPos)` → `Biome` 注册名\n\n示例：\n\n```text\n结果:$世界.取生物群系 minecraft:overworld 0 64 0$\n```\n\n> 注意：区块未加载时返回空，先 `$世界.区块已加载$` 判断或让管理员 `/forceload add`。\n\n\n### 设生物群系\n\n`$世界.设生物群系 维度 X1 Z1 X2 Z2 群系$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X1 : `Integer`\n  - Z1 : `Integer`\n  - X2 : `Integer`\n  - Z2 : `Integer`\n  - 群系 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#getChunk` + 区块 biome 写入\n\n示例：\n\n```text\n$世界.设生物群系 minecraft:overworld 0 0 3 3 minecraft:plains$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：走 `fillbiome`，Y 范围固定 -64 ~ 319。\n\n\n### 填充区域\n\n`$世界.填充区域 维度 X1 Y1 Z1 X2 Y2 Z2 方块$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X1 : `Integer`\n  - Y1 : `Integer`\n  - Z1 : `Integer`\n  - X2 : `Integer`\n  - Y2 : `Integer`\n  - Z2 : `Integer`\n  - 方块 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：循环 `ServerLevel#setBlock`，限制格数与 `scan_budget`\n\n示例：\n\n```text\n$世界.填充区域 minecraft:overworld 0 64 0 3 65 3 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n"}, "coord": {"file": "apis/坐标.md", "title": "坐标", "group": "API 参考", "text": "# 坐标 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Basic。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取玩家坐标`](#取玩家坐标) | 查询 | `$世界.取玩家坐标 玩家$` |\n| [`取复活点坐标`](#取复活点坐标) | 查询 | `$世界.取复活点坐标$` |\n| [`设复活点`](#设复活点) | 动作 | `$世界.设复活点 X Y Z$` |\n\n---\n\n### 取玩家坐标\n\n`$世界.取玩家坐标 玩家$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`ServerPlayer#getX/getY/getZ`\n\n示例：\n\n```text\n结果:$世界.取玩家坐标 %玩家名%$\n```\n\n\n### 取复活点坐标\n\n`$世界.取复活点坐标$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`ServerLevel#getSharedSpawnPos()`\n\n示例：\n\n```text\n结果:$世界.取复活点坐标$\n```\n\n\n### 设复活点\n\n`$世界.设复活点 X Y Z$`\n\n- 参数：\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#setDefaultSpawnPos(BlockPos, float)`\n\n示例：\n\n```text\n$世界.设复活点 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n"}, "player": {"file": "apis/玩家.md", "title": "玩家", "group": "API 参考", "text": "# 玩家 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Player / Item。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 玩家移除标签 玩家 标签$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 标签 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#addTag` / `removeTag` / `getTags`\n\n示例：\n\n```text\n$世界.玩家移除标签 %玩家名% vip$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 玩家有标签\n\n`$世界.玩家有标签 玩家 标签$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 标签 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`Entity#addTag` / `removeTag` / `getTags`\n\n示例：\n\n```text\n结果:$世界.玩家有标签 %玩家名% vip$\n```\n\n\n### 设置玩家出生点\n\n`$世界.设置玩家出生点 玩家 维度 X Y Z$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#setRespawnPosition`\n\n示例：\n\n```text\n$世界.设置玩家出生点 %玩家名% minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 设置区块半径\n\n`$世界.设置区块半径 玩家 数值$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 8（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ClientboundSetChunkCacheRadiusPacket(int)`\n\n示例：\n\n```text\n$世界.设置区块半径 %玩家名% 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 重发区块\n\n`$世界.重发区块 玩家 [半径]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 半径 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 0（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ClientboundLevelChunkWithLightPacket` 重发附近已加载区块，半径 0~2\n\n示例：\n\n```text\n$世界.重发区块 %玩家名%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 打开背包\n\n`$世界.打开背包 玩家$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：客户端本地 `InventoryScreen`，服务端不接管；用 `创建界面` + `打开界面` 替代\n\n示例：\n\n```text\n$世界.打开背包 %玩家名%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：**唯一占位**：玩家背包是客户端本地界面，服务端不接管，宿主只记一条 WARN。用 `创建界面` + `打开界面` 代替。\n\n\n### 播放动作\n\n`$世界.播放动作 玩家 动作$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 动作 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ClientboundAnimatePacket`\n\n示例：\n\n```text\n$世界.播放动作 %玩家名% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 骑乘\n\n`$世界.骑乘 玩家 实体id$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 实体id : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`startRiding` / `stopRiding`\n\n示例：\n\n```text\n$世界.骑乘 %玩家名% %实体.id%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取消骑乘\n\n`$世界.取消骑乘 玩家 实体id$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 实体id : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`startRiding` / `stopRiding`\n\n示例：\n\n```text\n$世界.取消骑乘 %玩家名% %实体.id%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 攻击\n\n`$世界.攻击 玩家 实体id$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 实体id : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#attack` / `interactOn`\n\n示例：\n\n```text\n$世界.攻击 %玩家名% %实体.id%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 交互\n\n`$世界.交互 玩家 实体id$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 实体id : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#attack` / `interactOn`\n\n示例：\n\n```text\n$世界.交互 %玩家名% %实体.id%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n"}, "world": {"file": "apis/世界与服务器.md", "title": "世界与服务器", "group": "API 参考", "text": "# 世界与服务器 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Server。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`weather` 命令\n\n示例：\n\n```text\n$世界.更新天气 clear 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取难度\n\n`$世界.取难度 [难度]$`\n\n- 参数：\n  - 难度 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`ServerLevel#getDifficulty` / `MinecraftServer#setDifficulty`\n\n示例：\n\n```text\n结果:$世界.取难度$\n```\n\n\n### 设难度\n\n`$世界.设难度 [难度]$`\n\n- 参数：\n  - 难度 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#getDifficulty` / `MinecraftServer#setDifficulty`\n\n示例：\n\n```text\n$世界.设难度$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取种子\n\n`$世界.取种子$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`ServerLevel#getSeed()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取种子$\n```\n\n\n### 取游戏规则\n\n`$世界.取游戏规则 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `Boolean`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`MinecraftServer#getGameRules()` + 规则键映射\n\n示例：\n\n```text\n结果:$世界.取游戏规则 minecraft:stone$\n```\n\n\n### 设游戏规则\n\n`$世界.设游戏规则 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `String`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#getGameRules()` + 规则键映射\n\n示例：\n\n```text\n$世界.设游戏规则 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 保存世界\n\n`$世界.保存世界$`\n\n- 参数：无\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#saveEverything` / 区块保存\n\n示例：\n\n```text\n$世界.保存世界$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取睡眠状态\n\n`$世界.取睡眠状态$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`ServerLevel` 睡眠状态 API\n\n示例：\n\n```text\n结果:$世界.取睡眠状态$\n```\n\n\n### 区块已加载\n\n`$世界.区块已加载 维度 区块X 区块Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 区块X : `Integer`\n  - 区块Z : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`ServerLevel#isLoaded` / `getChunkSource`\n\n示例：\n\n```text\n结果:$世界.区块已加载 minecraft:overworld 1 1$\n```\n\n\n### 取TPS\n\n`$世界.取TPS$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getAverageTickTime` + 桥接层滑动窗口\n\n示例：\n\n```text\n结果:$世界.取TPS$\n```\n\n> 注意：宿主用 `ServerTickEvent.Pre/Post` 的 40 tick 滑窗自己统计，不读服务端内部字段。\n\n\n### 取MSPT\n\n`$世界.取MSPT$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getAverageTickTime` + 桥接层滑动窗口\n\n示例：\n\n```text\n结果:$世界.取MSPT$\n```\n\n\n### 取服务器tick\n\n`$世界.取服务器tick$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`MinecraftServer#getTickCount()`\n\n示例：\n\n```text\n结果:$世界.取服务器tick$\n```\n\n\n### 取协议版本\n\n`$世界.取协议版本$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Float`\n- 失败回退：查询失败返回`0`\n- 实现：`SharedConstants.getCurrentVersion().protocolVersion()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取协议版本$\n```\n\n\n### 取服务器版本\n\n`$世界.取服务器版本$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`MinecraftServer#getServerVersion()`（1.21.11 公开 API）\n\n示例：\n\n```text\n结果:$世界.取服务器版本$\n```\n\n\n### 取环境变量\n\n`$世界.取环境变量 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `Boolean`（可选参数，省略时用宿主默认值）；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`System#getenv`；设置只影响桥接层自己的调度\n\n示例：\n\n```text\n结果:$世界.取环境变量 minecraft:stone$\n```\n\n\n### 设环境变量\n\n`$世界.设环境变量 名称 [值]$`\n\n- 参数：\n  - 名称 : `String`\n  - 值 : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`System#getenv`；设置只影响桥接层自己的调度\n\n示例：\n\n```text\n$世界.设环境变量 minecraft:stone$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取本地时间\n\n`$世界.取本地时间$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：`LocalDateTime.now()`\n\n示例：\n\n```text\n结果:$世界.取本地时间$\n```\n\n\n### 设置tick冻结\n\n`$世界.设置tick冻结 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.设置tick冻结 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：1.20.3 起有原生 `/tick` 命令，不需要 Mixin。\n\n\n### 步进tick\n\n`$世界.步进tick 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Integer`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.步进tick 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 设置tick加速\n\n`$世界.设置tick加速 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Float`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n$世界.设置tick加速 是 1$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取模拟暂停\n\n`$世界.取模拟暂停 是|否 数值$`\n\n- 参数：\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n  - 数值 : `Integer`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`/tick freeze|unfreeze|step|rate` 命令 + `ServerTickRateManager#isFrozen()`；1.20.3 起原生支持，无需 Mixin\n\n示例：\n\n```text\n结果:$世界.取模拟暂停 是 1$\n```\n"}, "entity": {"file": "apis/实体.md", "title": "实体", "group": "API 参考", "text": "# 实体 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Entity / Particle。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`生成生物`](#生成生物) | 动作 | `$世界.生成生物 维度 类型 X Y Z$` |\n| [`生成实体`](#生成实体) | 动作 | `$世界.生成实体 维度 类型 X Y Z [NBT]$` |\n| [`生成粒子`](#生成粒子) | 动作 | `$世界.生成粒子 维度 效果 X Y Z$` |\n| [`取实体列表`](#取实体列表) | 查询 | `$世界.取实体列表 [维度] [上限]$` |\n| [`取实体坐标`](#取实体坐标) | 查询 | `$世界.取实体坐标 实体id$` |\n| [`取实体数据`](#取实体数据) | 查询 | `$世界.取实体数据 实体id$` |\n| [`实体传送`](#实体传送) | 动作 | `$世界.实体传送 实体id 维度 X Y Z$` |\n| [`实体伤害`](#实体伤害) | 动作 | `$世界.实体伤害 实体id …$` |\n| [`实体治疗`](#实体治疗) | 动作 | `$世界.实体治疗 实体id …$` |\n| [`实体击杀`](#实体击杀) | 动作 | `$世界.实体击杀 实体id …$` |\n| [`实体移除`](#实体移除) | 动作 | `$世界.实体移除 实体id …$` |\n| [`实体加标签`](#实体加标签) | 动作 | `$世界.实体加标签 实体id 标签$` |\n| [`实体移除标签`](#实体移除标签) | 动作 | `$世界.实体移除标签 实体id 标签$` |\n| [`实体有标签`](#实体有标签) | 查询 | `$世界.实体有标签 实体id 标签$` |\n| [`取实体属性`](#取实体属性) | 查询 | `$世界.取实体属性 实体id 属性$` |\n| [`实体隐身`](#实体隐身) | 动作 | `$世界.实体隐身 实体id 是|否$` |\n| [`悬浮字`](#悬浮字) | 动作 | `$世界.悬浮字 维度 X Y Z 文本 [缩放] [上升] [时长]$` |\n\n---\n\n### 生成生物\n\n`$世界.生成生物 维度 类型 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 类型 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`EntityType#create(ServerLevel)` + `moveTo` + `addFreshEntity`\n\n示例：\n\n```text\n$世界.生成生物 minecraft:overworld minecraft:pig 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 生成实体\n\n`$世界.生成实体 维度 类型 X Y Z [NBT]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 类型 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n  - NBT : `String`（可选参数，省略时用宿主默认值）；`Text` 类型，吞掉该位次之后的全部实参并用空格拼接\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数据 = 空（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`summon` 命令 + 可选 NBT（NBT 不含空格）\n\n示例：\n\n```text\n$世界.生成实体 minecraft:overworld minecraft:pig 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：原设计的整段 SNBT 改为 `维度 类型 X Y Z [NBT]`，NBT 不能含空格。\n\n\n### 生成粒子\n\n`$世界.生成粒子 维度 效果 X Y Z$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - 效果 : `String`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerLevel#sendParticles(ParticleOptions, …)`\n\n示例：\n\n```text\n$世界.生成粒子 minecraft:overworld minecraft:speed 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 取实体列表\n\n`$世界.取实体列表 [维度] [上限]$`\n\n- 参数：\n  - 维度 : `String`（可选参数，省略时用宿主默认值）；注册名，如 `minecraft:overworld`\n  - 上限 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Array`\n- 默认值：上限 = 512（省略该尾部参数时）\n- 失败回退：查询失败返回空数组 `[]`\n- 实现：`ServerLevel#getAllEntities` / `getEntities`；上限默认 512，最大 512\n\n示例：\n\n```text\n结果:$世界.取实体列表$\n```\n\n> 注意：默认 / 最大 512 条。整表可能数百字符，长结果要传 `上限` 或分批输出。\n\n\n### 取实体坐标\n\n`$世界.取实体坐标 实体id$`\n\n- 参数：\n  - 实体id : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：`Entity#getX/getY/getZ`\n\n示例：\n\n```text\n结果:$世界.取实体坐标 %实体.id%$\n```\n\n\n### 取实体数据\n\n`$世界.取实体数据 实体id$`\n\n- 参数：\n  - 实体id : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Object`\n- 失败回退：查询失败返回空对象 `{}`\n- 实现：实体快照\n\n示例：\n\n```text\n结果:$世界.取实体数据 %实体.id%$\n```\n\n\n### 实体传送\n\n`$世界.实体传送 实体id 维度 X Y Z$`\n\n- 参数：\n  - 实体id : `String`\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Integer`\n  - Y : `Integer`\n  - Z : `Integer`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#teleportTo(ServerLevel, …)`\n\n示例：\n\n```text\n$世界.实体传送 %实体.id% minecraft:overworld 0 64 0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体伤害\n\n`$世界.实体伤害 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `Float`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 1（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体伤害 %实体.id% 1.0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体治疗\n\n`$世界.实体治疗 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `Float`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：数值 = 1（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体治疗 %实体.id% 1.0$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体击杀\n\n`$世界.实体击杀 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体击杀 %实体.id% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体移除\n\n`$世界.实体移除 实体id …$`\n\n- 参数：\n  - 实体id : `String`\n  - … : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`hurt` / `LivingEntity#heal` / `kill` / `discard`\n\n示例：\n\n```text\n$世界.实体移除 %实体.id% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体加标签\n\n`$世界.实体加标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n$世界.实体加标签 %实体.id% vip$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体移除标签\n\n`$世界.实体移除标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n$世界.实体移除标签 %实体.id% vip$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 实体有标签\n\n`$世界.实体有标签 实体id 标签$`\n\n- 参数：\n  - 实体id : `String`\n  - 标签 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`Boolean`\n- 失败回退：查询失败返回`否`\n- 实现：`Entity#addTag/removeTag/getTags`\n\n示例：\n\n```text\n结果:$世界.实体有标签 %实体.id% vip$\n```\n\n\n### 取实体属性\n\n`$世界.取实体属性 实体id 属性$`\n\n- 参数：\n  - 实体id : `String`\n  - 属性 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String`\n- 失败回退：查询失败返回空串\n- 实现：反射查 `Attributes` 常量 + `getAttributeValue`\n\n示例：\n\n```text\n结果:$世界.取实体属性 %实体.id% 示例文本$\n```\n\n\n### 实体隐身\n\n`$世界.实体隐身 实体id 是|否$`\n\n- 参数：\n  - 实体id : `String`\n  - 是|否 : `Boolean`；`是 / true / 1 / 开 / 真 / yes / on` 视为真\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：值 = 是（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Entity#setInvisible`\n\n示例：\n\n```text\n$世界.实体隐身 %实体.id% 是$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 悬浮字\n\n`$世界.悬浮字 维度 X Y Z 文本 [缩放] [上升] [时长]$`\n\n- 参数：\n  - 维度 : `String`；注册名，如 `minecraft:overworld`\n  - X : `Float`\n  - Y : `Float`\n  - Z : `Float`\n  - 文本 : `String`\n  - 缩放 : `Float`（可选参数，省略时用宿主默认值）\n  - 上升 : `Float`（可选参数，省略时用宿主默认值）\n  - 时长 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 默认值：缩放 = 1，上升 = 1，时长 = 20（省略该尾部参数时）\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Display.TextDisplay`：1.21.11 走 `EntityType.create(TagValueInput, Level, EntitySpawnReason.COMMAND)`（键名与 `/summon` 一致，setter 全是 private），宿主逐 tick `setPos` 上浮、到时 `discard`\n\n示例：\n\n```text\ny2:[%y%+%身高%]\n$世界.悬浮字 %维度% %x% %y2% %z% \"§6§l暴击 §e12.5\" 1.6 1.2 22$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：文本里的 `§` 颜色码由宿主解析成组件样式（TextDisplay 走实体元数据，客户端不会自己认 `§`），含空格必须用双引号包住。`缩放` / `上升` / `时长` 省略或 <= 0 时用 1.0 / 1.0 / 20。实体是原版 `minecraft:text_display`，客户端零依赖；到时自动移除。实体带 `nebula_fx` 标签，宿主每秒扫一次残留（崩服 / 区块卸载留下的），不会永久留在世界里。\n"}, "interact": {"file": "apis/交互与事件.md", "title": "交互与事件", "group": "API 参考", "text": "# 交互与事件 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Command / EventAPI。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`提示`](#提示) | 动作 | `$世界.提示 玩家 文本$` |\n| [`广播`](#广播) | 动作 | `$世界.广播 文本$` |\n| [`执行命令`](#执行命令) | 动作 | `$世界.执行命令 命令$` |\n| [`取消事件`](#取消事件) | 查询 | `$世界.取消事件$` |\n\n---\n\n### 提示\n\n`$世界.提示 玩家 文本$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 文本 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#sendSystemMessage(Component)`\n\n示例：\n\n```text\n$世界.提示 %玩家名% 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：事件里的裸文本行会被广播，只想让某个玩家看到就用这个方法。\n\n\n### 广播\n\n`$世界.广播 文本$`\n\n- 参数：\n  - 文本 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`PlayerList#broadcastSystemMessage(Component, false)`\n\n示例：\n\n```text\n$世界.广播 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 执行命令\n\n`$世界.执行命令 命令$`\n\n- 参数：\n  - 命令 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`MinecraftServer#getCommands().performPrefixedCommand(...)`\n\n示例：\n\n```text\n$世界.执行命令 say 你好$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：`say` 受 256 字符 chat 上限；宿主会吞掉命令回显，验证动作要用查询读回或原版 `execute if …` 反查。\n\n\n### 取消事件\n\n`$世界.取消事件$`\n\n- 参数：无\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：桥接层本次事件槽位 → `event.setCanceled(true)`\n\n示例：\n\n```text\n结果:$世界.取消事件$\n```\n\n> 注意：只对「可取消」的事件有效；桥接层把标志写在本次事件槽位，宿主分发结束后统一 `setCanceled(true)`。\n"}, "guicmd": {"file": "apis/指令与界面.md", "title": "指令与界面", "group": "API 参考", "text": "# 指令与界面 API\n\n> 手写维护，无生成脚本。对应 LLSE 分组：GameAPI / Command / GuiAPI。\n> 签名里 `[ ]` 是可选参数；参数格式、返回值类型与调试方式见 [`README.md`](README.md)。\n> **查询立即返回、动作延迟执行**；查询失败返回空串 / `{}` / `[]` / `0`，动作失败记 WARN。\n\n## 本页方法\n\n| 方法 | 类别 | 签名 |\n| --- | --- | --- |\n| [`取物品数`](#取物品数) | 查询 | `$世界.取物品数 玩家 物品$` |\n| [`注册指令`](#注册指令) | 动作 | `$世界.注册指令 规范名 [权限] 别名…$` |\n| [`注销指令`](#注销指令) | 动作 | `$世界.注销指令 规范名 别名…$` |\n| [`创建界面`](#创建界面) | 动作 | `$世界.创建界面 玩家 [行数] 标题…$` |\n| [`界面物品`](#界面物品) | 动作 | `$世界.界面物品 面 槽位 物品 数量 名称 说明 [发光]$` |\n| [`界面数据`](#界面数据) | 动作 | `$世界.界面数据 面 数据…$` |\n| [`打开界面`](#打开界面) | 动作 | `$世界.打开界面 面 回调$` |\n| [`点击消息`](#点击消息) | 动作 | `$世界.点击消息 玩家 段JSON$` |\n| [`输入界面`](#输入界面) | 动作 | `$世界.输入界面 玩家 标题 回调$` |\n| [`弹窗输入`](#弹窗输入) | 动作 | `$世界.弹窗输入 玩家 标题 提示 标签 最长 提交指令$` |\n| [`关闭界面`](#关闭界面) | 动作 | `$世界.关闭界面 面$` |\n| [`音效`](#音效) | 动作 | `$世界.音效 玩家 音效 [音量] [音调]$` |\n| [`给物品`](#给物品) | 动作 | `$世界.给物品 玩家 物品 [数量]$` |\n| [`扣物品`](#扣物品) | 动作 | `$世界.扣物品 玩家 物品 [数量]$` |\n\n---\n\n### 取物品数\n\n`$世界.取物品数 玩家 物品$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n- 返回值：查询结果（可赋值给变量）\n- 返回值类型：`String` / `Object`\n- 失败回退：查询失败返回空串 / `{}` / `[]`\n- 实现：遍历 `Inventory#items / armor / offhand` 的 `ItemStack#getCount`，返回总数\n\n示例：\n\n```text\n余:$世界.取物品数 %玩家名% minecraft:dirt$\n$世界.提示 %玩家名% \"§7余额：%余% 个泥土\"\n```\n\n\n### 注册指令\n\n`$世界.注册指令 规范名 [权限] 别名…$`\n\n- 参数：\n  - 规范名 : `String`\n  - 权限 : `String`（可选参数，省略时用宿主默认值）\n  - 别名… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`CommandDispatcher#register`；重复注册按插件 + 规范名幂等，权限变化拆旧节点重注册\n\n示例：\n\n```text\n$世界.注册指令 商店 0 shop 泥土商店$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：写在 `[f]初始化`（每次编译都跑，宿主去重）；`[f]卸载` 里要对应 `$世界.注销指令$`。改掉旧名字后旧入口要重启服务端才消失。\n\n\n### 注销指令\n\n`$世界.注销指令 规范名 别名…$`\n\n- 参数：\n  - 规范名 : `String`\n  - 别名… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：从根节点 children 按名字移除，只删该插件自己的入口\n\n示例：\n\n```text\n$世界.注销指令 商店 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 创建界面\n\n`$世界.创建界面 玩家 [行数] 标题…$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 行数 : `Integer`（可选参数，省略时用宿主默认值）\n  - 标题… : `String`\n- 返回值：界面对象 id（数字字符串）\n- 返回值类型：`String`\n- 失败回退：创建失败返回空串\n- 实现：返回界面对象 id；同时发 `清空界面` 动作建好容器，Rust 侧记录归属插件 / 玩家 / 标题\n\n示例：\n\n```text\n面:$世界.创建界面 %玩家名% 3 §a我的菜单$\n```\n\n> 注意：返回界面对象 id（数字字符串），后续 `界面物品` / `打开界面` / `关闭界面` 都要带这个 id。\n\n\n### 界面物品\n\n`$世界.界面物品 面 槽位 物品 数量 名称 说明 [发光]$`\n\n- 参数：\n  - 面 : `String`\n  - 槽位 : `Integer`\n  - 物品 : `String`\n  - 数量 : `Integer`\n  - 名称 : `String`\n  - 说明 : `String`\n  - 发光 : `String`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：校验对象归属后转成 `设界面物品` 动作（`ItemStack` + `CUSTOM_NAME / LORE / ENCHANTMENT_GLINT_OVERRIDE`）\n\n示例：\n\n```text\n$世界.界面物品 %面% 0 minecraft:diamond 1 minecraft:stone 说明文字$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 界面数据\n\n`$世界.界面数据 面 数据…$`\n\n- 参数：\n  - 面 : `String`\n  - 数据… : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：校验对象归属后转成 `设界面数据` 动作\n\n示例：\n\n```text\n$世界.界面数据 %面% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 打开界面\n\n`$世界.打开界面 面 回调$`\n\n- 参数：\n  - 面 : `String`\n  - 回调 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：存下函数值闭包，发 `开界面` 动作（带 `界面ID`）；同一玩家的旧界面对象自动失效\n\n示例：\n\n```text\n$世界.打开界面 %面% %点击%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n> 注意：第二个参数是 `点击:[函数] … 结束` 定义的函数值，按值捕获局部变量；宿主点击时把 payload 作为闭包的 `%参数1%` 传入。\n\n\n### 点击消息\n\n`$世界.点击消息 玩家 段JSON$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 段JSON : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：一行可点击聊天：段是 `[{文,命令,悬停}]`，宿主给每段挂 `ClickEvent.RunCommand`；点击即以玩家身份执行命令\n\n示例：\n\n```text\n$世界.点击消息 %玩家名% 示例文本$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 弹窗输入\n\n`$世界.弹窗输入 玩家 标题 提示 标签 最长 提交指令$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`）\n  - 标题 : `String`，支持 `§` 颜色码（宿主解析成组件样式）\n  - 提示 : `String`，弹窗正文，支持 `§` 颜色码\n  - 标签 : `String`，输入框左侧标签\n  - 最长 : `Int`，输入框 `max_length`（1~256）\n  - 提交指令 : `String`，已注册的指令名，**不带** `/`；宿主补上 ` $(pw)` 模板\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：玩家不存在 / 指令名为空 / 模板解析失败时不下发，不记异常\n- 实现：`Holder.direct(NoticeDialog)` 直接下发给该玩家；`canCloseWithEscape=false`，`after_action=close`；提交按钮挂 `dynamic/run_command`，客户端把输入值替换到 `$(pw)` 后把整条命令发给服务端\n\n> 这是 1.21.6 起才有的服务端可下发表单组件，低于 1.21.6 的版本不支持（当前 1.21.11 可用）。命令模板里的值会被引擎转义特殊字符，登录插件这类纯数字密码最稳妥。\n\n示例：\n\n```text\n$世界.弹窗输入 %玩家名% §8[§b星云§8]§f输入密码 §7请输入4-8位数字密码 密码 8 npw$\n```\n\n提交后客户端执行 `npw <输入值>`，词库在 `[指令]npw` 里收到完整密码。\n\n---\n\n### 输入界面\n\n`$世界.输入界面 玩家 标题 回调$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 标题 : `String`\n  - 回调 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：铁砧命名框当文本框：存函数值闭包，发 `输入界面` 动作（带 `界面ID`）；输入框初始为空，点成品格时 `clickGui` 回传 `{玩家名,文本,动作}`，其它槽位只读\n\n示例：\n\n```text\n$世界.输入界面 %玩家名% §a标题 %点击%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 关闭界面\n\n`$世界.关闭界面 面$`\n\n- 参数：\n  - 面 : `String`\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：发 `关界面` 动作并释放闭包\n\n示例：\n\n```text\n$世界.关闭界面 %面%$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 音效\n\n`$世界.音效 玩家 音效 [音量] [音调]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 音效 : `String`\n  - 音量 : `Float`（可选参数，省略时用宿主默认值）\n  - 音调 : `Float`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`ServerPlayer#playNotifySound(SoundEvent, SoundSource, float, float)`\n\n示例：\n\n```text\n$世界.音效 %玩家名% minecraft:ui.button.click$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 给物品\n\n`$世界.给物品 玩家 物品 [数量]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n  - 数量 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：`Inventory#add`，按最大堆叠分批，塞不下 `Player#drop`\n\n示例：\n\n```text\n$世界.给物品 %玩家名% minecraft:diamond$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n\n\n### 扣物品\n\n`$世界.扣物品 玩家 物品 [数量]$`\n\n- 参数：\n  - 玩家 : `String`；传玩家名或玩家 JSON 对象（自动取 `名称`），不要传 UUID\n  - 物品 : `String`\n  - 数量 : `Integer`（可选参数，省略时用宿主默认值）\n- 返回值：空串（动作排队执行）\n- 返回值类型：`Null`\n- 失败回退：动作失败返回空串并记 WARN\n- 实现：遍历背包 / 副手 / 盔甲扣减，不足时能扣多少扣多少\n\n示例：\n\n```text\n$世界.扣物品 %玩家名% minecraft:diamond$\n```\n\n> 注意：动作**延迟执行**：同一词条里紧接着查询会读到旧值，要到下一次事件 / reload 才生效。\n"}, "neoforge": {"file": "neoforge.md", "title": "设计与实现现状", "group": "设计与实现", "text": "# NeoForge 服务端设计与实现现状\n\n> 最后校准：2026-11-09。本文既记录设计决策，也标注代码里**真正落地了什么**。实现以\n> `mod/src/main/java/nebula/neoforge/` 与 `bridge/src/lib.rs` 为准；逐方法映射见\n> [`mc-api-map.md`](mc-api-map.md)，平台取舍见 [`platform-choice.md`](platform-choice.md)，\n> 三份文档的分工见 [`README.md`](README.md)。\n>\n> 标注口径：**已落地** = 代码里有对应实现；**规划** = 设计上保留、当前未实现；**已废弃** =\n> 早期设计后来被更简单的方案取代，保留说明避免有人照旧方案返工。\n\n## 1. 目标与边界\n\n- **宿主**：Minecraft Java 版专用服务端（1.21.11 / NeoForge 21.11.42 / Java 21）。\n- **词库**：`<gameDir>/nebula/<插件名>/`，入口 `main.n`，同目录顶层 `.n` 自动合并。\n- **桥接**：NeoForge mod 通过 JNI 调用 Rust `cdylib`，Rust 静态链接 `crates/nebula`。\n- **业务**：全部写在 `.n` 词库；Java 侧只做事件转发、命令注册、`世界` 原语与界面容器。\n- **不做**：客户端 mod、网络封包、词库下发、跨进程 IPC。\n- **已落地规模**：128 个 `世界` 方法（39 类查询分支 + 动作），5 个随服词库插件，一键回归自检 19/19 PASS。\n\n## 2. 运行时架构\n\n```text\nNeoForge 专用服务端\n  ├─ mods/nebula-neoforge-bridge-0.2.0.jar\n  │    ├─ nebula/neoforge/\n  │    │    ├─ NebulaMod.java       @Mod 入口：事件监听、/nebula 注册、动作落地\n  │    │    ├─ NativeBridge.java    JNI 声明 + 原生库解压加载\n  │    │    ├─ McApi.java           查询回调：读世界 → 文本 / JSON\n  │    │    ├─ McActions.java       动作落地：原版命令或稳定 API\n  │    │    ├─ McSupport.java       反射兜底、实体查找、物品快照、tick 统计\n  │    │    └─ GuiManager.java      箱子界面对象、点击拦截、会话清理\n  │    ├─ META-INF/neoforge.mods.toml\n  │    └─ META-INF/native/windows-x86_64/nebula_jni.dll\n  ├─ config/nebula-bridge/native/nebula_jni.dll   ← 运行时解压目标\n  └─ nebula/<插件名>/main.n …\n```\n\n数据流：\n\n```text\nNeoForge 事件（服务端主线程）\n  → NebulaMod 组装 payload JSON\n  → NativeBridge.dispatch / dispatchCommand / clickGui\n  → Rust 引擎分发到词库（事件帧 / [指令] 词条 / 界面点击闭包）\n  → 词库调用 $世界.方法 …$\n      查询：Rust → JNI → McApi.query（同步读世界，立即返回）\n      动作：Rust 收集进 actions 队列，dispatch 返回后由宿主 executeActions 落地\n  → 输出行由宿主广播 / 回给玩家；取消标志写回本次事件\n```\n\n> **动作是延迟执行的**：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是\n> 旧值，要到下一次事件 / reload 才生效。这是查询同步、动作走队列的直接后果，写词库时必须记住。\n\n早期架构图里的 `ServerLifecycle` / `EventBridge` / `ServerTaskQueue` / `NebulaCommand`\n**未落地**：生命周期、事件桥与命令注册目前都集中在 `NebulaMod`，异步结果回主线程尚未实现。\n\n## 3. mod 入口与生命周期\n\n### 3.1 入口\n\n```java\n@Mod(NebulaMod.MODID)   // MODID = \"nebula_bridge\"\npublic final class NebulaMod {\n    public NebulaMod() { /* 只注册事件监听 */ }\n}\n```\n\n构造函数**不读配置、不定位路径、不加载原生库、不创建引擎**（此时服务端世界尚未就绪）。\n实际注册 12 个监听：`ServerStartedEvent`、`ServerStoppingEvent`、`ServerChatEvent`、\n`LivingDamageEvent.Post`、`LivingHealEvent`、`BlockEvent.BreakEvent`、\n`RegisterCommandsEvent`、`PlayerContainerEvent.Close`、`PlayerLoggedInEvent`、\n`PlayerLoggedOutEvent`、`ServerTickEvent.Pre/Post`。\n\n此外 `EventBridge` 在开服后按词库订阅**动态**注册其它 NeoForge 事件监听器（见 5.2），\n不在构造期写死；没有插件订阅时不挂任何额外监听器。\n\n### 3.2 生命周期表\n\n| 阶段 | 事件 | 实际动作 |\n| --- | --- | --- |\n| mod 构造 | `@Mod` 构造函数 | 注册上面 10 个监听，仅此而已 |\n| 服务端启动完成 | `ServerStartedEvent` | `NativeBridge.load()` → `create(<gameDir>/nebula)` → `loadAll()` → `executeActions`（落地插件指令注册） |\n| 每 tick | `ServerTickEvent.Pre/Post` | 只调 `McSupport.onTickPre/Post`，用 40 tick 滑窗算 TPS / MSPT / 服务器 tick；**不直接调用 JNI**（订阅 tick 事件的插件由通用事件桥节流到 20 tick 一次） |\n| 插件订阅变化 | 开服 `loadAll` / `/nebula load\\|reload\\|unload\\|debug\\|undebug` | 调 `EventBridge.refresh(handle)`：读 Rust 侧订阅表，增量增删 `IEventBus` 监听器 |\n| 命令注册 | `RegisterCommandsEvent` | 注册 `/nebula` 及其子命令，清空插件指令映射 |\n| 关界面 / 退出 | `PlayerContainerEvent.Close` / `PlayerLoggedOutEvent` | 清理界面会话、释放点击闭包 |\n| 服务端停止 | `ServerStoppingEvent` | `GuiManager.clearAll()`、清空插件指令、`NativeBridge.destroy(handle)` |\n\n两点容易误判：\n\n- `destroy` 只清空界面会话并 `drop(Bridge)`，**不会逐个执行 `[f]卸载`**；只有 `/nebula unload` 会跑卸载钩子。\n- 词库根固定为 `FMLPaths.GAMEDIR.get().resolve(\"nebula\")`，没有配置文件可改。\n\n### 3.3 命令\n\n| 命令 | 行为 |\n| --- | --- |\n| `/nebula list` | 列出插件及调试开关状态 |\n| `/nebula load\\|reload\\|unload <插件名\\|--all>` | 加载 / 重载 / 卸载 |\n| `/nebula debug\\|undebug <插件名\\|--all>` | 开关词库文件改动自动重编译 |\n\n控制台始终可用，玩家需 OP。早期设计里的 `/nebula 自检` **未落地**：自检能力由\n`mod/selftest/` 的独立测试服脚本提供。`[f]自检` 是词库侧约定，不是 `/nebula` 子命令。\n\n**插件指令**由词库自己注册，不再写进 `nebula.ini`：`[f]初始化` 里\n`$世界.注册指令 商店 0 shop 泥土商店$`，`[f]卸载` 里 `$世界.注销指令$`。宿主在\n`executeActions` 里增删 Brigadier 节点并 `sendCommands` 重发命令树；执行时按规范名匹配\n`[指令]商店|shop` 词条；没有对应词条时返回 `ok=false`。\n\n### 3.4 tick 与异步：设计与实现的差异\n\n| 早期设计 | 现状 |\n| --- | --- |\n| 每 tick 调 `NativeBridge.tick(handle, tickCount)` | **已废弃**：JNI 契约里没有 `tick`，tick 事件只用于统计 |\n| 热重载每 20 tick 轮询一次指纹 | **已废弃**：debug 插件在**每次事件分发前**比一次指纹 |\n| 编译放工作线程、成功后原子替换 | **已废弃**：`compile_plugin` 在调用线程同步执行，成功后用 `Mutex` 替换注册表 |\n| `$异步$` 结果投递 `ServerTaskQueue` 回主线程 | **规划**：该类未落地；当前 `世界` 查询/动作都在事件分发的主线程同步完成 |\n\n结论：现在不存在跨线程的 `世界` 调用，因此也就没有「非主线程访问 Minecraft 对象」的路径；\n代价是一次事件处理必须短小，长 IO 仍应避免（词库侧 `$异步$` 由 Rust 引擎维护）。\n\n## 4. 词库加载与热重载\n\n### 4.1 目录与元数据\n\n```text\n<gameDir>/\n├── mods/nebula-neoforge-bridge-<version>.jar\n├── config/nebula-bridge/native/nebula_jni.dll   ← 原生库解压目录（不是配置）\n└── nebula/                                      ← 词库根（固定）\n    └── <插件名>/\n        ├── main.n\n        ├── 其它.n          ← 目录顶层自动合并\n        ├── nebula.ini      ← 元数据，桥接层不解析\n        └── *.json          ← 插件自己的配置 / 商品数据\n```\n\n- 一个文件夹 = 一个插件，文件夹名即插件名；`_` / `.` 开头的目录禁用。\n- 入口 `main.n` 优先；没有 `main.n` 时只允许目录内唯一一个 `.n`；单文件 `$引入` 不再支持。\n- `nebula.ini` 目前是纯元数据（`名称` / `作者` / `地址` / `版本` / `描述`），**桥接层不读取**；\n  早期用它声明「指令」的做法已废弃。\n- 编译时会把插件目录注入成 `%库目录%`（词库 root，函数帧也能读），配置文件用\n  `$读文件 %库目录%/x.json$` 读取；`.json` 也纳入 debug 指纹。\n- `%时间%` / `%版本%` 是引擎内置系统变量，词库同名赋值会被遮蔽，变量名要加前缀。\n\n### 4.2 生命周期钩子（早期文档写错了，以此为准）\n\n| 钩子 | 触发时机 | 适合做什么 |\n| --- | --- | --- |\n| `[f]@头部` / `[f]初始化` | **每次编译**：load / loadAll / reload / debug 自动重编译 | 配置、状态、注册指令 |\n| `[f]加载` | 仅 `load` / `loadAll`（插件首次插入） | 「就绪」提示；reload 不跑 |\n| `[f]重载` | 仅 `reload` | 重载后的读回验证 |\n| `[f]卸载` | 仅 `/nebula unload`；关服 `destroy` 不跑 | 注销指令、释放资源 |\n\n`compile_plugin()` 编译成功后先跑 `@头部` + `初始化`，再由调用方按操作类型跑 `加载` / `重载`。\n**debug 自动重编译只跑 `初始化`**，不会跑 `加载` / `重载` / `卸载`——这是自检词库把\n「就绪」提示放在 `[f]加载`、把读回验证放在 `[f]重载` 的原因。\n\n其它编写约束：布局敏感（块外空行分隔词条，`如果尾` / `结束` 必须闭合）；一行只能一个\n`$调用$` 且**结尾 `$` 不能漏**；`[函数]` 帧不继承调用方作用域，配置 / 状态要显式传参；\n事件帧的父作用域是 `plugin.state`；函数值用 `回调:[函数] … 结束` 定义，作为实参传入后\n在被调时落到 `%参数1%`。详见 [`bridge/README.md`](../../bridge/README.md) 第 4、5 节。\n\n### 4.3 热重载与调试\n\n- `/nebula reload`：先编译新版本，成功才替换；词库写坏时旧版本继续可用。\n- `/nebula debug`：每次事件分发前比一次插件目录内全部 `.n` + `.json` 的「文件名 + 修改时间」\n  指纹；变了就同步重编译并替换，失败保留旧版本并记下这次指纹，同一份坏文件不会反复刷日志。\n- 手动 reload 不清除调试开关；`unload` 后重新 `load` 回到非调试状态。\n- 卸载插件会同时清掉它创建的界面对象回调，避免悬空闭包。\n\n## 5. 事件桥、指令与界面\n\n### 5.1 内置事件（6 个中文词条）\n\n| 词库词条 | NeoForge 事件 | 可取消 | payload 要点 |\n| --- | --- | --- | --- |\n| `[事件]玩家聊天` | `ServerChatEvent` | 是 | `玩家` / `玩家名` / `消息` / `管理员` / `潜行` / `维度` / `x,y,z` |\n| `[事件]实体受伤` | `LivingDamageEvent.Post` | 否（伤害已结算） | `攻击者` / `实体` / `伤害` / `剩余` / `身高` / `暴击` / `原因` / `致死`；只转发玩家造成的伤害，暴击按 `Player#attack` 的条件复算 |\n| `[事件]实体治疗` | `LivingHealEvent` | 否（回血已发生） | `实体` / `数值`（按上限截断后的真实回复）/ `之前` / `剩余` / `身高` / `原因`（自然回复 / 效果 / 其它）/ `满血`；已满血直接不转发 |\n| `[事件]方块破坏` | `BlockEvent.BreakEvent` | 是 | 玩家 + 方块 + 坐标快照 |\n| `[事件]玩家进入` | `PlayerLoggedInEvent` | 否 | `玩家` / `玩家名` / `管理员` / `维度`；每次连接都触发，登录插件用它重建会话 |\n| `[事件]每秒` | `ServerTickEvent.Post`（每 20 tick） | 否 | `服务器tick` / `在线人数`；给倒计时、超时踢人这类没有平台事件的逻辑用 |\n\n约定：payload 只含基础类型与 JSON，不跨线程持有 Minecraft 对象；事件异常只记日志并跳过该插件；\n取消标志由 Rust 写入本次事件槽位，宿主在 `executeActions` 前后统一 `event.setCanceled(true)`。\n事件输出行会被宿主广播 / 回给玩家，私聊用 `$世界.提示$`。\n这 6 个是语义定制的中文事件；其余 NeoForge 事件类走 5.2 的通用事件桥。\n\n### 5.2 通用事件桥（事件总线全量映射）\n\n`mod/tools/gen_events.py` 在构建期从 `neoforge-21.11.42-universal.jar` 抽出\n`net/neoforged/neoforge/event/**` 下的 267 个事件类，写成 jar 内的\n`nebula/events.json`（`name` = Java 类简名，内部类用 `.` 代替 `$`；`class` = 完整类名；\n`throttle` = tick 类事件的节流周期；`hint` = 加载期事件提示）。\n\n- **订阅驱动**：Rust 侧 `eventTriggers(handle)` 汇总所有插件 `dic_funcs[\"事件\"]` 的\n  trigger 名；`EventBridge.refresh` 与当前 `ACTIVE` 表做 diff，用\n  `IEventBus.addListener(EventPriority, boolean, Class, Consumer)` 注册新增的、\n  `unregister(consumer)` 摘掉不再订阅的。内置中文事件不在清单里，不会重复分发。\n- **payload**：反射遍历 public getter，按 Java 字段名注入（`getEntity()` → `%entity%`），\n  复杂对象结构化；未知类型只留短字符串。实现 `ICancellableEvent` 的事件支持\n  `$世界.取消事件$`。\n- **成本约束**：没有订阅就零额外 JNI；`EntityTickEvent` / `PlayerTickEvent` /\n  `LevelTickEvent` / `ServerTickEvent` 这类每实体 / 每 tick 事件按 20 tick 节流。\n  注册期 / 客户端专用类运行时被过滤，专用服收不到加载期事件时会记 WARN。\n- **信任链**：`build.ps1` 把清单打进 jar，`regress.py` 按内容比对 jar 内清单与源码，\n  升级 NeoForge 后不重新生成 + 全量构建就会报「产物与源码不一致」。\n\n词库写法见 [`apis/事件.md`](apis/事件.md) 末节与 [`plugin-guide.md`](plugin-guide.md) 第 4 节。\n\n### 5.3 界面与点击（不再需要 Mixin）\n\n早期把「物品栏点击事件」列为待拍板、认为必须 Mixin。`GuiManager` 用自定义 `ChestMenu`\n落地后，这条路已经不需要了：\n\n- `创建界面` 返回界面对象 id → `界面物品` / `界面数据` 只操作该对象 → `打开界面 面 回调` 把\n  `回调:[函数] … 结束` 闭包交给宿主；点击时 `NebulaMenu#clicked` 全拦截（不移动物品），\n  按菜单绑定的界面 id 调 `clickGui(handle, id, payload)`，Rust 直接执行闭包，payload 落在 `%参数1%`。\n- 界面统一用对象写法；缺少界面对象 id 的点击会被忽略并记 WARN。\n- 关窗 / 退出 / 卸载 / `destroy` 都会走 `closeGui` 释放闭包；同一玩家只保留最后一个打开的界面对象。\n- 覆盖面只到「词库自己打开的箱子界面」，原版容器与客户端本地背包界面不接管。\n\n### 5.4 唯一占位\n\n`$世界.打开背包$`：玩家背包是客户端本地 `InventoryScreen`，服务端不管理，宿主只记一条 WARN。\n需要界面时用 `创建界面` + `打开界面` 打开箱子界面。\n\n## 6. 线程模型\n\n- **硬约束不变**：Minecraft / NeoForge API 只能在服务端主线程调用；词库事件分发、`世界`\n  查询与动作落地全部同步发生在主线程。\n- 早期设计里「`McApi` 入口统一检查 `server.isSameThread()`」**未落地**——代码里没有这层断言。\n  当前之所以安全，是因为所有入口都从事件回调同步进来，没有第二条线程能触达 `McApi`。\n- 编译 / 热重载同步执行，替换靠 `Mutex`；`plugin.state` 与异步任务带 epoch，过期回调丢弃。\n- 词库事件里不要长时间 IO；`$异步$` 结果回主线程的 `ServerTaskQueue` 仍是规划项。\n\n## 7. 客户端 / 服务端边界\n\n- 只支持专用服务端；`neoforge.mods.toml` 里 `neoforge` / `minecraft` 依赖均标\n  `side = \"SERVER\"`，词库不下发客户端，客户端不装 mod 也能进服。\n- 早期设想的 `Dist` 守卫**未落地**：包里没有客户端专属类，靠「只在服务端事件里创建引擎」隔离。\n- 集成服务端（单人游戏）支持仍是独立评估项，不在当前范围。\n\n## 8. 构建、部署与配置\n\n### 8.1 版本（已锁定，不再是待拍板）\n\n| 项 | 当前值 |\n| --- | --- |\n| Minecraft | 1.21.11 |\n| NeoForge | 21.11.42（依赖范围 `[21.11,21.12)`） |\n| Java | 21（服务端自带 `.jdk/jdk-*`） |\n| Rust | stable，`cdylib`，`jni` crate |\n| 构建 | **没有 Gradle**：`build.ps1` 直接调 `cargo build --release` + `javac` + `jar` |\n\n**1.21.11 实现要点**：注册表 id 用 `Identifier`、`GameProfile.name()` 取用户名、\n`Inventory` 字段私有化后走 `McSupport.inventorySlots()` 槽位视图、\n`ComponentSerialization.CODEC` 序列化聊天组件、`EntityType.create(TagValueInput, …)` +\n`EntitySpawnReason.COMMAND` 建实体，权限判断走 `Commands.hasPermission(LEVEL_*)` /\n`permissions().hasPermission(...)`。能用公开 API 的地方直接调用（种子 / 协议号 / 时间 /\nFoodData / 实体交互），只有游戏规则、属性注册表与事件 getter 这类需要动态枚举的场景保留反射。\n\n`mods.toml` 依赖范围锁死为 `[1.21.11,1.21.12)` / `[21.11,21.12)`：其它 MC 版本有破坏性 API\n变更，用错版本编译的 jar 会因常量池方法引用懒解析而「服起得来、玩家一进就崩」。事件清单由\n`python mod/tools/gen_events.py` 从 21.11.42 的 universal jar 抽取（当前 267 个事件类），\n升级 NeoForge 必须重新生成。\n\n早期推荐的 ModDevGradle 2.x / NeoGradle 7.x 方案**未采用**：工程规模小，直接用服务端\n`libraries` 里的官方映射 jar 编译更省事。若将来引入 Mixin 或多模块再评估。\n\n### 8.2 构建脚本\n\n```powershell\npowershell -ExecutionPolicy Bypass -File mod/build.ps1            # 全量\npowershell -ExecutionPolicy Bypass -File mod/build.ps1 -SkipRust   # 只改 Java\n```\n\n四步：`cargo build --release` → `javac`（classpath 取 `server-1.21.11/libraries` 下除\n`-slim` / `-unpacked` 外的 jar，这两类带 SRG 名会编译失败）→ 复制 `neoforge.mods.toml`\n与 `nebula_jni.dll` 到 `build/classes/META-INF/` → `jar --create` 并部署到 `server-1.21.11/mods/`。\n`-RustTargetDir` 可指定 Rust 产物目录。`-SkipRust` 要求 `target/release/nebula_jni.dll` 已存在。\n脚本最后会打开 jar 比对内嵌 dll 与 release dll 的 SHA256——`Deployed` 只证明复制成功，不证明内容新。\n构建时还会把 `bridge/src/**/*.rs`、`Cargo.toml`、`src/main/java/**/*.java` 的逐文件 SHA256\n写进 jar 内 `META-INF/nebula-build.json`。全量构建还会在 `target/release/` 落下\n`nebula_jni.manifest.json`——与 dll 哈希绑定的一手记录，写明「这份 dll 由哪份 Rust 源码编出」；\n`-SkipRust` 不重编 dll，只读这份清单（不再信上一个 jar 的自述），清单缺失或 dll 哈希不符即失败。\n`bridge/build.rs` 在编译期把 `src/**/*.rs` + `Cargo.toml` 的逐文件 SHA256 经 `cargo:rustc-env`\n烧进 dll 的 `.rodata`（`NEBULA_SOURCES=` 标记）；`-SkipRust` 会比对清单记录与该标记，不一致即失败。\n\n### 8.3 原生库加载\n\n`NativeBridge.load()` 按 `os.name` / `os.arch` 拼出平台目录，从 jar 内\n`/META-INF/native/<platform>/` 解压到 `<gameDir>/config/nebula-bridge/native/`，再 `System.load`。\n`platform()` 能识别 windows / macos / linux × x86_64 / aarch64，但**构建脚本目前只打包\nwindows-x86_64**，其它平台需先扩展脚本。\n\n### 8.4 配置现状\n\n早期草案里的 `config/nebula-bridge.toml`（`wordlib.root` / `debug_poll_ticks` /\n`scan_budget` / `event.player_move`）**不存在，也没有被读取**。当前约定是：词库根固定、\ndebug 靠命令开关、事件集写死在 `NebulaMod` 构造函数里。`config/nebula-bridge/` 目录只放\n解压出来的原生库。要支持可配置，得同时改 Java 侧与 Rust 侧，作为后续项。\n\n### 8.5 一键回归\n\n`python mod/selftest/regress.py`（`--keep` 保留现场）：准备隔离服（端口 25566 /\nRCON 25576，目录联接共享 `libraries` / `.jdk`，独立 `level-name`）→ 启动两个 mineflayer\n假玩家 → 跑 `selftest/wordlib` → 按 `selftest/checks.json` 用原版 `execute if …` /\n`data get entity …` 批量反查 → 恢复 tick、RCON `stop`、清理。实测 **19/19 PASS、0 告警**。\n\n启服前先做**产物校验**：jar 内嵌 dll 与 `bridge/target/release/nebula_jni.dll` 的 SHA256 一致，\n并逐文件比对 `META-INF/nebula-build.json` 记录的源码内容指纹与工作区现状；\n不一致会报出具体变动文件并中止，避免用旧 jar 得出假 PASS。\n按**内容**而非修改时间判断，所以编辑器空保存不会误报；jar 无 manifest 时才退回 mtime 兜底。\n另外会拿 `target/release/nebula_jni.manifest.json` 做交叉校验（dll 哈希 + Rust 指纹），\n确保 jar 里的指纹来自 dll 产出时的一手记录，而不是上一个 jar 的转述。\n**最终一手证据来自 dll 自身**：回归脚本从 jar 内 dll 的字节里解析 `NEBULA_SOURCES=` 标记，\n与当前源码逐文件比对。即使 jar manifest 与原生库清单被同时伪造，只要 dll 没重编就会被拦住。\n信任链到此为止——再往上需要代码签名或可信构建，超出本地项目的范围。\n只想秒级检查用 `python mod/selftest/regress.py --verify-only`；`--skip-verify` 不推荐。\n升级 Minecraft / NeoForge 版本前先跑它，断言写在 `checks.json`。清理时先摘目录联接再删目录，\n**绝不碰 `server-1.21.11/world`**。线上服未开 RCON、stdin 不可注入，不要用 `taskkill` 代替 `stop`。\n\n## 9. 决策台账\n\n### 已定\n\n1. **版本**：Minecraft 1.21.11 / NeoForge 21.11.42 / Java 21。\n2. **构建**：`build.ps1` + `javac`，不引入 Gradle。\n3. **词库根**：`<gameDir>/nebula`（固定，不可配置）。\n4. **运行模式**：只支持专用服务端。\n5. **物品栏点击**：自定义 `ChestMenu` 拦截，不引入 Mixin；`打开背包` 保持占位。\n6. **原生库**：jar 内打包 + 运行时解压到 `config/nebula-bridge/native/`。\n7. **mod 元信息**：`modId = nebula_bridge`、`displayName = Nebula Bridge`、`license = All Rights Reserved`。\n8. **平台矩阵**：先只做 Windows x64；Linux / macOS 待扩展构建脚本。\n9. **插件指令**：词库自注册，不再读 `nebula.ini`。\n\n### 仍开放\n\n- Linux / macOS（含 aarch64）原生库打包与跨平台冒烟。\n- `nebula-bridge.toml` 配置化：词库根、事件开关、`scan_budget` 等。\n- `ServerTaskQueue`：`$异步$` 结果回主线程的正式通道。\n- 监听任意容器（含原版容器 / 玩家背包）时才考虑 Mixin `AbstractContainerMenu#clicked`。\n- 集成服务端支持；侧边栏分数行；完整 SNBT 实体生成。\n- 通用事件桥的高频事件按需分频（当前固定 20 tick 节流）。\n\n## 10. 验证清单\n\n| 项 | 状态 | 证据 |\n| --- | --- | --- |\n| 目录与基岩版对应、词库结构一致 | ✅ | `server-1.21.11/nebula/` 与 `bridge/README.md` |\n| 生命周期覆盖启动 / tick / 停止 / 命令，构造期不碰世界 | ✅ | `NebulaMod#onServerStarted` / `onServerStopping` |\n| 热重载失败回退、旧任务 epoch | ✅ | `op_reload` 先编译后替换；`bridge/src/lib.rs` 单测 |\n| 每个 `世界` 方法都能对应到实现或明确降级 | ✅ | 128 个方法全量落地，唯一占位 `打开背包`；见 `mc-api-map.md` |\n| 主线程同步、无跨线程 `世界` 调用 | ✅ | 动作走 `executeActions`，无 JNI tick |\n| 客户端/服务端边界明确 | ✅ | `side = \"SERVER\"`，客户端无需装 mod |\n| 构建产物布局可执行 | ✅ | `build.ps1` 构建部署成功；jar 已在 `server-1.21.11/mods/` |\n| 真机验证 | ✅ | 1.21.11 / 21.11.42：查询、动作、双假玩家、悬浮字 / 治疗 / 通用事件桥动态注册，19/19 PASS、0 告警；见 `mc-api-map.md` 第 0 节 |\n| Rust 单测 | ✅ | `cargo test --offline --lib` 7/7 通过（含文档 ↔ 代码双向断言、随服词库编译） |\n| 一键回归 | ✅ | `regress.py` 19/19 PASS、0 告警 |\n"}, "api": {"file": "mc-api-map.md", "title": "世界 方法映射（契约）", "group": "设计与实现", "text": "# `世界` 内置函数 ↔ NeoForge / Minecraft API 映射\n\n> 本文是**编译期契约**，不是事后补的说明：`bridge/src/lib.rs` 用 `include_str!` 把第 1~6 节的\n> 映射表读进单测，双向断言「文档里的方法都有函数、注册过的函数都写进了文档」。新增 / 删除方法\n> 的步骤见第 0 节末尾的「维护流程」。设计背景见 [`neoforge.md`](neoforge.md)，\n> 三份文档的分工见 [`README.md`](README.md)。\n\n约定：\n\n- 方法名、参数顺序、返回值形态与基岩版 `mc` 保持一致（Java 侧注入对象统一为 `世界`），便于词库迁移。\n- 使用 Mojang 官方映射（NeoForge 默认）；类名以 `net.minecraft.*` 为准。\n- **状态列**：`确认` = 方向明确，具体签名按目标版本落地；`待版本确认` = 方法存在但签名随版本变动；`需 Mixin` = 无公开事件/API；`不支持` = 明确不做。\n- 查询失败返回空串 / `{}` / `[]`；动作失败返回空串并记录日志。\n- 表格里的**状态列**是早期设计评估（`确认` / `待版本确认` / `需 Mixin`），不是实现状态；实现情况见下节。原「需 Mixin」的 tick 四项改走 1.20.3 起就有的原生 `/tick`，无需字节码增强。\n\n## 0. 实现状态（2026-11-08 全量落地）\n\n> **注入对象**：词库里统一写 `$世界.取方块 …$`。\n> 文件名 `mc-api-map.md` 沿用旧称，避免各处链接失效。\n\n映射表共 **128 个 `世界` 方法全部有对应函数**（22 个手写 hook + 106 个表驱动规格），\n词库调用时不会再出现「未知方法」。界面统一用「对象 + 点击闭包」。\n统一的规约是「一条映射 = 一个规格 = 一个函数」：\n\n| 层 | 文件 | 职责 |\n| --- | --- | --- |\n| 注入类 `世界` | `bridge/src/lib.rs` `mc_methods()` + `register_table_driven()` | 规格表把每个方法注册成 `NasFunc`；查询类构造请求 JSON 走 `java_query`，动作类压入动作队列 |\n| 查询回调 | `mod/.../McApi.java` | `op` → 读世界 → 返回文本 / JSON 文本 |\n| 动作落地 | `mod/.../McActions.java` | `op` → 原版命令或稳定 API；不确定的签名交给反射兜底 |\n| 通用支撑 | `mod/.../McSupport.java` | 反射调用、实体查找（id / UUID / 名称）、物品与实体快照、tick 统计、环境变量 |\n\n- 现有的 20 个手写 hook（提示 / 广播 / 界面对象 / 指令注册 / 取消事件 / 取相邻方块 / 取物品数等）保持不动，规格表只补缺失项。\n- 绝大多数动作用原版命令实现（`setblock` / `fill` / `fillbiome` / `effect` / `gamemode` / `experience` / `summon` / `particle` / `gamerule` / `save-all` …），好处是自带权限、掉落与客户端同步，也不受版本方法签名浮动影响。\n- 少数版本相关查询（种子、生物群系、方块标签、游戏规则、协议版本、实体属性、FoodData setter、经验进度等）走反射，读不到就返回空串 / 默认值，**不会让整个 mod 编译失败**。\n- `取TPS` / `取MSPT` / `取服务器tick` 由宿主自己统计 `ServerTickEvent.Pre/Post` 的 40 tick 滑窗，不依赖服务端内部字段。\n- 一致性由单测锁住：`cargo test --offline --lib` 里的 `every_mapped_mc_method_has_a_function` 会双向断言「文档每个方法都有函数、每个函数都写进了文档」，另有一条测试校验参数位次与布尔 / 文本 / 回退值。\n\n### 参数规约\n\n规格表按**参数位次**取值，字段命名如下（与宿主 JSON 一致）：\n\n| 词库实参 | 请求字段 | 说明 |\n| --- | --- | --- |\n| 玩家 | `玩家` | 接受玩家名，也接受 `%玩家%` 注入的 JSON 对象（自动取 `名称`） |\n| 维度 | `维度` | `minecraft:overworld` 这类注册名 |\n| 坐标 | `x` / `y` / `z` | 区域类用 `x1/y1/z1/x2/y2/z2`；区块类 `x`/`z` 是区块坐标 |\n| 实体 | `实体` | 数字 id / UUID / 名称都可以，命令里统一换成 UUID 选择器 |\n| 是/否 | `值` | `是 / true / 1 / 开 / 真 / yes / on` 视为真 |\n| 数值 | `数值` / `数量` / `时刻` / `秒` / `等级` … | 整型或浮点由规格表指定 |\n| 剩余文本 | `文本` / `原因` / `状态` / `数据` / `说明` | 吞掉该位次之后的全部参数，用空格拼接 |\n\n### 可选尾参（省略时用声明的默认值）\n\n**只有尾部参数可以省略**。词库按位置传实参，省掉中间参数会让后面的参数整体错位，所以规格表\n只对尾参用 `fd!` 声明默认值。省略时 `build_request` 直接写默认值，而不是让 `d.int()` 的 `0`\n混进宿主——否则「秒」会变成 1 秒而不是 30 秒、「数量」会被夹到 1 但语义不清。\n\n| 方法 | 可省参数 | 默认值 |\n| --- | --- | --- |\n| `给予物品` / `丢弃物品` / `设置副手` | 数量 | 1 |\n| `设背包物品` | 数量 | 1 |\n| `加效果` | 秒 / 等级 | 30 / 1 |\n| `治疗玩家` / `伤害玩家` / `实体伤害` / `实体治疗` | 数值 | 1 |\n| `加等级` / `加经验` | 数值 | 1 |\n| `设置等级` / `设置经验进度` | 数值 | 0 |\n| `设置饥饿` / `设置饱和度` / `设置消耗度` | 数值 | 20 / 5 / 0 |\n| `设置权限` | 等级 | 0 |\n| `设置能力` / `设置飞行` / `设置无敌` / `设置隐身` / `设置名牌可见` / `实体隐身` | 值 | 是 |\n| `取实体列表` | 上限 | 512 |\n| `设置区块半径` / `重发区块` | 数值 | 8 / 0 |\n| `悬浮字` | 缩放 / 上升 / 时长 | 1 / 1 / 20 |\n| `踢出玩家` / `设方块状态` / `生成实体` | 原因 / 状态 / 数据 | 空 |\n\n传全参数的行为完全不变；上面每一项都由 `optional_tail_params_use_defaults` 单测锁住。\n\n### 明确降级 / 占位 / 实现偏差\n\n| 方法 | 现状 |\n| --- | --- |\n| `打开背包` | **唯一占位**：玩家背包是客户端本地 `InventoryScreen`，服务端不管理；宿主记一条 WARN。需要界面时用 `创建界面` + `打开界面` 打开箱子界面 |\n| `生成实体` | 原设计的「整段 SNBT」改为 `维度 类型 X Y Z [NBT]`，走 `summon` 命令；NBT 不能含空格 |\n| `设生物群系` | 走 `fillbiome`，Y 范围固定 `-64 ~ 319` |\n| `更新天气` | 数值按 `weather rain <秒>` 原样传给命令 |\n| `设置权限` | 用 `op` / `deop` 近似「等级 > 0」，不是分级权限 |\n| `设置侧边栏` | 用全局 `nebula_sidebar` 目标，标题可重复更新（已存在走 `modify displayname`，不再 remove/add），暂不设置分数行 |\n| `交互` | `interactOn` 签名随版本浮动，按参数个数反射调用 |\n| `悬浮字` | `text_display` 的 `text` 是 **JSON 字符串**（用 `ComponentSerialization.CODEC` 序列化），不是组件 NBT。写成组件会被静默忽略：实体建得出来，但一个字都没有（`data get … text` 返回 `\"\"`）。宿主先用 `§` 解析器拼样式，再用 `ComponentSerialization.CODEC.encodeStart(JsonOps.INSTANCE, …)` 写入；`brightness` / `transformation` / `billboard` 走 codec，解析失败只记日志不影响实体创建。实体带 `nebula_fx` 标签，宿主每秒扫一次「带标签但不在活动列表」的残留并 discard，开服再扫一遍已加载区块——区块卸载 / 崩服留下的飘字不会永久留在存档里。**平滑要靠 `teleport_duration`（= Java 常量 `TAG_POS_ROT_INTERPOLATION_DURATION`）**：默认 0 时客户端每收到一次位置包就 `applyTargetPosAndRot` + `setOldPosAndRot`，逐 tick 改位置会变成 20 Hz 硬跳；给 2 tick 后走 `lerpPositionAndRotationStep`，渲染按帧过渡 |\n\n> 原先的 7 个占位已消除 6 个：tick 四方法改走 1.20.3 起就有的原生 `/tick`（不需要 Mixin），\n> `设置区块半径` / `重发区块` 改走 `ClientboundSetChunkCacheRadiusPacket` /\n> `ClientboundLevelChunkWithLightPacket` 两个原生封包。**目前只剩 `打开背包` 一个占位。**\n\n### 1.21.11 真机实测结论\n\n隔离服（独立端口 / RCON，不碰线上 world）跑全量查询与代表性动作后的结论：\n\n| 结论 | 说明 |\n| --- | --- |\n| 公开 API 直调 | `取种子` / `取协议版本` / `取时间` / `取服务器版本` 直接读 `ServerLevel#getSeed()` / `SharedConstants.getCurrentVersion().protocolVersion()` / `Level#getDayTime()` / `MinecraftServer#getServerVersion()`，不再按名字反射 |\n| tick 统计有效 | `取TPS` / `取MSPT` / `取服务器tick` 由 `ServerTickEvent.Pre/Post` 滑窗算出 |\n| 动作确实落地 | `设方块`、`设生物群系`、`设时间`、`设难度`、`设游戏规则`、`设复活点`、`生成生物` / `生成实体`、`设环境变量`、`保存世界`、`注册指令` 都能读回或用原版命令反查 |\n| 区块未加载 → 查询为空 | 方块类查询先用 `level.isLoaded` 判一次，未加载返回空串 / `{}` / `[]`。`/forceload add 0 0` 之后 `区块已加载=是`，四类方块查询立刻恢复。词库应先 `$世界.区块已加载$` 或用 `/forceload` |\n| 规则名按 id 匹配 | 静态常量字段名不稳定，按 `GameRules.Key#getId()` 匹配才能覆盖 `doDaylightCycle` 这类规则 |\n| 实体列表要设上限 | 默认最多 512 个实体；`取实体列表 维度 1` 只返回 1 条。整表可能数百字符，而 `say` 有 256 字符上限，长结果必须分批输出或传 `上限` |\n| 玩家类动作必须用名字 | `give <uuid>` / `experience set <uuid>` 会报「Only players may be affected…」；`tp` 接受实体所以 UUID 能用，但只允许玩家的命令会拒绝 UUID 字面量。宿主统一用 `GameProfile.name()`；**不能取实体的 `getName()`**，它会被 `设置名牌` 改成显示名 |\n| 玩家在线场景全通 | mineflayer 假玩家进服后，11 个玩家查询全部返回真实数据；给 / 扣物品、背包槽位、副手、等级 / 经验、饥饿 / 饱和度、飞行 / 能力、名牌、标签、传送、侧边栏等经读回或 NBT 反查生效 |\n| 命令失败现在可见 | 动作命令走 Brigadier `parse + execute`（`performPrefixedCommand` 返回 `void` 且吞异常）。真正的 `CommandSyntaxException` 会打 WARN；「状态没变 / 粒子无人可见 / objective 不存在」统一过滤 |\n| 占位只剩 `打开背包` | `/tick` 四方法、`设置区块半径`（`ClientboundSetChunkCacheRadiusPacket`）、`重发区块`（`ClientboundLevelChunkWithLightPacket`）均已原生落地，不需 Mixin；`打开背包` 是客户端本地界面，服务端不接管 |\n| 动作效果反查全通 | 12 项原版反查全部 PASS：方块状态 `[axis=x]`、方块数据、填充区域、下界跨维度 `execute in`、生成生物、难度 / 时间 / 效果 / 模式 / 侧边栏 |\n| 通用事件桥 | 清单来自 `neoforge-21.11.42-universal.jar`，267 个事件类按订阅动态注册；双假玩家进服触发 `EntityJoinLevelEvent` |\n| 一键回归 | `python mod/selftest/regress.py`：隔离服 + 双假玩家 + 原版命令反查 + 悬浮字 / 治疗 / 残留清理 + RCON `stop`，**19/19 PASS、0 告警** |\n| 手工复现 | 无玩家场景用 `[f]初始化` / `[f]重载` 跑查询与读回；玩家场景用 mineflayer 假玩家执行 `/自检` 触发 `[指令]` 词条；动作效果用原版 `execute if …` / `data get entity …` 反查 |\n\n词库层的两个坑（不属于 API 映射，但调用时会踩）：\n\n- `%时间%` 是引擎内置的 `Value::Time`（本地时间），`%版本%` 是引擎版本字符串；词库里给同名变量赋值会被系统变量遮蔽，应改用带前缀的名字（如 `%SC时刻%`）。\n- 动作是**延迟执行**的：同一词条里 `$世界.设方块 …$` 之后立刻 `$世界.取方块 …$` 读到的仍是旧值，要到下一次事件 / reload 才能读到结果。\n\n### 维护流程：新增 / 删除一个 `世界` 方法\n\n因为本文被编进单测，改方法不是「改完文档再补代码」，而是一次动 4 处，缺一处测试就会红：\n\n1. **本文第 1~6 节的映射表**：增删一行，方法名写在第一列反引号内（`/`、`,`、`，` 分隔的别名会被算成多个方法）。方法名里不要带空格、`[` 或 `$`，这些会被解析器跳过。\n2. **规格表**：`bridge/src/lib.rs` 的 `register_table_driven()` 加一条 `q!`（查询）或 `a!`（动作），按本文参数列声明参数位次与类型（`Str` / `Int` / `Float` / `Bool` / `Text` / `Player`）。\n3. **宿主分支**：查询加到 `mod/.../McApi.java`，动作加到 `McActions.java`（少数入口在 `NebulaMod.java`）；`op` 名必须与方法名一致。\n4. **跑测试**：`cargo test --offline --lib`。三条测试分别锁住文档 ↔ 函数（`every_mapped_mc_method_has_a_function`）、规格表 ↔ 宿主 switch（`every_method_has_a_host_handler`）、参数位次与回退值（`table_driven_request_shape`）。\n\n解析器的边界要记住：只从 `## 1. 方块` 开始读表格，遇到 `## 7.` 停止；只认以 `|` 开头的行，取第一列反引号里的内容；映射区里遇到事件表标题行后就不再收集（那里是事件名，不是方法）。所以**说明性文字一律写在第 0 节**，别塞进映射表格，否则会被误当成新方法。第 0 节里可以放心解释规则——`in_mapping_table` 为真之后才识别事件表标记，说明文字不会误触发。\n改降级 / 实测结论、补真机验证记录不影响解析，但改完记得跑一次测试。\n\n## 1. 方块\n\n| `世界` 方法 | 参数 | NeoForge / Minecraft API | 状态 |\n| --- | --- | --- | --- |\n| `取方块` | 维度 X Y Z | `ServerLevel#getBlockState(BlockPos)` → `BuiltInRegistries.BLOCK.getKey` | 确认 |\n| `取方块数据` | 维度 X Y Z | `BlockState#toString()`（含属性文本） | 确认 |\n| `获取方块` | 维度 X Y Z | 方块对象：`名称` / `数据` / `标签` / `生物群系` | 确认 |\n| `取相邻方块` | 方块数据 / 维度 X Y Z [预算] | 26 邻域 `BlockPos.offset` + `getBlockState`，跳过空气，`ServerLevel#isLoaded` 防加载区块 | 确认 |\n| `取方块标签` | 维度 X Y Z | `BlockState#getTags()` → `TagKey#location` | 待版本确认 |\n| `设方块` | 维度 X Y Z 方块名 | 原版 `setblock` 命令（Brigadier `parse + execute`） | 确认 |\n| `设方块状态` | 维度 X Y Z 名称 [状态] | `BlockStateParser` 解析 `名称[属性=值]` 后 `setBlock` | 待版本确认 |\n| `设方块数据` | 维度 X Y Z 数据文本 | 同上，整段 `BlockState` 文本解析 | 待版本确认 |\n| `破坏方块` | 维度 X Y Z | `ServerLevel#destroyBlock(BlockPos, drop)` | 确认 |\n| `取生物群系` | 维度 X Y Z | `ServerLevel#getBiome(BlockPos)` → `Biome` 注册名 | 确认 |\n| `设生物群系` | 维度 X1 Z1 X2 Z2 群系 | `ServerLevel#getChunk` + 区块 biome 写入 | 待版本确认 |\n| `填充区域` | 维度 X1 Y1 Z1 X2 Y2 Z2 方块 | 循环 `ServerLevel#setBlock`，限制格数与 `scan_budget` | 确认 |\n\n## 2. 坐标\n\n| `世界` 方法 | 参数 | API | 状态 |\n| --- | --- | --- | --- |\n| `取玩家坐标` | 玩家 | `ServerPlayer#getX/getY/getZ` | 确认 |\n| `取复活点坐标` | — | `ServerLevel#getSharedSpawnPos()` | 确认 |\n| `设复活点` | X Y Z | `ServerLevel#setDefaultSpawnPos(BlockPos, float)` | 待版本确认 |\n\n## 3. 玩家\n\n| `世界` 方法 | 参数 | API | 状态 |\n| --- | --- | --- | --- |\n| `取玩家状态` | 玩家名 / UUID | `PlayerList#getPlayerByName` / `getPlayer(UUID)` 快照 | 确认 |\n| `取玩家列表` | — | `PlayerList#getPlayers()` | 确认 |\n| `取玩家数量` | — | `getPlayers().size()` | 确认 |\n| `传送玩家` | 玩家 维度 X Y Z | `ServerPlayer#teleportTo(ServerLevel, x, y, z, yaw, pitch)` | 待版本确认 |\n| `设置模式` / `取玩家模式` | 模式 玩家 | `ServerPlayer#setGameMode(GameType)` / `getGameMode()` | 确认 |\n| `取玩家血量` / `治疗玩家` / `伤害玩家` / `击杀玩家` | 玩家 [数值] | `getHealth` / `heal` / `hurt(server.damageSources().generic(), n)` / `kill` | 确认 |\n| `踢出玩家` | 玩家 原因 | `ServerPlayer#connection#disconnect(Component)` | 确认 |\n| `扣耐久` | 点数 玩家 | `getMainHandItem()` + `ItemStack#setDamageValue` | 确认 |\n| `动作栏` | 玩家 文本 | `ServerPlayer#displayClientMessage(Component, true)` | 确认 |\n| `标题` | 玩家 主标题 [副标题] | `ClientboundSetTitleTextPacket` / `ClientboundSetSubtitleTextPacket` | 待版本确认 |\n| `设置侧边栏` / `清除侧边栏` | 玩家 文本 | `scoreboard objectives` 命令（只显示标题） | 已落地（命令） |\n| `设置等级` / `加等级` / `加经验` / `设置经验进度` | 玩家 数值 | `setExperienceLevels` / `giveExperiencePoints` / `
